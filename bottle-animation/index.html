<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bottle Animation Demo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Open Sans', sans-serif;
      background: #f4f5f7;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 24px;
    }

    .button-stack {
      display: flex;
      flex-direction: column;
      gap: 16px;
      align-items: center;
    }

    .confirm-btn {
      appearance: none;
      border: none;
      background: #00a699;
      color: #fff;
      font-family: inherit;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.3px;
      padding: 12px 36px;
      border-radius: 6px;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0,0,0,0.12);
      transition: background 0.15s, transform 0.05s;
      min-width: 220px;
    }

    .confirm-btn:hover { background: #009086; }
    .confirm-btn:active { transform: translateY(1px); }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(31, 45, 68, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 200ms ease;
      z-index: 10;
    }

    .modal-backdrop.is-open {
      opacity: 1;
      pointer-events: auto;
    }

    .modal {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 24px 48px rgba(0, 0, 0, 0.2);
      width: 100%;
      max-width: 520px;
      padding: 32px 32px 28px;
      position: relative;
      transform: translateY(8px);
      transition: transform 200ms ease;
    }

    .modal-backdrop.is-open .modal {
      transform: translateY(0);
    }

    .modal-title {
      font-size: 18px;
      font-weight: 700;
      color: #1f2d44;
      margin-bottom: 24px;
      text-align: center;
    }

    .modal-close {
      position: absolute;
      top: 12px;
      right: 12px;
      width: 32px;
      height: 32px;
      border: none;
      background: transparent;
      font-size: 22px;
      line-height: 1;
      color: rgba(31, 45, 68, 0.55);
      cursor: pointer;
      border-radius: 6px;
    }
    .modal-close:hover {
      background: rgba(31, 45, 68, 0.06);
      color: #1f2d44;
    }

    .stage {
      display: flex;
      gap: 80px;
      align-items: flex-start;
      justify-content: center;
      min-height: 280px;
    }

    .bottle {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .bottle-label {
      font-size: 13px;
      font-weight: 600;
      color: #1f2d44;
      letter-spacing: 0.2px;
      text-align: center;
    }

    .bottle-slot {
      position: relative;
      width: 76px;
      height: 234px;
    }

    .bottle-slot img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      transition: opacity 600ms ease;
      pointer-events: none;
    }

    .bottle-slot img.is-visible {
      opacity: 1;
    }

    .bottle-slot.no-transition img {
      transition: none;
    }
  </style>
</head>
<body>
  <div class="button-stack">
    <button class="confirm-btn" data-modal="modal-1lb">Calculate 1 lb lost</button>
    <button class="confirm-btn" data-modal="modal-2lb">Calculate 2 lb lost</button>
  </div>

  <div class="modal-backdrop" id="modal-1lb" role="dialog" aria-modal="true" hidden>
    <div class="modal">
      <button class="modal-close" aria-label="Close">&times;</button>
      <h2 class="modal-title">1 lb lost</h2>
      <div class="stage">
        <div class="bottle">
          <div class="bottle-slot">
            <img src="g-bottle.svg"   alt="" data-state="base">
            <img src="g-bottle-1.svg" alt="" data-state="end">
          </div>
          <div class="bottle-label">8 oz Gatorade</div>
        </div>
        <div class="bottle">
          <div class="bottle-slot">
            <img src="g-bottle.svg"   alt="" data-state="base">
            <img src="g-bottle-2.svg" alt="" data-state="end">
          </div>
          <div class="bottle-label">16 oz water</div>
        </div>
      </div>
    </div>
  </div>

  <div class="modal-backdrop" id="modal-2lb" role="dialog" aria-modal="true" hidden>
    <div class="modal">
      <button class="modal-close" aria-label="Close">&times;</button>
      <h2 class="modal-title">2 lb lost</h2>
      <div class="stage">
        <div class="bottle">
          <div class="bottle-slot">
            <img src="g-bottle.svg"   alt="" data-state="base">
            <img src="g-bottle-3.svg" alt="" data-state="end">
          </div>
          <div class="bottle-label">8 oz Gatorade + 16 oz water</div>
        </div>
        <div class="bottle">
          <div class="bottle-slot">
            <img src="g-bottle.svg"   alt="" data-state="base">
            <img src="g-bottle-4.svg" alt="" data-state="end">
          </div>
          <div class="bottle-label">24 oz water</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const showState = (slot, state) => {
      slot.querySelectorAll('img').forEach(img => {
        img.classList.toggle('is-visible', img.dataset.state === state);
      });
    };

    const resetBottles = (modal, { instant = false } = {}) => {
      const slots = modal.querySelectorAll('.bottle-slot');
      if (instant) slots.forEach(s => s.classList.add('no-transition'));
      slots.forEach(s => showState(s, 'base'));
      if (instant) {
        void modal.offsetWidth;
        slots.forEach(s => s.classList.remove('no-transition'));
      }
    };

    const timers = new WeakMap();

    const runAnimation = (modal) => {
      const existing = timers.get(modal);
      if (existing) clearTimeout(existing);
      resetBottles(modal, { instant: true });
      const t = setTimeout(() => {
        modal.querySelectorAll('.bottle-slot').forEach(s => showState(s, 'end'));
      }, 1000);
      timers.set(modal, t);
    };

    const openModal = (modal) => {
      modal.hidden = false;
      void modal.offsetWidth;
      modal.classList.add('is-open');
      runAnimation(modal);
    };

    const closeModal = (modal) => {
      const existing = timers.get(modal);
      if (existing) clearTimeout(existing);
      modal.classList.remove('is-open');
      setTimeout(() => {
        modal.hidden = true;
        resetBottles(modal, { instant: true });
      }, 200);
    };

    document.querySelectorAll('[data-modal]').forEach(btn => {
      btn.addEventListener('click', () => {
        const modal = document.getElementById(btn.dataset.modal);
        openModal(modal);
      });
    });

    document.querySelectorAll('.modal-backdrop').forEach(modal => {
      modal.querySelector('.modal-close').addEventListener('click', () => closeModal(modal));
      modal.addEventListener('click', (e) => {
        if (e.target === modal) closeModal(modal);
      });
      resetBottles(modal, { instant: true });
    });

    document.addEventListener('keydown', (e) => {
      if (e.key !== 'Escape') return;
      const open = document.querySelector('.modal-backdrop.is-open');
      if (open) closeModal(open);
    });
  </script>
</body>
</html>
