<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bottle Animation Demo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Open Sans', sans-serif;
      background: #f4f5f7;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 24px;
    }

    .confirm-btn {
      appearance: none;
      border: none;
      background: #00a699;
      color: #fff;
      font-family: inherit;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.3px;
      padding: 12px 36px;
      border-radius: 6px;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0,0,0,0.12);
      transition: background 0.15s, transform 0.05s;
    }

    .confirm-btn:hover { background: #009086; }
    .confirm-btn:active { transform: translateY(1px); }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(31, 45, 68, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 200ms ease;
      z-index: 10;
    }

    .modal-backdrop.is-open {
      opacity: 1;
      pointer-events: auto;
    }

    .modal {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 24px 48px rgba(0, 0, 0, 0.2);
      width: 100%;
      max-width: 480px;
      padding: 32px 32px 28px;
      position: relative;
      transform: translateY(8px);
      transition: transform 200ms ease;
    }

    .modal-backdrop.is-open .modal {
      transform: translateY(0);
    }

    .modal-title {
      font-size: 18px;
      font-weight: 700;
      color: #1f2d44;
      margin-bottom: 24px;
      text-align: center;
    }

    .modal-close {
      position: absolute;
      top: 12px;
      right: 12px;
      width: 32px;
      height: 32px;
      border: none;
      background: transparent;
      font-size: 22px;
      line-height: 1;
      color: rgba(31, 45, 68, 0.55);
      cursor: pointer;
      border-radius: 6px;
    }
    .modal-close:hover {
      background: rgba(31, 45, 68, 0.06);
      color: #1f2d44;
    }

    .stage {
      display: flex;
      gap: 80px;
      align-items: flex-start;
      justify-content: center;
      min-height: 280px;
    }

    .bottle {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .bottle-label {
      font-size: 13px;
      font-weight: 600;
      color: #1f2d44;
      letter-spacing: 0.2px;
    }

    .bottle-slot {
      position: relative;
      width: 76px;
      height: 234px;
    }

    .bottle-slot img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      transition: opacity 600ms ease;
      pointer-events: none;
    }

    .bottle-slot img.is-visible {
      opacity: 1;
    }

    .bottle-slot.no-transition img {
      transition: none;
    }
  </style>
</head>
<body>
  <button class="confirm-btn" id="confirm">Calculate 1 oz lost</button>

  <div class="modal-backdrop" id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title" hidden>
    <div class="modal">
      <button class="modal-close" id="modal-close" aria-label="Close">&times;</button>
      <h2 class="modal-title" id="modal-title">1 oz lost</h2>
      <div class="stage">
        <div class="bottle">
          <div class="bottle-slot" id="slot-left">
            <img src="g-bottle.svg"   alt="" data-state="base">
            <img src="g-bottle-1.svg" alt="" data-state="left">
          </div>
          <div class="bottle-label">8 oz Gatorade</div>
        </div>
        <div class="bottle">
          <div class="bottle-slot" id="slot-right">
            <img src="g-bottle.svg"   alt="" data-state="base">
            <img src="g-bottle-2.svg" alt="" data-state="right">
          </div>
          <div class="bottle-label">16 oz water</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const slotLeft   = document.getElementById('slot-left');
    const slotRight  = document.getElementById('slot-right');
    const button     = document.getElementById('confirm');
    const modal      = document.getElementById('modal');
    const modalClose = document.getElementById('modal-close');

    const show = (slot, state) => {
      slot.querySelectorAll('img').forEach(img => {
        img.classList.toggle('is-visible', img.dataset.state === state);
      });
    };

    const resetBottles = ({ instant = false } = {}) => {
      if (instant) {
        slotLeft.classList.add('no-transition');
        slotRight.classList.add('no-transition');
      }
      show(slotLeft, 'base');
      show(slotRight, 'base');
      if (instant) {
        void slotLeft.offsetWidth;
        slotLeft.classList.remove('no-transition');
        slotRight.classList.remove('no-transition');
      }
    };

    let fadeTimer = null;
    const runAnimation = () => {
      if (fadeTimer) clearTimeout(fadeTimer);
      resetBottles({ instant: true });
      fadeTimer = setTimeout(() => {
        show(slotLeft, 'left');
        show(slotRight, 'right');
      }, 1000);
    };

    const openModal = () => {
      modal.hidden = false;
      // Force reflow so the opacity transition runs from 0.
      void modal.offsetWidth;
      modal.classList.add('is-open');
      runAnimation();
    };

    const closeModal = () => {
      if (fadeTimer) clearTimeout(fadeTimer);
      modal.classList.remove('is-open');
      setTimeout(() => {
        modal.hidden = true;
        resetBottles({ instant: true });
      }, 200);
    };

    button.addEventListener('click', openModal);
    modalClose.addEventListener('click', closeModal);
    modal.addEventListener('click', (e) => {
      if (e.target === modal) closeModal();
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && modal.classList.contains('is-open')) closeModal();
    });

    resetBottles({ instant: true });
  </script>
</body>
</html>
