<title>iP Migration Plan</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=Open+Sans:wght@400;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root{--navy:#3B4960;--ink:#171E29;--mid:#55606F;--dim:#7C8797;--paper:#F7F8F9;--card:#FFFFFF;--rule:#DDE0E5;--rulelt:#ECEEF1;--track:#E7EAEE;
--core:#4A6B8A;--med:#B3402F;--league:#B5822B;--rep:#3E7A5E;--legacy:#6B4E71}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--navy:#8FA3C0;--ink:#E8EBEF;--mid:#A6B0BE;--dim:#78838F;--paper:#12161C;--card:#1A1F27;--rule:#2C333D;--rulelt:#232931;--track:#262D36;
--core:#7FA3C6;--med:#E0705C;--league:#DCA847;--rep:#6BAE8C;--legacy:#A98BB0}}
:root[data-theme="dark"]{--navy:#8FA3C0;--ink:#E8EBEF;--mid:#A6B0BE;--dim:#78838F;--paper:#12161C;--card:#1A1F27;--rule:#2C333D;--rulelt:#232931;--track:#262D36;
--core:#7FA3C6;--med:#E0705C;--league:#DCA847;--rep:#6BAE8C;--legacy:#A98BB0}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Open Sans",system-ui,sans-serif;font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
code,.mono{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:.87em;font-variant-numeric:tabular-nums}
a{color:var(--navy)}
*:focus-visible{outline:2px solid var(--navy);outline-offset:2px}
#gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:28px}
#gateform{background:var(--card);border:1px solid var(--rule);border-radius:4px;padding:38px 34px;max-width:440px;width:100%;display:flex;flex-direction:column}
.geyebrow{font-family:"JetBrains Mono",monospace;font-size:11.5px;letter-spacing:.07em;color:var(--dim);margin:0 0 14px}
#gateform h1{font-family:"Archivo",sans-serif;font-weight:700;font-size:30px;letter-spacing:-.02em;margin:0 0 10px;line-height:1.1}
.gsub{color:var(--mid);font-size:14px;margin:0 0 24px}
.glabel{font-family:"JetBrains Mono",monospace;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);margin-bottom:7px}
#pw{font:15px/1.4 "JetBrains Mono",monospace;padding:12px 13px;border:1px solid var(--rule);border-radius:3px;background:var(--paper);color:var(--ink);width:100%}
#go{margin-top:14px;font:600 15px "Open Sans",sans-serif;padding:12px 16px;border:0;border-radius:3px;background:var(--navy);color:var(--card);cursor:pointer}
.gerr{color:var(--med);font-size:13.5px;margin:14px 0 0}.gbusy{color:var(--dim);font-size:13.5px;margin:14px 0 0}
.wrap{max-width:1080px;margin:0 auto;padding:56px 28px 100px;display:flex;flex-direction:column;gap:50px}
.eyebrow{font-family:"JetBrains Mono",monospace;font-size:12px;letter-spacing:.06em;color:var(--dim);margin:0 0 14px}
h1{font-family:"Archivo",sans-serif;font-weight:700;font-size:clamp(30px,4.4vw,44px);line-height:1.08;letter-spacing:-.02em;text-wrap:balance;margin:0 0 18px}
h2{font-family:"Archivo",sans-serif;font-weight:600;font-size:22px;letter-spacing:-.01em;margin:0 0 14px}
h3{font-family:"Archivo",sans-serif;font-weight:600;font-size:15.5px;margin:0 0 8px}
p{margin:0 0 13px;color:var(--mid);max-width:72ch}p:last-child{margin-bottom:0}
strong{color:var(--ink);font-weight:600}
.lede{font-size:17px;max-width:68ch}
.companion{margin:20px 0 0;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;background:var(--card);border:1px solid var(--rule);border-left:3px solid var(--navy);border-radius:3px;padding:14px 18px;max-width:72ch}
.companion a{font-family:"Archivo",sans-serif;font-weight:600;font-size:15px;text-decoration:none;white-space:nowrap}
.companion a:hover{text-decoration:underline}
.companion span{font-size:13.5px;color:var(--dim)}
.callout{background:var(--card);border:1px solid var(--rule);border-left:3px solid var(--med);border-radius:3px;padding:22px 24px}
.callout--good{border-left-color:var(--rep)}
table{border-collapse:collapse;width:100%;min-width:640px}
.tw{overflow-x:auto;border:1px solid var(--rule);border-radius:3px;background:var(--card)}
thead th{font-family:"JetBrains Mono",monospace;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:500;color:var(--dim);text-align:left;padding:12px 14px;border-bottom:1px solid var(--rule);white-space:nowrap}
tbody td{padding:10px 14px;border-bottom:1px solid var(--rulelt);font-size:13.5px;vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
td.num{font-family:"JetBrains Mono",monospace;font-variant-numeric:tabular-nums;text-align:right;color:var(--mid);white-space:nowrap}
.bar{display:flex;align-items:center;gap:9px;min-width:150px}
.bar .track{flex:1;height:6px;background:var(--track);border-radius:3px;overflow:hidden}
.bar .fill{display:block;height:100%;border-radius:3px}
.f-core{background:var(--core)}.f-med{background:var(--med)}.f-league{background:var(--league)}.f-rep{background:var(--rep)}.f-legacy{background:var(--legacy)}
.pct{font-family:"JetBrains Mono",monospace;font-size:11.5px;width:44px;text-align:right;color:var(--mid)}
.chip{display:inline-block;font-family:"JetBrains Mono",monospace;font-size:10px;letter-spacing:.06em;text-transform:uppercase;padding:3px 7px;border-radius:2px;border:1px solid currentColor;white-space:nowrap}
.c-core{color:var(--core)}.c-med{color:var(--med)}.c-league{color:var(--league)}.c-rep{color:var(--rep)}.c-none{color:var(--dim)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}
.stat{background:var(--card);border:1px solid var(--rule);border-top:3px solid var(--c,var(--rule));border-radius:3px;padding:20px;display:flex;flex-direction:column;gap:8px}
.stat--no{--c:var(--med)}.stat--part{--c:var(--league)}.stat--yes{--c:var(--rep)}.stat--legacy{--c:var(--legacy)}
.stat .n{font-family:"Archivo",sans-serif;font-weight:700;font-size:38px;line-height:1;color:var(--c);font-variant-numeric:tabular-nums}
.stat h3{margin:0}.stat p{font-size:13.5px;margin:0;line-height:1.5}
.squad{background:var(--card);border:1px solid var(--rule);border-radius:3px;padding:18px 20px;margin-bottom:12px}
.squadhead{display:flex;flex-wrap:wrap;align-items:baseline;gap:10px;margin-bottom:6px}
.squadhead h3{margin:0;font-size:17px}
.conf{font-family:"JetBrains Mono",monospace;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);border:1px solid currentColor;border-radius:2px;padding:2px 6px}
.conf--ok{color:var(--rep)}.conf--part{color:var(--core)}
td .sec .ok{color:var(--rep);font-style:normal;font-family:"JetBrains Mono",monospace;font-size:10px}
.summary{margin:0 0 10px;font-size:13.5px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.st{display:inline-block;font-family:"JetBrains Mono",monospace;font-size:10px;letter-spacing:.05em;text-transform:uppercase;padding:2px 6px;border-radius:2px;border:1px solid currentColor;white-space:nowrap}
.s-no{color:var(--med)}.s-part{color:var(--league)}.s-yes{color:var(--rep)}.s-unk{color:var(--dim)}.s-legacy{color:var(--legacy)}
details{margin-top:8px}
summary{cursor:pointer;font-size:13.5px;color:var(--navy);font-family:"Archivo",sans-serif;font-weight:600}
summary::marker{color:var(--dim)}
details .tw{margin-top:10px}
td .sec{display:block;font-size:11px;color:var(--dim);margin-top:1px}
.steps{margin:0;padding-left:20px;color:var(--mid)}
.steps li{margin-bottom:9px;font-size:14px;max-width:76ch}
.steps li::marker{color:var(--navy);font-family:"JetBrains Mono",monospace;font-size:12px}
.phases{display:flex;flex-direction:column;gap:12px}
.phase{display:grid;grid-template-columns:auto 1fr;gap:18px;background:var(--card);border:1px solid var(--rule);border-radius:3px;padding:18px 20px}
.phase .n{font-family:"Archivo",sans-serif;font-weight:700;font-size:22px;color:var(--navy);font-variant-numeric:tabular-nums;line-height:1.2}
.phase p{font-size:14px;margin:0}
ul{margin:0;padding-left:18px;color:var(--mid)}li{margin-bottom:8px;max-width:74ch;font-size:14px}li::marker{color:var(--dim)}
hr.div{border:none;border-top:1px solid var(--rule);margin:0}
.foot{border-top:1px solid var(--rule);padding-top:22px}
.foot h2{font-size:18px}
</style>

<div id="gate">
  <form id="gateform" autocomplete="off">
    <p class="geyebrow">iP: Intelligence Platform</p>
    <h1>Migration plan</h1>
    <p class="gsub">Ownership, effort and sequencing for the Material UI migration. Encrypted; same passphrase as the surface audit.</p>
    <label class="glabel" for="pw">Passphrase</label>
    <input id="pw" type="password" autocomplete="off" spellcheck="false" autofocus>
    <button id="go" type="submit">Unlock</button>
    <p id="err" class="gerr" role="alert" hidden>That passphrase did not work.</p>
    <p id="busy" class="gbusy" hidden>Decrypting…</p>
  </form>
</div>
<div id="content"></div>
