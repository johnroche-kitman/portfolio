<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Org settings — Workload metrics and targets</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet" />
  <style>
    html, body, #root { height: 100%; margin: 0; }
    body {
      font-family: 'Open Sans', sans-serif;
      background: #fff;
      color: #3b4960;
      -webkit-font-smoothing: antialiased;
    }
    * { box-sizing: border-box; }

    /* Force the filled-variant InputLabel to sit inside the grey box, as per the Playbook toolkit.
       Same workaround as performance-settings/index.html — the variant class does not always
       reach InputLabel through TextField, so pin it from CSS instead. */
    .MuiFormControl-root:has(.MuiFilledInput-root) { position: relative !important; }
    .MuiFormControl-root:has(.MuiFilledInput-root) .MuiInputLabel-root {
      position: absolute !important;
      left: 0 !important;
      top: 0 !important;
      z-index: 2 !important;
      max-width: none !important;
      pointer-events: none !important;
      font-size: 12px !important;
      line-height: 1 !important;
      letter-spacing: 0.15px !important;
      color: #5F7089 !important;
      transform: translate(12px, 9px) !important;
      transform-origin: left top !important;
      transition: none !important;
    }

    /* A target driven by a GD max percentage: white rather than filled, so it
       reads as derived rather than as something you can type into. */
    .derived-value .MuiFilledInput-root,
    .derived-value .MuiFilledInput-root.Mui-disabled {
      background-color: #ffffff !important;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/@babel/standalone@7.25.6/babel.min.js"></script>

  <script type="importmap">
  {
    "imports": {
      "react": "https://esm.sh/react@18.3.1",
      "react/": "https://esm.sh/react@18.3.1/",
      "react-dom": "https://esm.sh/react-dom@18.3.1",
      "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
      "@mui/material": "https://esm.sh/@mui/material@5.16.7?external=react,react-dom,@emotion/react,@emotion/styled",
      "@emotion/react": "https://esm.sh/@emotion/react@11.13.3?external=react",
      "@emotion/styled": "https://esm.sh/@emotion/styled@11.13.0?external=react,@emotion/react"
    }
  }
  </script>

  <script type="text/babel" data-type="module" data-presets="react">
    import React, { useState, useMemo } from 'react';
    import { createRoot } from 'react-dom/client';
    import {
      createTheme, ThemeProvider, CssBaseline,
      Box, Stack, Typography, Button, IconButton, Divider, Tooltip,
      Tabs, Tab, List, ListItemButton, ListItemText,
      TextField, MenuItem, Menu, ListSubheader, Checkbox, Autocomplete, Avatar, ButtonBase,
      Snackbar, Alert, AlertTitle,
      ToggleButton, ToggleButtonGroup, InputAdornment, Switch,
    } from '@mui/material';

    /* ── Design tokens (Figma variables, Playbook toolkit) ───────────── */
    const PRIMARY     = '#3b4960';   // primary/main, text/primary
    const GREY100     = '#5F7089';   // Grey/100
    const DISABLED    = '#AFB7C4';   // Grey/100 50%
    const NEUTRAL_200 = '#F1F2F3';   // Neutral/200, secondary/main
    const DIVIDER     = '#3b49601f';
    const PRIMARY_SEL = '#3b496014'; // primary/selected
    const ACTIVE_NAV  = '#0F28FF';
    const UNDERLINE   = '#3b49606b'; // components/input/standard/enabledBorder
    const ERROR       = '#C31D2B';   // over budget
    const RADIUS      = 4;

    /* ── Material icon helper (Outlined only) ────────────────────────── */
    const MI = ({ name, size = 20, color, style }) => (
      <span className="material-icons-outlined" style={{ fontSize: size, lineHeight: 1, color, ...style }}>{name}</span>
    );

    // Material's Clear glyph, same mark as @mui/icons-material/Clear.
    // In the real codebase write `import ClearIcon from '@mui/icons-material/Clear'`.
    // This prototype has no bundler, and pulling the icons package in through the
    // import map loads a second copy of MUI's internals, which breaks
    // FormControl context — disabled stops reaching the inputs. The icon font
    // renders the identical glyph with none of that.
    const ClearIcon = ({ sx = {} }) => <MI name="clear" size={sx.fontSize || 20} color={sx.color} />;

    /* ── Theme ───────────────────────────────────────────────────────── */
    const theme = createTheme({
      palette: {
        primary:   { main: PRIMARY, contrastText: '#ffffff' },
        secondary: { main: NEUTRAL_200, contrastText: PRIMARY },
        text:      { primary: PRIMARY, secondary: GREY100 },
        divider:   DIVIDER,
      },
      shape: { borderRadius: RADIUS },
      typography: {
        fontFamily: "'Open Sans', sans-serif",
        body1: { fontSize: 16, lineHeight: 1.5, letterSpacing: 0.15 },
        body2: { fontSize: 14, lineHeight: 1.43, letterSpacing: 0.17 },
      },
      components: {
        MuiButton: { styleOverrides: { root: {
          textTransform: 'none', fontFamily: "'Open Sans', sans-serif",
          fontWeight: 600, fontSize: 14, lineHeight: '24px', letterSpacing: 0.4, boxShadow: 'none',
          '&:hover': { boxShadow: 'none' },
        }}},
        MuiTab: { styleOverrides: { root: {
          textTransform: 'none', fontFamily: "'Open Sans', sans-serif",
          fontWeight: 600, fontSize: 14, minHeight: 46, color: GREY100,
          '&.Mui-selected': { color: PRIMARY },
        }}},
        MuiInputBase:  { styleOverrides: { root: { fontFamily: "'Open Sans', sans-serif", fontSize: 14 } } },
        MuiTypography: { styleOverrides: { root: { fontFamily: "'Open Sans', sans-serif" } } },
        MuiListItemText: { styleOverrides: { primary: { fontFamily: "'Open Sans', sans-serif", fontSize: 15 } } },
        MuiFilledInput: { styleOverrides: { root: {
          backgroundColor: NEUTRAL_200,
          // Square bottom corners over a 1px underline, per the Playbook toolkit.
          borderRadius: `${RADIUS}px ${RADIUS}px 0 0`,
          borderBottom: `1px solid ${UNDERLINE}`,
          '&:hover':        { backgroundColor: '#e8e9eb' },
          '&.Mui-focused':  { backgroundColor: NEUTRAL_200, borderBottomColor: PRIMARY },
          '&:before, &:after': { display: 'none' },
        }}},
        MuiInputLabel: { styleOverrides: { root: { fontFamily: "'Open Sans', sans-serif" } } },
        MuiFormControl: { styleOverrides: { root: { position: 'relative' } } },
        MuiMenuItem: { styleOverrides: { root: { fontFamily: "'Open Sans', sans-serif", fontSize: 14 } } },
      },
    });

    /* ── Reference data ──────────────────────────────────────────────── */
    const NAV_ITEMS = [
      { icon: 'bar_chart',           label: 'Analysis' },
      { icon: 'science',             label: 'My iP' },
      { icon: 'groups',              label: 'Athletes' },
      { icon: 'medical_services',    label: 'Medical' },
      { icon: 'monitor_weight',      label: 'Performance' },
      { icon: 'assignment',          label: 'Forms' },
      { icon: 'calendar_today',      label: 'Calendar' },
      { icon: 'file_copy',           label: 'Documents' },
      { icon: 'chat_bubble_outline', label: 'Messaging' },
      { icon: 'smart_display',       label: 'Media' },
      { icon: 'assignment_ind',      label: 'Recruitment' },
      { icon: 'settings',            label: 'Org settings', active: true },
    ];

    const ORG_TABS = ['Appearance', 'Workload', 'Planning', 'Security and privacy', 'My iP', 'Calendar', 'Locations', 'Notifications'];
    const SUB_SECTIONS = ['Participation and RPE', 'Workload metrics and targets'];

    // Every squad the club runs, youngest first. Only some carry targets so far,
    // and the read only page shows the ones that do.
    const SQUADS = [
      'U10', 'U11', 'U12', 'U13', 'U14', 'U15', 'U16', 'U17', 'U18', 'U19',
      'U21', 'U23', '1st team',
    ];
    const DEFAULT_SQUAD = '1st team';
    const POSITIONS = ['All', 'Goalkeeper', 'Defender', 'Midfielder', 'Forward'];

    // The metric library, named exactly as it reads in the app, and the vendor
    // lists beside it. Every dropdown on every page picks from these, under the
    // same headings. Names are unique across the three: a metric is identified by
    // its name, so Total Distance from one vendor is not Total Distance (m) here.
    const METRIC_GROUPS = [
      {
        header: 'Kitman',
        items: [
          'Total Distance (m)',
          'Distance Per Minute (m/min)',
          'HMLD (m)',
          'HSR Distance (m)',
          'Sprint Distance (m)',
          'Accels Distance (m)',
          'Accels >3m/s',
          'Decels Distance (m)',
          'Decels >3m/s',
          'RPE x Duration',
          '% max velocity',
        ],
      },
      {
        header: 'STATSports',
        items: [
          'Total Distance',
          'Distance Per Min',
          'HSR Distance',
          'Sprint Distance',
          'HMLD',
          'High Intensity Distance',
          'Accelerations',
          'Decelerations',
          'Sprint Count',
          'Dynamic Stress Load',
          'Step Balance',
          'Impacts',
          'Time On Field',
        ],
      },
      {
        header: 'Catapult',
        items: [
          'Player Load',
          'Player Load Per Minute',
          'Velocity Band 4 Distance',
          'Velocity Band 5 Distance',
          'Acceleration Efforts',
          'Deceleration Efforts',
          'Explosive Efforts',
          'IMA Accel High',
          'IMA Decel High',
          'Metabolic Power',
          'Equivalent Distance',
          'Work Rate',
        ],
      },
    ];

    const METRIC_LIBRARY = METRIC_GROUPS.flatMap((g) => g.items);
    const METRIC_GROUP_OF = {};
    METRIC_GROUPS.forEach((g) => g.items.forEach((m) => { METRIC_GROUP_OF[m] = g.header; }));

    const IMPORT_WINDOWS = ['Last 3 imports', 'Last 5 imports', 'Last 10 imports', 'All imports'];

    // Gameday markers. The minus sign matches the design (U+2212). Match day
    // itself is deliberately absent: the game cannot carry a target.
    const GD_LIMIT = 15;
    const MINUS = '−';
    const gdLabel = (offset) => `GD${offset < 0 ? MINUS : '+'}${Math.abs(offset)}`;
    const gdOffset = (label) => {
      const n = Number(label.slice(3));
      return label[2] === MINUS ? -n : n;
    };
    // Training-week order: the deepest minus day first, up to the last plus day.
    const gdSort = (a, b) => gdOffset(a) - gdOffset(b);

    const GD_DEFAULT = ['GD−4', 'GD−3', 'GD−2', 'GD−1', 'GD+1', 'GD+2'];

    const MAX_METRICS = 6;

    // The grid always holds exactly MAX_METRICS slots. A slot with an empty
    // metric name is an open row waiting to be filled; clearing a row empties
    // it in place rather than removing it, so the row count never changes.
    const emptySlot = () => ({ metric: '', targets: {} });
    const emptySlots = () => Array.from({ length: MAX_METRICS }, emptySlot);
    const isFilled = (slot) => Boolean(slot && slot.metric);

    // Session totals for a soccer training week. GD−3 is the heaviest day, GD−1 is
    // activation and GD+1 is recovery. Younger squads carry less volume.
    // Order of values matches GD_DEFAULT: GD−4, GD−3, GD−2, GD−1, GD+1, GD+2.
    const SQUAD_TARGETS = {
      '1st team': {
        'Total Distance (m)':  [4800, 5600, 4200, 3100, 2200, 4400],
        'HMLD (m)':            [1050, 1300, 980, 640, 420, 950],
        'HSR Distance (m)':    [420, 610, 480, 260, 90, 380],
        'Sprint Distance (m)': [120, 210, 180, 70, 20, 110],
        'Accels >3m/s':      [28, 38, 32, 18, 8, 26],
        'Decels >3m/s':      [30, 41, 34, 19, 9, 28],
      },
      'U21': {
        'Total Distance (m)':  [4300, 5000, 3800, 2800, 2000, 3900],
        'HMLD (m)':            [940, 1160, 880, 570, 375, 850],
        'HSR Distance (m)':    [360, 520, 410, 220, 80, 320],
        'Sprint Distance (m)': [95, 170, 145, 55, 15, 90],
        'Accels >3m/s':      [24, 33, 28, 16, 7, 22],
        'Decels >3m/s':      [26, 35, 30, 17, 8, 24],
      },
      'U18': {
        'Total Distance (m)':  [3800, 4500, 3400, 2500, 1800, 3500],
        'HMLD (m)':            [830, 1020, 775, 505, 330, 750],
        'HSR Distance (m)':    [300, 430, 340, 180, 65, 270],
        'Sprint Distance (m)': [75, 135, 115, 45, 12, 70],
        'Accels >3m/s':      [20, 28, 24, 13, 6, 19],
        'Decels >3m/s':      [22, 30, 26, 14, 7, 20],
      },
    };

    // U18 sessions are less frequent, so the average leans on a longer window.
    const SQUAD_IMPORTS = { '1st team': 'Last 5 imports', 'U21': 'Last 5 imports', 'U18': 'Last 10 imports' };

    // What the squad hits on a match day, taken from game data. Targets set as a
    // percentage are a share of these, which is what makes one percentage produce a
    // different number for every metric.
    const GD_MAX = {
      '1st team': {
        'Total Distance (m)': 10500, 'Distance Per Minute (m/min)': 115, 'HMLD (m)': 2400,
        'HSR Distance (m)': 900, 'Sprint Distance (m)': 300, 'Accels Distance (m)': 260,
        'Accels >3m/s': 45, 'Decels Distance (m)': 240, 'Decels >3m/s': 48,
        'RPE x Duration': 630, '% max velocity': 100,
      },
      'U21': {
        'Total Distance (m)': 9800, 'Distance Per Minute (m/min)': 108, 'HMLD (m)': 2150,
        'HSR Distance (m)': 780, 'Sprint Distance (m)': 260, 'Accels Distance (m)': 235,
        'Accels >3m/s': 40, 'Decels Distance (m)': 215, 'Decels >3m/s': 43,
        'RPE x Duration': 580, '% max velocity': 100,
      },
      'U18': {
        'Total Distance (m)': 9000, 'Distance Per Minute (m/min)': 100, 'HMLD (m)': 1900,
        'HSR Distance (m)': 680, 'Sprint Distance (m)': 220, 'Accels Distance (m)': 210,
        'Accels >3m/s': 35, 'Decels Distance (m)': 195, 'Decels >3m/s': 38,
        'RPE x Duration': 520, '% max velocity': 100,
      },
    };

    const gdMaxFor = (squad, metric) => (GD_MAX[squad] || {})[metric];

    // A percentage over 100 is allowed, so a day can deliberately overload.
    const valueFromPercent = (squad, metric, percent) => {
      const max = gdMaxFor(squad, metric);
      const n = parseFloat(percent);
      if (max == null || percent === '' || percent == null || !isFinite(n)) return '';
      return String(Math.round((max * n) / 100));
    };

    const percentFromValue = (squad, metric, value) => {
      const max = gdMaxFor(squad, metric);
      const n = parseFloat(value);
      if (!max || !isFinite(n)) return '';
      return String(Math.round((n / max) * 100));
    };

    const seedMetrics = (squad) => {
      const slots = emptySlots();
      Object.entries(SQUAD_TARGETS[squad] || {}).forEach(([metric, values], i) => {
        slots[i] = {
          metric,
          targets: GD_DEFAULT.reduce((acc, day, d) => ({ ...acc, [day]: String(values[d]) }), {}),
        };
      });
      return slots;
    };

    // A squad + position combination holds its own metrics, import window, and
    // whether its targets are typed as exact values or as a share of GD max.
    const emptyCombination = () => ({
      imports: 'Last 5 imports', metrics: emptySlots(), mode: 'exact', percents: {},
    });

    const seedConfig = () => {
      const cfg = {};
      SQUADS.forEach((squad) => {
        cfg[squad] = {
          days: [...GD_DEFAULT],
          byPosition: {
            All: {
              imports: SQUAD_IMPORTS[squad] || 'Last 5 imports',
              metrics: seedMetrics(squad),
              mode: 'exact',
              percents: {},
            },
          },
        };
      });
      return cfg;
    };

    // Nothing set yet: the squads exist, the grid is empty. Ten rows rather than
    // six, since a page that starts blank is where a long list gets typed.
    const BLANK_ROWS = 10;
    const emptyConfig = () => {
      const cfg = {};
      SQUADS.forEach((squad) => {
        cfg[squad] = {
          days: [...GD_DEFAULT],
          byPosition: {
            All: {
              imports: SQUAD_IMPORTS[squad] || 'Last 5 imports',
              metrics: Array.from({ length: BLANK_ROWS }, emptySlot),
              mode: 'exact',
              percents: {},
            },
          },
        };
      });
      return cfg;
    };

    const squadHasContent = (squadCfg) => Boolean(squadCfg) &&
      Object.values(squadCfg.byPosition).some((combo) => combo.metrics.some(isFilled));

    const squadHasTarget = (squadCfg) => Boolean(squadCfg) &&
      Object.values(squadCfg.byPosition).some((combo) =>
        combo.metrics.some((slot) => isFilled(slot) && Object.values(slot.targets).some((t) => t !== '' && t != null))
      );

    const hasAnyTarget = (config) => Object.values(config).some((squadCfg) =>
      Object.values(squadCfg.byPosition).some((combo) =>
        combo.metrics.some((slot) => isFilled(slot) && Object.values(slot.targets).some((t) => t !== '' && t != null))
      )
    );

    const clone = (o) => JSON.parse(JSON.stringify(o));

    // Same targets, but held as a share of each metric's GD max, which is what a
    // percentage import produces.
    const seedPercentConfig = () => {
      const cfg = seedConfig();
      Object.entries(cfg).forEach(([squad, squadCfg]) => {
        Object.values(squadCfg.byPosition).forEach((combo) => {
          const first = combo.metrics.find(isFilled);
          if (!first) return;
          combo.mode = 'percent';
          combo.percents = {};
          squadCfg.days.forEach((day) => {
            combo.percents[day] = percentFromValue(squad, first.metric, first.targets[day]);
          });
          combo.metrics.filter(isFilled).forEach((slot) => {
            squadCfg.days.forEach((day) => {
              slot.targets[day] = valueFromPercent(squad, slot.metric, combo.percents[day]);
            });
          });
        });
      });
      return cfg;
    };

    /* ── Layout constants (from the Figma frame) ─────────────────────── */
    const RAIL_W    = 60;
    const DRAWER_W  = 280;
    const CONTENT_X = 26;   // content inset inside the pane
    const COL_METRIC = 275;
    const COL_DAY    = 145;
    const IN_METRIC  = 249;
    const IN_DAY     = 129;
    const ROW_H      = 77;

    /* ── Chrome ──────────────────────────────────────────────────────── */
    function NavRail({ onHome, activeLabel = 'Org settings' }) {
      return (
        <Box sx={{
          width: RAIL_W, flex: 'none', color: '#fff',
          background: 'linear-gradient(160deg, #0c0d13 0%, #0c0d13 58%, #1c2130 100%)',
          display: 'flex', flexDirection: 'column', alignItems: 'center', py: 1.5,
        }}>
          <Tooltip title="Back to prototype versions" placement="right">
            <ButtonBase
              onClick={onHome}
              aria-label="Back to prototype versions"
              sx={{ borderRadius: '50%', mb: 1.25, flex: 'none' }}
            >
              <Box
                component="img"
                src="kitman-logo.png"
                alt="Kitman Labs"
                sx={{ width: 36, height: 36, display: 'block', objectFit: 'contain' }}
              />
            </ButtonBase>
          </Tooltip>

          {NAV_ITEMS.map((item) => {
            const active = item.label === activeLabel;
            return (
            <Tooltip key={item.label} title={item.label} placement="right">
              <Box sx={{
                width: RAIL_W, height: 40, flex: 'none',
                display: 'flex', alignItems: 'center', justifyContent: 'center',
                bgcolor: active ? ACTIVE_NAV : 'transparent',
                cursor: 'pointer',
                '&:hover': { bgcolor: active ? ACTIVE_NAV : 'rgba(255,255,255,0.08)' },
              }}>
                <MI name={item.icon} size={22} color="#fff" />
              </Box>
            </Tooltip>
            );
          })}

          <Box sx={{ mt: 'auto', display: 'flex', flexDirection: 'column', gap: 1.5, pb: 1 }}>
            <Box sx={{ width: RAIL_W, height: 32, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
              <MI name="help_outline" size={22} color="#fff" />
            </Box>
            <Box sx={{ width: RAIL_W, height: 32, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
              <MI name="keyboard_double_arrow_right" size={22} color="#fff" />
            </Box>
          </Box>
        </Box>
      );
    }

    // The squad identifier is app chrome, not part of this feature. It stays put.
    function TopBar({ contextLabel = '1st team', breadcrumb = 'Org settings' }) {
      return (
        <Box sx={{
          height: 50, flex: 'none', display: 'flex', alignItems: 'center',
          justifyContent: 'space-between', px: 3, borderBottom: `1px solid ${DIVIDER}`,
        }}>
          <Typography sx={{ fontSize: 14, color: GREY100 }}>{breadcrumb}</Typography>
          <Stack direction="row" alignItems="center" spacing={1.5}>
            <Stack direction="row" alignItems="center" spacing={0.5} sx={{ cursor: 'pointer' }}>
              <Typography sx={{ fontSize: 14, color: PRIMARY }}>{contextLabel}</Typography>
              <MI name="expand_more" size={20} color={PRIMARY} />
            </Stack>
            <Avatar sx={{ width: 32, height: 32, bgcolor: '#c9cfd9', fontSize: 13, color: PRIMARY }}>RP</Avatar>
          </Stack>
        </Box>
      );
    }

    function SubNav({ value, onChange, sections = SUB_SECTIONS }) {
      return (
        <Box sx={{ width: DRAWER_W, flex: 'none', borderRight: `1px solid ${DIVIDER}`, bgcolor: '#fff' }}>
          <List disablePadding sx={{ pt: 1 }}>
            {sections.map((section) => (
              <ListItemButton
                key={section}
                selected={value === section}
                onClick={() => onChange(section)}
                sx={{
                  height: 48, px: 3,
                  '&.Mui-selected':        { bgcolor: NEUTRAL_200 },
                  '&.Mui-selected:hover':  { bgcolor: NEUTRAL_200 },
                }}
              >
                <ListItemText primary={section} />
              </ListItemButton>
            ))}
          </List>
        </Box>
      );
    }

    /* ── Read-only view ──────────────────────────────────────────────── */
    // showPosition and showImports come off together on the version whose file
    // carries neither: nothing sets them, so nothing should report them.
    function SquadTargetTable({ squad, cfg, percentOnly = false, showPosition = true, showImports = true, showDays = true }) {
      const rows = [];
      const filled = [];
      POSITIONS.forEach((position) => {
        const combo = cfg.byPosition[position];
        if (!combo) return;
        const set = combo.metrics.filter(isFilled);
        if (set.length === 0) return;
        filled.push({ position, imports: combo.imports });
        // A combination set as a share of GD max shows that share above its metrics.
        if (combo.mode === 'percent') {
          rows.push({ position, percentRow: true, percents: combo.percents });
        }
        // Version 4 states the share and leaves it there: the metric names add
        // nothing when every one of them takes the same percentage.
        if (!(percentOnly && combo.mode === 'percent')) {
          set.forEach((row) => rows.push({ position, ...row }));
        }
      });

      // The design states the window once beneath the table. Only name the positions
      // when they have drifted apart.
      const uniform = filled.length > 0 && filled.every((f) => f.imports === filled[0].imports);
      const tableWidth = 255 + (showPosition ? 165 : 0) + cfg.days.length * 150;

      const cell = { fontSize: 14, letterSpacing: 0.17, color: PRIMARY };
      const head = { fontSize: 14, fontWeight: 600, lineHeight: '24px', letterSpacing: 0.17, color: PRIMARY };

      // The percentage row is bold only where it sits among metric rows and needs
      // telling apart. On the percentage only page every row is one, so it reads flat.
      const pctWeight = percentOnly ? 400 : 700;

      return (
        <Box sx={{ mb: 5 }}>
          <Typography sx={{ fontSize: 20, fontWeight: 700, mb: 1.5 }}>
            {squad} targets{showDays ? ' by GD +/\u2212' : ''}
          </Typography>

          <Box sx={{ overflowX: 'auto' }}>
            <Box sx={{ minWidth: tableWidth }}>
              <Box sx={{ display: 'flex', alignItems: 'center', height: 44, borderBottom: `1px solid ${DIVIDER}` }}>
                <Box sx={{ width: 255, flex: 'none', ...head }}>{percentOnly ? '' : 'Metric'}</Box>
                {showPosition && <Box sx={{ width: 165, flex: 'none', ...head }}>Position</Box>}
                {cfg.days.map((day) => (
                  <Box key={day} sx={{ width: 150, flex: 'none', ...head }}>{day}</Box>
                ))}
              </Box>

              {rows.map((row, i) => row.percentRow ? (
                <Box
                  key={`${row.position}-percent-${i}`}
                  sx={{
                    display: 'flex', alignItems: 'center', height: 50,
                    borderBottom: `1px solid ${DIVIDER}`, bgcolor: '#FAFBFC',
                  }}
                >
                  <Box sx={{ width: 255, flex: 'none', ...cell, fontWeight: pctWeight }}>% of GD max</Box>
                  {showPosition && <Box sx={{ width: 165, flex: 'none', ...cell }}>{row.position}</Box>}
                  {cfg.days.map((day) => (
                    <Box key={day} sx={{ width: 150, flex: 'none', ...cell, fontWeight: pctWeight }}>
                      {row.percents[day] ? `${row.percents[day]}%` : <span style={{ color: DISABLED }}>&mdash;</span>}
                    </Box>
                  ))}
                </Box>
              ) : (
                <Box
                  key={`${row.position}-${row.metric}-${i}`}
                  sx={{ display: 'flex', alignItems: 'center', height: 50, borderBottom: `1px solid ${DIVIDER}` }}
                >
                  <Box sx={{ width: 255, flex: 'none', ...cell }}>{row.metric}</Box>
                  {showPosition && <Box sx={{ width: 165, flex: 'none', ...cell }}>{row.position}</Box>}
                  {cfg.days.map((day) => (
                    <Box key={day} sx={{ width: 150, flex: 'none', ...cell }}>
                      {row.targets[day] || <span style={{ color: DISABLED }}>&mdash;</span>}
                    </Box>
                  ))}
                </Box>
              ))}
            </Box>
          </Box>

          {rows.length === 0 && (
            <Box sx={{ py: 3 }}>
              <Typography sx={{ fontSize: 14, color: GREY100 }}>
                No metrics set for this squad yet.
              </Typography>
            </Box>
          )}

          {showImports && uniform && (
            <Typography sx={{ fontSize: 14, fontWeight: 600, mt: 2 }}>
              Averages based on {filled[0].imports.toLowerCase()}
            </Typography>
          )}

          {showImports && !uniform && filled.map((f) => (
            <Typography key={f.position} sx={{ fontSize: 14, fontWeight: 600, mt: 1 }}>
              {f.position}: averages based on {f.imports.toLowerCase()}
            </Typography>
          ))}
        </Box>
      );
    }

    // actions are the buttons at the top right, in the order given, the last of
    // them primary. empty replaces the tables when nothing has been set yet.
    function ReadOnlyView({
      config, onAction, title = 'Workload metrics and targets', actionLabel = 'Edit',
      percentOnly = false, showPosition = true, showImports = true, showDays = true,
      secondaryLabel, onSecondary, actions, empty,
    }) {
      const buttons = actions || [
        ...(secondaryLabel ? [{ label: secondaryLabel, onClick: onSecondary }] : []),
        { label: actionLabel, onClick: onAction, primary: true },
      ];

      return (
        <Box sx={{ pl: `${CONTENT_X}px`, pt: 4, pb: 6, overflowY: 'auto', flex: 1 }}>
          <Stack direction="row" alignItems="flex-start" justifyContent="space-between" sx={{ mb: 3.5, pr: `${CONTENT_X}px` }}>
            <Typography sx={{ fontSize: 28, fontWeight: 600, letterSpacing: -0.2 }}>
              {title}
            </Typography>
            <Stack direction="row" spacing={1.5}>
              {buttons.map((b) => (
                <Button
                  key={b.label}
                  variant="contained"
                  color={b.primary ? 'primary' : 'secondary'}
                  onClick={b.onClick}
                  sx={{ px: 2.5 }}
                >
                  {b.label}
                </Button>
              ))}
            </Stack>
          </Stack>

          {/* Thirteen squads, only some with targets: an empty table for each of
              the rest would bury the ones that have them. */}
          {empty || SQUADS.filter((squad) => squadHasContent(config[squad])).map((squad) => (
            <SquadTargetTable
              key={squad}
              squad={squad}
              cfg={config[squad]}
              percentOnly={percentOnly}
              showPosition={showPosition}
              showImports={showImports}
              showDays={showDays}
            />
          ))}
        </Box>
      );
    }

    /* ── Search field at the head of a metric dropdown ───────────────── */
    // Eleven metrics is enough to want typing rather than reading. The key
    // handler is the point: without it the menu takes the keystrokes as its own
    // type-ahead and jumps the highlight around instead of letting you type.
    const metricMatches = (name, query) =>
      !query.trim() || name.toLowerCase().includes(query.trim().toLowerCase());

    function MetricSearch({ value, onChange, placeholder = 'Search metrics' }) {
      return (
        <Box
          sx={{ px: 1.5, py: 1, bgcolor: '#fff' }}
          onKeyDown={(e) => { if (e.key !== 'Escape') e.stopPropagation(); }}
        >
          <TextField
            value={value}
            onChange={(e) => onChange(e.target.value)}
            placeholder={placeholder}
            autoFocus
            fullWidth
            size="small"
            InputProps={{
              startAdornment: (
                <InputAdornment position="start" sx={{ mr: 0.75 }}>
                  <MI name="search" size={18} color={GREY100} />
                </InputAdornment>
              ),
            }}
            sx={{
              '& .MuiOutlinedInput-root': { borderRadius: `${RADIUS}px`, fontSize: 14 },
              '& .MuiOutlinedInput-input': { py: '7px' },
            }}
          />
        </Box>
      );
    }

    /* ── Edit view ───────────────────────────────────────────────────── */
    function FilledSelect({ label, value, options, onChange, width, disabledOptions = [], optionNote }) {
      return (
        <TextField
          select
          label={label}
          value={value}
          onChange={(e) => onChange(e.target.value)}
          variant="filled"
          sx={{
            width, flex: 'none',
            '& .MuiFilledInput-root': { height: 50 },
            '& .MuiSelect-select':    { pt: '24px', pb: '6px', fontSize: 15, color: PRIMARY, minHeight: 0 },
          }}
        >
          {options.map((option) => {
            const note = optionNote && optionNote(option);
            return (
              <MenuItem key={option} value={option} disabled={disabledOptions.includes(option)}>
                <Stack direction="row" alignItems="baseline" spacing={1}>
                  <span>{option}</span>
                  {note && <Box component="span" sx={{ fontSize: 12, color: GREY100 }}>{note}</Box>}
                </Stack>
              </MenuItem>
            );
          })}
        </TextField>
      );
    }

    function EditView({
      draft, setDraft, squad, setSquad, position, setPosition, onSave, onCancel,
      allowPercent = false, showPosition = true, showImports = true, requireInput = false,
      markSquads = false, metricAutocomplete = false,
    }) {
      const [dayAnchor, setDayAnchor] = useState(null);
      // One field is enough: only one metric dropdown is ever open.
      const [metricQuery, setMetricQuery] = useState('');

      // A week can run out to GD−15, well past the width of the screen, so the
      // column just added is scrolled into view.
      const scrollRef = React.useRef(null);
      const addedDay  = React.useRef(null);
      React.useEffect(() => {
        if (!addedDay.current || !scrollRef.current) return;
        const cell = scrollRef.current.querySelector(`[data-day="${addedDay.current}"]`);
        if (cell) cell.scrollIntoView({ inline: 'center', block: 'nearest' });
        addedDay.current = null;
      });

      const cfg   = draft[squad];
      const combo = cfg.byPosition[position] || emptyCombination();
      const rows  = combo.metrics;
      const usedMetrics = rows.filter(isFilled).map((r) => r.metric);
      // The week extends one day at a time in either direction, so the menu offers
      // any gap in what is already there plus the next day out on each side, as far
      // as GD−15 and GD+15.
      const nextDays = (sign) => {
        const offsets = cfg.days.map(gdOffset).filter((n) => Math.sign(n) === sign);
        const deepest = offsets.length ? Math.max(...offsets.map(Math.abs)) : 0;
        const reach = Math.min(deepest + 1, GD_LIMIT);
        return Array.from({ length: reach }, (_, i) => gdLabel(sign * (i + 1)))
          .filter((d) => !cfg.days.includes(d));
      };
      const unusedDays = [...nextDays(-1).reverse(), ...nextDays(1)];
      const percentMode = allowPercent && combo.mode === 'percent';

      const mutate = (fn) => {
        const next = clone(draft);
        if (!next[squad].byPosition[position]) next[squad].byPosition[position] = emptyCombination();
        fn(next);
        setDraft(next);
      };

      // Percentages own the values while the mode is on, so every filled metric is
      // rewritten from its own GD max whenever a percentage or a metric changes.
      const applyPercents = (c) => {
        c.metrics.forEach((slot) => {
          if (!isFilled(slot)) return;
          cfg.days.forEach((day) => {
            slot.targets[day] = valueFromPercent(squad, slot.metric, c.percents[day]);
          });
        });
      };

      const setMetric = (index, metric) => mutate((next) => {
        const c = next[squad].byPosition[position];
        c.metrics[index].metric = metric;
        if (c.mode === 'percent') applyPercents(c);
      });

      const setTarget = (index, day, raw) => mutate((next) => {
        const value = raw.replace(/[^0-9.]/g, '');
        next[squad].byPosition[position].metrics[index].targets[day] = value;
      });

      const setPercent = (day, raw) => mutate((next) => {
        const c = next[squad].byPosition[position];
        c.percents[day] = raw.replace(/[^0-9.]/g, '');
        applyPercents(c);
      });

      const setMode = (mode) => mutate((next) => {
        const c = next[squad].byPosition[position];
        if (!mode || mode === c.mode) return;
        c.mode = mode;
        if (mode === 'percent') {
          // Seed each percentage from what the day already asks of GD max, so
          // switching mode reframes the targets rather than wiping them.
          const first = c.metrics.find(isFilled);
          cfg.days.forEach((day) => {
            if (c.percents[day] == null || c.percents[day] === '') {
              c.percents[day] = first ? percentFromValue(squad, first.metric, first.targets[day]) : '';
            }
          });
          applyPercents(c);
        }
      });

      // Empties the row in place. The six rows are fixed, so nothing shifts up.
      const clearMetric = (index) => mutate((next) => {
        next[squad].byPosition[position].metrics[index] = emptySlot();
      });

      const addDay = (day) => mutate((next) => {
        const days = next[squad].days;
        days.push(day);
        days.sort(gdSort);
      });

      const removeDay = (day) => mutate((next) => {
        const cur = next[squad];
        cur.days = cur.days.filter((d) => d !== day);
        Object.values(cur.byPosition).forEach((c) =>
          c.metrics.forEach((slot) => { delete slot.targets[day]; })
        );
      });

      // Specific to this squad and position combination, not to the squad.
      const setImports = (value) => mutate((next) => {
        next[squad].byPosition[position].imports = value;
      });

      const ensurePosition = (nextPosition) => {
        if (!draft[squad].byPosition[nextPosition]) {
          const next = clone(draft);
          next[squad].byPosition[nextPosition] = emptyCombination();
          setDraft(next);
        }
        setPosition(nextPosition);
      };

      const head = { fontSize: 14, fontWeight: 600, lineHeight: '24px', letterSpacing: 0.17, color: PRIMARY };

      // Always six rows. An empty one is how a metric gets added.
      const tableWidth = CONTENT_X + COL_METRIC + (cfg.days.length + 1) * COL_DAY;

      return (
        <Box sx={{ pt: 4, pb: 6, overflowY: 'auto', flex: 1 }}>
          <Stack direction="row" alignItems="flex-start" justifyContent="space-between" sx={{ mb: 3, px: `${CONTENT_X}px` }}>
            <Typography sx={{ fontSize: 28, fontWeight: 600, letterSpacing: -0.2 }}>
              Workload metrics and targets
            </Typography>
            <Stack direction="row" spacing={1}>
              <Button
                variant="contained"
                color="primary"
                onClick={onSave}
                // Nothing to save until a metric carries at least one figure.
                disabled={requireInput && !hasAnyTarget(draft)}
                sx={{ px: 3 }}
              >
                Save
              </Button>
              <Button variant="contained" color="secondary" onClick={onCancel} sx={{ px: 3 }}>Cancel</Button>
            </Stack>
          </Stack>

          {/* These two filter what the grid shows. */}
          <Stack direction="row" spacing={1.25} alignItems="center" sx={{ mb: 3.5, pl: `${CONTENT_X}px` }}>
            <FilledSelect
              label="Squad"
              value={squad}
              options={SQUADS}
              onChange={setSquad}
              width={251}
              // Which squads are already done, on a page that starts with none.
              optionNote={markSquads ? ((sq) => (squadHasTarget(draft[sq]) ? 'targets set' : '')) : undefined}
            />
            {showPosition && (
              <FilledSelect label="Position(s)" value={position} options={POSITIONS} onChange={ensurePosition} width={240} />
            )}

            {/* selected and onClick are set per button rather than left to the
                group, which does not inject them through in this build. */}
            {allowPercent && (
              <ToggleButtonGroup
                exclusive
                value={combo.mode}
                sx={{
                  height: 50,
                  '& .MuiToggleButton-root': {
                    textTransform: 'none', fontFamily: "'Open Sans', sans-serif",
                    fontSize: 14, fontWeight: 600, color: PRIMARY, px: 2.25,
                    borderColor: DIVIDER,
                    '&.Mui-selected': { bgcolor: '#E9EAEC', color: PRIMARY, '&:hover': { bgcolor: '#E9EAEC' } },
                  },
                  // The group does not style its children in this build, so the two
                  // halves are squared off and their borders merged by hand.
                  '& .MuiToggleButton-root:first-of-type': { borderRadius: `${RADIUS}px 0 0 ${RADIUS}px` },
                  '& .MuiToggleButton-root:last-of-type':  { borderRadius: `0 ${RADIUS}px ${RADIUS}px 0`, ml: '-1px' },
                }}
              >
                <ToggleButton
                  value="exact"
                  selected={combo.mode === 'exact'}
                  onClick={() => setMode('exact')}
                >
                  Exact values
                </ToggleButton>
                <ToggleButton
                  value="percent"
                  selected={combo.mode === 'percent'}
                  onClick={() => setMode('percent')}
                >
                  % of GD max
                </ToggleButton>
              </ToggleButtonGroup>
            )}
          </Stack>

          <Divider sx={{ mb: 0 }} />

          {/* One scroll container so the header cells and the inputs below them
              can never drift out of alignment at narrow widths. */}
          <Box ref={scrollRef} sx={{ overflowX: 'auto' }}>
          <Box sx={{ minWidth: tableWidth }}>

          {/* Header row */}
          <Box sx={{ display: 'flex', alignItems: 'center', height: 56, borderBottom: `1px solid ${DIVIDER}` }}>
            <Box sx={{ width: COL_METRIC, flex: 'none', pl: `${CONTENT_X}px`, ...head }}>Metric</Box>
            {cfg.days.map((day) => (
              <Box key={day} data-day={day} sx={{
                width: COL_DAY, flex: 'none', pl: '16px', ...head,
                display: 'flex', alignItems: 'center', gap: 0.5,
                '&:hover .day-remove': { opacity: 1 },
              }}>
                {day}
                <IconButton
                  className="day-remove"
                  size="small"
                  onClick={() => removeDay(day)}
                  sx={{ opacity: 0, transition: 'opacity .12s', p: 0.25 }}
                  aria-label={`Remove ${day}`}
                >
                  <MI name="close" size={14} color={GREY100} />
                </IconButton>
              </Box>
            ))}
            <Box sx={{ width: COL_DAY, flex: 'none', pl: '16px' }}>
              <Button
                onClick={(e) => setDayAnchor(e.currentTarget)}
                disabled={unusedDays.length === 0}
                sx={{ ...head, minWidth: 0, p: 0, '&:hover': { bgcolor: 'transparent', opacity: 0.7 } }}
              >
                + day
              </Button>
              <Menu anchorEl={dayAnchor} open={Boolean(dayAnchor)} onClose={() => setDayAnchor(null)}>
                {unusedDays.map((day) => (
                  <MenuItem
                    key={day}
                    onClick={() => { addedDay.current = day; addDay(day); setDayAnchor(null); }}
                  >
                    {day}
                  </MenuItem>
                ))}
              </Menu>
            </Box>
          </Box>

          {/* One percentage per gameday, shared by every metric below it. */}
          {percentMode && (
            <Box sx={{
              display: 'flex', alignItems: 'center', height: ROW_H,
              borderBottom: `1px solid ${DIVIDER}`, bgcolor: '#FAFBFC',
            }}>
              <Box sx={{ width: COL_METRIC, flex: 'none', pl: '18px' }}>
                <Typography sx={{ fontSize: 14, fontWeight: 700 }}>% of GD max</Typography>
                <Typography sx={{ fontSize: 11, color: GREY100, mt: '2px' }}>Applies to every metric</Typography>
              </Box>
              {cfg.days.map((day) => (
                <Box key={day} sx={{ width: COL_DAY, flex: 'none', pl: '16px' }}>
                  <TextField
                    value={combo.percents[day] ?? ''}
                    onChange={(e) => setPercent(day, e.target.value)}
                    variant="filled"
                    hiddenLabel
                    inputProps={{ inputMode: 'numeric' }}
                    InputProps={{ endAdornment: <InputAdornment position="end" sx={{ mt: '0 !important' }}>%</InputAdornment> }}
                    sx={{
                      width: IN_DAY,
                      '& .MuiFilledInput-root': { height: 52, pr: 1 },
                      '& .MuiFilledInput-input': { py: 0, height: 52, fontSize: 15, color: PRIMARY },
                    }}
                  />
                </Box>
              ))}
              <Box sx={{ width: COL_DAY, flex: 'none' }} />
            </Box>
          )}

          {/* Six fixed rows */}
          {rows.map((slot, index) => {
            const filledRow = isFilled(slot);
            return (
              <Box
                key={index}
                sx={{
                  display: 'flex', alignItems: 'center', height: ROW_H,
                  borderBottom: `1px solid ${DIVIDER}`,
                  '&:hover .row-clear': { opacity: filledRow ? 1 : 0 },
                }}
              >
                <Box sx={{ width: COL_METRIC, flex: 'none', pl: '18px' }}>
                  {/* Typing in the field itself, rather than a search sat at the
                      head of a menu. The list opens under it and scrolls. */}
                  {metricAutocomplete ? (
                    <Autocomplete
                      options={METRIC_LIBRARY}
                      groupBy={(option) => METRIC_GROUP_OF[option]}
                      value={slot.metric || null}
                      onChange={(e, picked) => setMetric(index, picked || '')}
                      getOptionDisabled={(option) => usedMetrics.includes(option) && slot.metric !== option}
                      noOptionsText="No metric by that name"
                      // The list renders in a portal, so its own styling has to
                      // travel with it rather than sit on the field's sx.
                      ListboxProps={{
                        sx: {
                          maxHeight: METRIC_LIST_H,
                          '& .MuiAutocomplete-groupLabel': {
                            fontSize: 12, fontWeight: 700, lineHeight: 2.4, color: GREY100,
                            letterSpacing: '0.06em', textTransform: 'uppercase',
                          },
                        },
                      }}
                      sx={{
                        width: IN_METRIC,
                        '& .MuiFilledInput-root': { height: 52, py: 0 },
                        '& .MuiFilledInput-input': { fontSize: 15, color: PRIMARY },
                      }}
                      renderInput={(params) => (
                        <TextField
                          {...params}
                          variant="filled"
                          hiddenLabel
                          placeholder="Select a metric"
                        />
                      )}
                    />
                  ) : (
                  <TextField
                    select
                    value={slot.metric}
                    onChange={(e) => setMetric(index, e.target.value)}
                    variant="filled"
                    hiddenLabel
                    SelectProps={{
                      // The search field owns the focus, not the first option
                      MenuProps: { autoFocus: false },
                      onOpen: () => setMetricQuery(''),
                      onClose: () => setMetricQuery(''),
                    }}
                    sx={{
                      width: IN_METRIC,
                      '& .MuiFilledInput-root': { height: 52 },
                      '& .MuiSelect-select': { py: 0, display: 'flex', alignItems: 'center', height: 52, fontSize: 15, color: PRIMARY },
                    }}
                  >
                    <ListSubheader sx={{ p: 0, lineHeight: 'normal' }}>
                      <MetricSearch value={metricQuery} onChange={setMetricQuery} />
                    </ListSubheader>

                    {METRIC_GROUPS.map((group) => [
                      // A heading goes when the search takes the last of its items
                      <ListSubheader
                        key={`${group.header}-head`}
                        sx={{
                          px: 2, py: 0.5, fontSize: 12, fontWeight: 700, lineHeight: 2,
                          letterSpacing: '0.06em', textTransform: 'uppercase', color: GREY100,
                          ...(group.items.some((m) => metricMatches(m, metricQuery)) ? {} : { display: 'none' }),
                        }}
                      >
                        {group.header}
                      </ListSubheader>,
                      ...group.items.map((metric) => (
                        <MenuItem
                          key={metric}
                          value={metric}
                          // Hidden rather than dropped: a select whose value is not
                          // among its children loses track of what is chosen.
                          sx={metricMatches(metric, metricQuery) ? undefined : { display: 'none' }}
                          disabled={usedMetrics.includes(metric) && slot.metric !== metric}
                        >
                          {metric}
                        </MenuItem>
                      )),
                    ])}

                    {!METRIC_LIBRARY.some((m) => metricMatches(m, metricQuery)) && (
                      <Typography sx={{ px: 2, py: 1.5, fontSize: 14, color: GREY100 }}>
                        No metric by that name
                      </Typography>
                    )}
                  </TextField>
                  )}
                </Box>

                {cfg.days.map((day) => (
                  <Box key={day} sx={{ width: COL_DAY, flex: 'none', pl: '16px' }}>
                    <TextField
                      value={slot.targets[day] ?? ''}
                      onChange={(e) => setTarget(index, day, e.target.value)}
                      disabled={!slot.metric || percentMode}
                      variant="filled"
                      hiddenLabel
                      inputProps={{ inputMode: 'numeric', disabled: !slot.metric || percentMode }}
                      className={percentMode ? 'derived-value' : undefined}
                      sx={{
                        width: IN_DAY,
                        '& .MuiFilledInput-root': { height: 52 },
                        '& .MuiFilledInput-input': {
                          py: 0, height: 52, fontSize: 15, color: PRIMARY,
                          // Keep the calculated number readable, it is the target.
                          WebkitTextFillColor: PRIMARY,
                        },
                      }}
                    />
                  </Box>
                ))}

                <Box sx={{ width: COL_DAY, flex: 'none', pl: '16px' }}>
                  {filledRow && (
                    <Tooltip title="Clear row">
                      <IconButton
                        className="row-clear"
                        onClick={() => clearMetric(index)}
                        sx={{ opacity: 0, transition: 'opacity .12s' }}
                        aria-label={`Clear ${slot.metric}`}
                      >
                        <ClearIcon sx={{ fontSize: 20, color: GREY100 }} />
                      </IconButton>
                    </Tooltip>
                  )}
                </Box>
              </Box>
            );
          })}

          </Box>
          </Box>

          {/* Sits under the grid because it belongs to this squad and position
              combination, unlike the two filters above. */}
          {showImports && (
            <Box sx={{ pl: '18px', mt: 2.5 }}>
              <FilledSelect
                label="Imports used for drill averages"
                value={combo.imports}
                options={IMPORT_WINDOWS}
                onChange={setImports}
                width={499}
              />
            </Box>
          )}
        </Box>
      );
    }

    /* ── Participation and RPE (static placeholder) ──────────────────── */
    /* ── Create a csv template ───────────────────────────────────────── */
    // A block per squad: which squad, which metrics, which gamedays. The file is
    // never actually written, so the drawer's job is only to show what would go
    // into deciding its headers.
    const emptyTemplateBlock = () => ({ squad: '', metrics: [], days: [...GD_DEFAULT] });

    function TemplateDrawer({ open, onClose, onDownload }) {
      const [blocks, setBlocks] = useState(() => [emptyTemplateBlock()]);

      const update = (index, patch) => setBlocks((prev) =>
        prev.map((b, i) => (i === index ? { ...b, ...patch } : b))
      );

      const usedSquads = blocks.map((b) => b.squad).filter(Boolean);
      const ready = blocks.some((b) => b.squad && b.metrics.length && b.days.length);

      if (!open) return null;

      return (

      const startImport = () => { setDownloaded(false); setImporting(true); };

      const finishImport = (didImport) => {
        setImporting(false);

      if (importing) {
        return (
          <ImportFlow
            onExit={finishImport}
            onHome={onHome}
            onCreateTemplate={() => { setImporting(false); setDrawer(true); }}
          />

      if (editing) return <ImportFlow onExit={() => setEditing(false)} onHome={onHome} edit />;
