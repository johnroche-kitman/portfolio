    /* ══ Session planning ════════════════════════════════════════════ */

    // Up to six, matching the cap on the targets pages. Six is why the split
    // between the drills and the values needs to be draggable.
    // agg says how a metric behaves over time. sum scales with the drill
    // duration and adds up across the session; max and avg do neither, because a
    // top speed or a per minute rate does not double when a drill runs twice as
    // long. The last three carry no target, which is the point: not every metric
    // has one, and the bar simply shows none.
    const METRIC_LIBRARY_SESSION = [
      { key: 'td',       label: 'TD (m)',        name: 'Total distance',       unit: 'm',     agg: 'sum', color: '#00968F' },
      { key: 'hsr',      label: 'HSR (m)',       name: 'High speed running',   unit: 'm',     agg: 'sum', color: '#2E7D32' },
      { key: 'sd',       label: 'SD (m)',        name: 'Sprint distance',      unit: 'm',     agg: 'sum', color: '#1565C0' },
      { key: 'accels',   label: 'Accels (#)',    name: 'Accelerations',        unit: '',      agg: 'sum', color: '#E8590C' },
      { key: 'decels',   label: 'Decels (#)',    name: 'Decelerations',        unit: '',      agg: 'sum', color: '#7C3AED' },
      { key: 'load',     label: 'Load (AU)',     name: 'Player load',          unit: 'AU',    agg: 'sum', color: '#AD1457' },
      { key: 'dsl',      label: 'DSL (AU)',      name: 'Dynamic stress load',  unit: 'AU',    agg: 'sum', color: '#546E7A' },
      { key: 'maxspeed', label: 'Max spd',       name: 'Max speed',            unit: 'km/h',  agg: 'max', color: '#00838F' },
      { key: 'dpm',      label: 'DPM (m/min)',   name: 'Distance per minute',  unit: 'm/min', agg: 'avg', color: '#5D4037' },
    ];

    const metricByKey = (key) => METRIC_LIBRARY_SESSION.find((m) => m.key === key);
    const DEFAULT_COLUMNS = ['td', 'hsr', 'sd', 'accels', 'decels', 'maxspeed'];
    const MAX_SESSION_COLUMNS = 6;

    // base values hold at baseDuration; a drill scales linearly from there.
    const SESSION_DRILLS = [
      {
        id: 'd1', name: 'Rondo 5v1 3reps x 3mins', tag: 'Warm up',
        desc: 'Rondo 6v2 interspersed with mobility and dynamic flexibility.',
        duration: 15, baseDuration: 15,
        base: { td: 280, hsr: 40, sd: 85, accels: 12, decels: 3, load: 65, dsl: 45, maxspeed: 24.5, dpm: 19 },
        athletes: [22, 24], staff: [3, 3],
      },
      {
        id: 'd2', name: '1v1 SDP', tag: 'Game play',
        desc: 'Activity begins with shot from side players into mini-goal. After pass play continues to the wide areas.',
        duration: 30, baseDuration: 30,
        base: { td: 1100, hsr: 210, sd: 45, accels: 6, decels: 11, load: 260, dsl: 180, maxspeed: 31.2, dpm: 37 },
        athletes: [20, 24], staff: [3, 3],
      },
      {
        id: 'd3', name: 'Goalkeeper catching and holding', tag: 'Goalkeepers',
        desc: 'The GK should keep their eyes on the ball using their hand eye coordination to catch and hold.',
        duration: 15, baseDuration: 15,
        base: { td: 520, hsr: 95, sd: 170, accels: 3, decels: 8, load: 120, dsl: 90, maxspeed: 22.0, dpm: 35 },
        athletes: [3, 24], staff: [1, 3],
      },
      {
        id: 'd4', name: '7v6 build out game', tag: 'Medium games',
        desc: 'GK throws out. Team in possession attempts to score on any of the 2 mini goals.',
        duration: 15, baseDuration: 15,
        base: { td: 750, hsr: 140, sd: 20, accels: 9, decels: 2, load: 175, dsl: 130, maxspeed: 28.4, dpm: 50 },
        athletes: [21, 24], staff: [3, 3],
      },
    ];

    // The session targets are not their own numbers: this is a GD−1 session for
    // the first team, so they are read straight off that squad's GD−1 column on
    // the targets pages. Metrics that squad has not configured get no target,
    // which is why Player load shows a dash.
    const CONFIG_METRIC_TO_SESSION = {
      'Total distance': 'td',
      'High speed running': 'hsr',
      'Sprint distance': 'sd',
      'Accelerations (count)': 'accels',
      'Decelerations (count)': 'decels',
      'Player load': 'load',
      'Dynamic stress load': 'dsl',
      'Max speed': 'maxspeed',
      'Distance per minute': 'dpm',
    };

    const SESSION_SQUAD = '1st team';
    const SESSION_GD = 'GD−3';

    const SESSION_TARGETS = (() => {
      const dayIndex = GD_DEFAULT.indexOf(SESSION_GD);
      const out = {};
      Object.entries(SQUAD_TARGETS[SESSION_SQUAD]).forEach(([configName, values]) => {
        const key = CONFIG_METRIC_TO_SESSION[configName];
        if (key && values[dayIndex] != null) out[key] = values[dayIndex];
      });
      return out;
    })();

    const drillValue = (drill, metric) => {
      const base = drill.base[metric.key];
      if (base == null) return null;
      // Only accumulating metrics scale with how long the drill runs.
      if (metric.agg !== 'sum') return base;
      return Math.round((base * drill.duration) / drill.baseDuration);
    };

    const totalFor = (drills, metric) => {
      const vals = drills.map((d) => drillValue(d, metric)).filter((v) => v != null);
      if (!vals.length) return null;
      if (metric.agg === 'max') return Math.max(...vals);
      if (metric.agg === 'avg') return Math.round(vals.reduce((a, b) => a + b, 0) / vals.length);
      return vals.reduce((a, b) => a + b, 0);
    };

    const formatDuration = (mins) => {
      const h = Math.floor(mins / 60);
      const m = mins % 60;
      if (h && m) return `${h} hr ${m} mins`;
      if (h) return `${h} hr`;
      return `${m} mins`;
    };

    // Below this the card content wraps and the rows grow unevenly, so the drag
    // stops here rather than letting the layout fall apart.
    const SPLIT_MIN_DRILL = 360;
    // The values flex with the divider down to this width, which is the point
    // where six columns still read cleanly. Past it they stop shrinking and
    // slide off the right edge instead.
    const FOOTER_ROW_H = 24;               // labels and values share this
    const VALUES_GUTTER = 24;              // keeps the last bar off the right edge
    const VALUES_MIN = 492 + VALUES_GUTTER;
    const SPLIT_HANDLE = 13;
    const OFF_NUM_W = 42;                  // drill number and edit, workload hidden
    const OFF_PART_W = 104;                // attendance, workload hidden

    /* ── Drill diagram placeholder ───────────────────────────────────── */
    function PitchThumb() {
      return (
        <Box sx={{ width: 120, height: 68, flex: 'none', borderRadius: '2px', overflow: 'hidden' }}>
          <svg viewBox="0 0 120 68" width="120" height="68" role="img" aria-label="Drill diagram">
            <rect width="120" height="68" fill="#4C9A45" />
            <g stroke="#ffffff" strokeWidth="1" fill="none" opacity="0.85">
              <rect x="4" y="4" width="112" height="60" />
              <line x1="60" y1="4" x2="60" y2="64" />
              <circle cx="60" cy="34" r="11" />
              <rect x="4" y="18" width="14" height="32" />
              <rect x="102" y="18" width="14" height="32" />
            </g>
            <g fill="#E53935">
              <circle cx="30" cy="22" r="3" /><circle cx="44" cy="44" r="3" /><circle cx="28" cy="48" r="3" />
            </g>
            <g fill="#1E88E5">
              <circle cx="82" cy="26" r="3" /><circle cx="92" cy="46" r="3" />
            </g>
          </svg>
        </Box>
      );
    }

    /* ── One metric cell: value over a bar showing its share of target ── */
    const metricTitle = (metric, over) =>
      `${metric.name}${metric.unit ? ` (${metric.unit})` : ''}${over ? ' — over target' : ''}`;

    function MetricBar({ metric, mode, value, target, before }) {
      const track = { height: 5, borderRadius: '2px', bgcolor: '#E4E7EB', overflow: 'hidden', display: 'flex' };

      if (mode === 'none') return <Box sx={{ height: 5 }} />;

      // The running total through this drill: the budget filling up as you read down
      if (mode === 'cumulative' && metric.agg === 'sum' && target && value != null) {
        const beforePct = Math.min(100, (before / target) * 100);
        const cum = before + value;
        const cumPct = Math.min(100, (cum / target) * 100);
        return (
          <Box sx={track}>
            <Box sx={{ width: `${beforePct}%`, bgcolor: metric.color, opacity: 0.25 }} />
            <Box sx={{ width: `${Math.max(0, cumPct - beforePct)}%`, bgcolor: cum > target ? ERROR : metric.color }} />
          </Box>
        );
      }

      if (!target || value == null) return <Box sx={{ height: 5 }} />;
      const over = value > target;
      return (
        <Box sx={track}>
          <Box sx={{ width: `${Math.min(100, (value / target) * 100)}%`, bgcolor: over ? ERROR : metric.color }} />
        </Box>
      );
    }

    // The gap between drill rows lives on the card, not the row, so the value
    // panels stack flush and a tinted column runs unbroken. Each cell owns its
    // own top padding for the same reason.
    const COLUMN_TINT = 'rgba(195, 29, 43, 0.08)';

    function MetricCell({ metric, value, target, width, mode = 'target', before = 0, highlight = false, padTop = 0 }) {
      const over = target != null && value != null && value > target;
      return (
        <Box sx={{
          width, flex: 'none', pr: 2, pt: padTop,
          ...(highlight && { bgcolor: COLUMN_TINT }),
        }}>
          <Tooltip title={metricTitle(metric, over)} placement="top" followCursor>
            <Stack direction="row" alignItems="center" spacing={0.5} sx={{ mb: 0.75, cursor: 'default', width: 'fit-content' }}>
              <Typography sx={{ fontSize: 15, color: over ? ERROR : PRIMARY, fontWeight: over ? 700 : 400 }}>
                {value == null ? '—' : value}
              </Typography>
              {/* Colour on its own is not enough of a signal */}
              {over && <MI name="error" size={15} color={ERROR} />}
            </Stack>
          </Tooltip>
          <MetricBar metric={metric} mode={mode} value={value} target={target} before={before} />
        </Box>
      );
    }

    // Just the session total against its target. No drill segments: version 4
    // already carries that in each row, so repeating it here only adds noise.
    function TotalFooterBar({ metric, total, target, width }) {
      if (!target || total == null) return <Box sx={{ width, flex: 'none', pr: 2 }}><Box sx={{ height: 5 }} /></Box>;
      const over = total > target;
      return (
        <Box sx={{ width, flex: 'none', pr: 2 }}>
          {/* Same weight as the row bars, but a white track: the grey one
              disappeared into the grey of the bar itself */}
          <Box sx={{ height: 5, borderRadius: '2px', bgcolor: '#ffffff', overflow: 'hidden', display: 'flex' }}>
            <Box sx={{ width: `${Math.min(100, (total / target) * 100)}%`, bgcolor: over ? ERROR : metric.color }} />
          </Box>
        </Box>
      );
    }

    /* ── Session planning, version 1 ─────────────────────────────────── */
    function SessionPlanning({ onHome, rowBars = 'target', footerBar = 'none', highlightOver = false }) {
      const [drills, setDrills] = useState(() => SESSION_DRILLS.map((d) => ({ ...d })));
      const [showWorkload, setShowWorkload] = useState(true);
      const [complete, setComplete] = useState(false);
      const [editingId, setEditingId] = useState(null);
      const [splitWidth, setSplitWidth] = useState(640);
      const [dragging, setDragging] = useState(false);
      const [areaWidth, setAreaWidth] = useState(0);
      const [columns, setColumns] = useState(DEFAULT_COLUMNS);
      const [colAnchor, setColAnchor] = useState(null);   // { el, index }
      const [targetOverrides, setTargetOverrides] = useState({});
      const [editingTarget, setEditingTarget] = useState(null);
      const areaRef = React.useRef(null);

      const metrics = columns.map(metricByKey);
      const targetFor = (metric) => {
        const custom = targetOverrides[metric.key];
        if (custom != null && custom !== '') return Number(custom);
        return SESSION_TARGETS[metric.key] ?? null;
      };

      // Inside the padding, since that is where the columns actually start.
      const contentBox = (el) => {
        const cs = getComputedStyle(el);
        const padL = parseFloat(cs.paddingLeft) || 0;
        const padR = parseFloat(cs.paddingRight) || 0;
        const box = el.getBoundingClientRect();
        return { left: box.left + padL, width: box.width - padL - padR };
      };

      React.useEffect(() => {
        const el = areaRef.current;
        if (!el) return;
        const measure = () => setAreaWidth(contentBox(el).width);
        measure();
        const ro = new ResizeObserver(measure);
        ro.observe(el);
        return () => ro.disconnect();
      }, []);

      // One number drives the drill column, the value columns, the totals and the
      // targets, so the four can never fall out of line.
      React.useEffect(() => {
        if (!dragging) return;
        const onMove = (e) => {
          const el = areaRef.current;
          if (!el) return;
          const box = contentBox(el);
          // Dragging right pushes the values off the edge rather than squeezing
          // them, so the only ceiling is the width of the area itself.
          const max = Math.max(SPLIT_MIN_DRILL, box.width);
          setSplitWidth(Math.max(SPLIT_MIN_DRILL, Math.min(e.clientX - box.left, max)));
        };
        const onUp = () => setDragging(false);
        window.addEventListener('mousemove', onMove);
        window.addEventListener('mouseup', onUp);
        document.body.style.cursor = 'col-resize';
        document.body.style.userSelect = 'none';
        return () => {
          window.removeEventListener('mousemove', onMove);
          window.removeEventListener('mouseup', onUp);
          document.body.style.cursor = '';
          document.body.style.userSelect = '';
        };
      }, [dragging]);

      const setDuration = (id, raw) => {
        const mins = Math.max(0, parseInt(String(raw).replace(/[^0-9]/g, ''), 10) || 0);
        setDrills((prev) => prev.map((d) => (d.id === id ? { ...d, duration: mins } : d)));
      };

      const totals = metrics.reduce((acc, m) => {
        acc[m.key] = totalFor(drills, m);
        return acc;
      }, {});

      // Metrics whose session total has passed its target. Every version colours
      // the heading with this; only version 4 also tints the column.
      const overMetrics = new Set(
        metrics.filter((m) => {
          const t = targetFor(m);
          return t != null && totals[m.key] != null && totals[m.key] > t;
        }).map((m) => m.key)
      );
      const overColumns = new Set(highlightOver ? [...overMetrics] : []);

      // Running total ahead of each drill, for the cumulative bars
      const runningBefore = (() => {
        const out = [];
        const running = {};
        drills.forEach((d, i) => {
          out[i] = { ...running };
          metrics.forEach((m) => { running[m.key] = (running[m.key] ?? 0) + (drillValue(d, m) ?? 0); });
        });
        return out;
      })();
      const totalMinutes = drills.reduce((sum, d) => sum + d.duration, 0);

      // Both ends of the toggle are pixel widths so the card can animate between
      // them; hiding the workload widens the card, which pushes the values off
      // the right edge while they fade.
      const cardWidth = showWorkload
        ? splitWidth
        : (areaWidth ? Math.max(SPLIT_MIN_DRILL, areaWidth - OFF_NUM_W - OFF_PART_W) : '100%');
      // The mirror of fadeSx: these two only exist when the workload view is off
      const offFadeSx = {
        opacity: showWorkload ? 0 : 1,
        pointerEvents: showWorkload ? 'none' : 'auto',
        transition: 'opacity .22s ease',
      };
      const growSx = { transition: dragging ? 'none' : 'width .3s cubic-bezier(.4,0,.2,1)' };
      const fadeSx = {
        opacity: showWorkload ? 1 : 0,
        pointerEvents: showWorkload ? 'auto' : 'none',
        transition: 'opacity .22s ease',
      };
      // Fades and gives its height back, so the targets bar shrinks to the
      // duration line and the column headings leave no gap behind.
      const collapseSx = {
        ...fadeSx,
        maxHeight: showWorkload ? 160 : 0,
        overflow: 'hidden',
        transition: 'opacity .22s ease, max-height .3s cubic-bezier(.4,0,.2,1)',
      };

      // Flex owns this rather than a measured width: the panel grows into
      // whatever the divider leaves it, stops at a floor that keeps six columns
      // legible, and past that overflows and is clipped, so it slides off right.
      // Collapsed to nothing when the workload view is off, or it would keep its
      // minimum width and shove the attendance column off the right edge.
      const valuesSx = showWorkload
        ? { flex: '1 1 auto', minWidth: VALUES_MIN, pr: `${VALUES_GUTTER}px` }
        : { flex: '0 0 0px', width: 0, minWidth: 0, overflow: 'hidden', pr: 0 };
      // Reserve exactly one slot for the + button and divide the rest between the
      // columns, so five metrics sit at the same width as six, four at the width
      // of five, and so on.
      const columnSlots = metrics.length < MAX_SESSION_COLUMNS
        ? metrics.length + 1
        : MAX_SESSION_COLUMNS;
      const colWidth = `${100 / columnSlots}%`;

      // Sits inside the first drill's row rather than in a band of its own,
      // which is where the space above the drills was going.
      // A plain function, not a component declared in the render: as a component
      // it would be a new type every render, remounting the headings and leaving
      // the menu's anchor detached, which parked it in the top left corner.
      const renderMetricHeaders = () => (
        <Box sx={{ display: 'flex' }}>
          {metrics.map((m, i) => (
            <Box key={m.key} sx={{
              width: colWidth, flex: 'none', pr: 2, pt: '10px',
              display: 'flex', alignItems: 'center',
              ...(overColumns.has(m.key) && { bgcolor: COLUMN_TINT }),
              '&:hover .col-tool': { opacity: 1 },
            }}>
              {/* The whole label is the hit area, not just the icon */}
              <ButtonBase
                onClick={(e) => setColAnchor({ el: e.currentTarget, index: i })}
                aria-label={`Change the ${m.name} column`}
                sx={{
                  display: 'flex', alignItems: 'center', gap: 0.25, minWidth: 0,
                  px: 0.75, py: 0.5, ml: -0.75, borderRadius: `${RADIUS}px`,
                  justifyContent: 'flex-start',
                  '&:hover': { bgcolor: 'rgba(59,73,96,0.06)' },
                }}
              >
                <Tooltip title={metricTitle(m, overMetrics.has(m.key))} placement="top">
                  <Box component="span" sx={{
                    fontSize: 12,
                    color: overMetrics.has(m.key) ? ERROR : GREY100,
                    fontWeight: overMetrics.has(m.key) ? 700 : 400,
                    whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis',
                  }}>
                    {m.label}
                  </Box>
                </Tooltip>
                <Box className="col-tool" sx={{ opacity: 0, transition: 'opacity .12s', display: 'flex', flex: 'none' }}>
                  <MI name="edit" size={13} color={GREY100} />
                </Box>
              </ButtonBase>

              {/* Sits outside the button: nesting it would fire the menu too */}
              {metrics.length > 1 && (
                <IconButton
                  className="col-tool"
                  size="small"
                  onClick={() => setColumns((prev) => prev.filter((_, idx) => idx !== i))}
                  aria-label={`Remove the ${m.name} column`}
                  sx={{ opacity: 0, transition: 'opacity .12s', p: 0.25, flex: 'none' }}
                >
                  <MI name="close" size={13} color={GREY100} />
                </IconButton>
              )}
            </Box>
          ))}

          {metrics.length < MAX_SESSION_COLUMNS && (
            <Box sx={{ width: colWidth, flex: 'none', pr: 2, pt: '10px', display: 'flex', alignItems: 'center' }}>
              <ButtonBase
                onClick={(e) => setColAnchor({ el: e.currentTarget, index: null })}
                aria-label="Add a metric column"
                sx={{
                  display: 'flex', alignItems: 'center', gap: 0.25,
                  px: 0.75, py: 0.5, ml: -0.75, borderRadius: `${RADIUS}px`,
                  color: GREY100, fontSize: 12,
                  '&:hover': { bgcolor: 'rgba(59,73,96,0.06)' },
                }}
              >
                <MI name="add" size={14} color={GREY100} />
                Metric
              </ButtonBase>
            </Box>
          )}
        </Box>
      );

      return (
        <Box sx={{ height: '100%', display: 'flex' }}>
          <NavRail onHome={onHome} activeLabel="Calendar" />

          <Box sx={{ flex: 1, display: 'flex', flexDirection: 'column', minWidth: 0 }}>
            <TopBar breadcrumb="Calendar" />

            <Box sx={{ flex: 1, display: 'flex', flexDirection: 'column', minHeight: 0, overflow: 'hidden' }}>

              {/* Everything above the targets bar scrolls, including the heading */}
              <Box sx={{ flex: 1, overflowY: 'auto', overflowX: 'hidden', bgcolor: '#FAFAFA' }}>

                {/* Heading band stays white down to and including the tabs */}
                <Box sx={{ bgcolor: '#fff', px: 3, pt: 2.5 }}>

                  <Stack direction="row" alignItems="center" spacing={0.5} sx={{ color: GREY100, mb: 0.5 }}>
                    <MI name="chevron_left" size={18} color={GREY100} />
                    <Typography sx={{ fontSize: 14, color: GREY100 }}>Gameweek</Typography>
                  </Stack>

                  <Stack direction="row" alignItems="center" justifyContent="space-between">
                    <Typography sx={{ fontSize: 28, fontWeight: 600, letterSpacing: -0.2 }}>Training</Typography>

                    <Stack direction="row" alignItems="center" spacing={2}>
                      <Stack
                        direction="row" alignItems="center" spacing={0.75}
                        onClick={() => setShowWorkload((v) => !v)}
                        sx={{ cursor: 'pointer', userSelect: 'none' }}
                      >
                        <Typography sx={{ fontSize: 14 }}>Workload</Typography>
                        <MI name={showWorkload ? 'visibility' : 'visibility_off'} size={20} color={PRIMARY} />
                      </Stack>

                      <Stack direction="row" alignItems="center" spacing={0.5}>
                        <Typography sx={{ fontSize: 14 }}>Complete</Typography>
                        <Switch
                          checked={complete}
                          onChange={(e) => setComplete(e.target.checked)}
                          inputProps={{ 'aria-label': 'Mark session complete' }}
                        />
                      </Stack>

                      <Button variant="contained" color="secondary" sx={{ px: 2.25 }}>Edit details</Button>
                      <MI name="more_vert" size={22} color={PRIMARY} />
                    </Stack>
                  </Stack>

                  <Stack direction="row" spacing={3} sx={{ mt: 1, mb: 2, flexWrap: 'wrap' }}>
                    {[
                      ['Date:', '4 Apr 2025 10:00'],
                      ['Gameweek:', 'IS6 - Arsenal FC (Away)'],
                      ['GD:', SESSION_GD.replace('GD', '')],
                      ['Surface type:', 'Grass'],
                    ].map(([k, v]) => (
                      <Typography key={k} sx={{ fontSize: 14, color: GREY100 }}>
                        {k} <Box component="span" sx={{ color: PRIMARY, fontWeight: 600 }}>{v}</Box>
                      </Typography>
                    ))}
                  </Stack>

                  <Box sx={{ borderBottom: `1px solid ${DIVIDER}` }}>
                    <Tabs
                      value="Planning"
                      sx={{
                        minHeight: 44,
                        '& .MuiTabs-indicator': { backgroundColor: PRIMARY, height: 2 },
                        '& .MuiTab-root': { pointerEvents: 'none', px: 0, mr: 3.5, minWidth: 0 },
                      }}
                    >
                      {['Planning', 'Athlete selection', 'Staff selection', 'Development goals', 'Collection', 'Imported data']
                        .map((l) => <Tab key={l} label={l} value={l} />)}
                    </Tabs>
                  </Box>
                </Box>

                <Box ref={areaRef} sx={{ px: 3, pt: 2, pb: 4 }}>

                  {drills.map((drill, drillIndex) => (
                    <Box key={drill.id} sx={{ display: 'flex', alignItems: 'flex-start' }}>

                      {/* Drill number and edit, only without the workload view */}
                      <Box sx={{
                        width: showWorkload ? 0 : OFF_NUM_W, flex: 'none', overflow: 'hidden',
                        display: 'flex', alignItems: 'center', gap: 0.5, pt: '14px',
                        ...growSx, ...offFadeSx,
                      }}>
                        <Typography sx={{ fontSize: 14, color: GREY100 }}>{drillIndex + 1}</Typography>
                        <MI name="edit" size={14} color={GREY100} />
                      </Box>

                      {/* Fixed width and clipped, so dragging the divider left slides
                          the values over the card rather than reflowing it. */}
                      <Box sx={{
                        width: cardWidth, flex: 'none', ...growSx, mb: 1.5,
                        minWidth: 0, overflow: 'hidden', position: 'relative',
                        border: `1px solid ${DIVIDER}`, borderRadius: `${RADIUS}px`, bgcolor: '#fff',
                        display: 'flex', alignItems: 'flex-start', gap: 1.5, p: 1.5,
                      }}>
                        <Box sx={{ pt: 1.5, flex: 'none' }}>
                          <MI name="drag_indicator" size={18} color="#C3C9D4" />
                        </Box>

                        <PitchThumb />

                        <Box sx={{ flex: 1, minWidth: 0, pr: 5 }}>
                          <Stack direction="row" alignItems="center" spacing={1} sx={{ mb: 0.5, minWidth: 0 }}>
                            <Typography sx={{
                              fontSize: 15, fontWeight: 700, minWidth: 0,
                              whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis',
                            }}>{drill.name}</Typography>
                            <Box sx={{
                              bgcolor: NEUTRAL_200, borderRadius: '3px', px: 1, py: '2px', flex: 'none',
                              fontSize: 12, color: PRIMARY, whiteSpace: 'nowrap',
                            }}>{drill.tag}</Box>
                          </Stack>

                          <Typography sx={{
                            fontSize: 14, color: PRIMARY, mb: 0.75,
                            overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap',
                          }}>{drill.desc}</Typography>

                          {editingId === drill.id ? (
                            <Stack direction="row" alignItems="center" spacing={0.75}>
                              <TextField
                                value={drill.duration}
                                autoFocus
                                onFocus={(e) => e.target.select()}
                                onChange={(e) => setDuration(drill.id, e.target.value)}
                                onBlur={() => setEditingId(null)}
                                onKeyDown={(e) => { if (e.key === 'Enter') setEditingId(null); }}
                                variant="outlined"
                                size="small"
                                inputProps={{ inputMode: 'numeric', style: { padding: '4px 8px', fontSize: 13, width: 34 } }}
                                sx={{ '& .MuiOutlinedInput-root': { borderRadius: `${RADIUS}px` } }}
                              />
                              <Typography sx={{ fontSize: 13, color: GREY100 }}>mins</Typography>
                            </Stack>
                          ) : (
                            <Stack
                              direction="row" alignItems="center" spacing={0.75}
                              onClick={() => setEditingId(drill.id)}
                              sx={{ cursor: 'pointer', width: 'fit-content' }}
                            >
                              <Typography sx={{ fontSize: 13, color: GREY100, whiteSpace: 'nowrap' }}>{drill.duration} mins</Typography>
                              <MI name="edit" size={13} color={GREY100} />
                            </Stack>
                          )}

                          <Typography sx={{ fontSize: 13, color: GREY100, mt: 0.5, whiteSpace: 'nowrap' }}>
                            Add:{' '}
                            {['Area size', 'Note', 'Principles'].map((item, i) => (
                              <React.Fragment key={item}>
                                {i > 0 && ' | '}
                                <Box component="span" sx={{
                                  color: PRIMARY, cursor: 'pointer',
                                  '&:hover': { textDecoration: 'underline' },
                                }}>
                                  {item}
                                </Box>
                              </React.Fragment>
                            ))}
                          </Typography>
                        </Box>

                        {/* Pinned to the card edge, so it rides the divider and stays
                            visible however far the values are dragged over. */}
                        <Box sx={{ position: 'absolute', top: 8, right: 4, zIndex: 2, bgcolor: '#fff', borderRadius: '50%' }}>
                          <IconButton size="small" aria-label={`Options for ${drill.name}`}>
                            <MI name="more_vert" size={20} color={PRIMARY} />
                          </IconButton>
                        </Box>
                      </Box>

                      <Box
                        onMouseDown={(e) => { e.preventDefault(); setDragging(true); }}
                        title="Drag to resize"
                        sx={{
                          width: showWorkload ? SPLIT_HANDLE : 0, flex: 'none', alignSelf: 'stretch',
                          cursor: showWorkload ? 'col-resize' : 'default',
                          display: 'flex', alignItems: 'center', justifyContent: 'center',
                          '&:hover .grip': { bgcolor: PRIMARY },
                          ...fadeSx,
                        }}
                      >
                        <Box className="grip" sx={{
                          width: 3, height: 26, borderRadius: 2,
                          bgcolor: dragging ? PRIMARY : '#D6DAE2', transition: 'background-color .12s',
                        }} />
                      </Box>

                      <Box sx={{ ...valuesSx, alignSelf: 'stretch', display: 'flex', flexDirection: 'column', ...fadeSx }}>
                        {drillIndex === 0 && renderMetricHeaders()}
                        <Box sx={{ display: 'flex', flex: 1 }}>
                          {metrics.map((m) => (
                            <MetricCell
                              key={m.key}
                              metric={m}
                              value={drillValue(drill, m)}
                              target={targetFor(m)}
                              width={colWidth}
                              mode={rowBars}
                              before={runningBefore[drillIndex]?.[m.key] ?? 0}
                              highlight={overColumns.has(m.key)}
                              padTop={drillIndex === 0 ? 0 : '10px'}
                            />
                          ))}
                        </Box>
                      </Box>

                      {/* Attendance, only without the workload view */}
                      <Box sx={{
                        width: showWorkload ? 0 : OFF_PART_W, flex: 'none', overflow: 'hidden',
                        pt: '14px', pl: 2, ...growSx, ...offFadeSx,
                      }}>
                        <Stack direction="row" alignItems="center" spacing={0.75}>
                          <MI name="people_alt" size={18} color={PRIMARY} />
                          <Typography sx={{ fontSize: 14, whiteSpace: 'nowrap' }}>
                            {drill.athletes[0]}/{drill.athletes[1]}
                          </Typography>
                        </Stack>
                        <Stack direction="row" alignItems="center" spacing={0.75} sx={{ mt: 0.5 }}>
                          <MI name="record_voice_over" size={18} color={PRIMARY} />
                          <Typography sx={{ fontSize: 14, whiteSpace: 'nowrap' }}>
                            {drill.staff[0]}/{drill.staff[1]}
                          </Typography>
                        </Stack>
                      </Box>
                    </Box>
                  ))}

                  <Stack direction="row" spacing={2} alignItems="center" sx={{ mt: 2.5 }}>
                    <Button variant="contained" color="primary" startIcon={<MI name="add" size={18} color="#fff" />} sx={{ px: 2 }}>
                      Add drill from library
                    </Button>
                    <Button sx={{ color: PRIMARY, px: 0, '&:hover': { bgcolor: 'transparent', opacity: 0.7 } }} startIcon={<MI name="add" size={18} color={PRIMARY} />}>
                      Create drill
                    </Button>
                  </Stack>

                  <Menu
                    anchorEl={colAnchor?.el}
                    open={Boolean(colAnchor)}
                    onClose={() => setColAnchor(null)}
                  >
                    {METRIC_LIBRARY_SESSION.map((m) => {
                      const adding = colAnchor?.index == null;
                      const usedElsewhere = columns.includes(m.key) && (adding || columns[colAnchor?.index] !== m.key);
                      return (
                        <MenuItem
                          key={m.key}
                          disabled={usedElsewhere}
                          selected={!adding && columns[colAnchor?.index] === m.key}
                          onClick={() => {
                            setColumns((prev) => adding
                              ? [...prev, m.key]
                              : prev.map((k, i) => (i === colAnchor.index ? m.key : k)));
                            setColAnchor(null);
                          }}
                        >
                          <Stack direction="row" alignItems="baseline" spacing={1}>
                            <span>{m.name}</span>
                            {SESSION_TARGETS[m.key] == null && (
                              <Box component="span" sx={{ fontSize: 12, color: GREY100 }}>no target</Box>
                            )}
                          </Stack>
                        </MenuItem>
                      );
                    })}
                  </Menu>
                </Box>
              </Box>

              {/* Targets bar, held at the foot of the page */}
              <Box sx={{
                flex: 'none', bgcolor: NEUTRAL_200, boxShadow: '0 -2px 6px rgba(59,73,96,0.12)',
                px: 3, py: 1.5, display: 'flex', alignItems: 'flex-start', overflow: 'hidden', zIndex: 1,
              }}>
                <Box sx={{
                  width: cardWidth, flex: 'none', minWidth: 0, ...growSx,
                  display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: 2,
                }}>
                  <Typography sx={{
                    fontSize: 14, color: PRIMARY, whiteSpace: 'nowrap',
                    overflow: 'hidden', textOverflow: 'ellipsis',
                  }}>
                    Total duration: <Box component="span" sx={{ fontWeight: 600 }}>{formatDuration(totalMinutes)}</Box>
                  </Typography>

                  {/* Labels and values are separate columns, so both are pinned to
                      the same row height or they drift out of line */}
                  <Box sx={{ flex: 'none', pr: 2, ...collapseSx }}>
                    {['Remaining:', 'Total workload:', 'Session target:'].map((label) => (
                      <Box key={label} sx={{
                        height: FOOTER_ROW_H, display: 'flex', alignItems: 'center', justifyContent: 'flex-end',
                        fontSize: 13, color: GREY100, whiteSpace: 'nowrap',
                      }}>
                        {label}
                      </Box>
                    ))}
                  </Box>
                </Box>

                <React.Fragment>
                    <Box sx={{ width: showWorkload ? SPLIT_HANDLE : 0, flex: 'none' }} />
                    <Box sx={{ ...valuesSx, ...collapseSx }}>
                      {/* What is still available to spend on this session */}
                      <Box sx={{ display: 'flex', alignItems: 'center', height: FOOTER_ROW_H }}>
                        {metrics.map((m) => {
                          const target = targetFor(m);
                          const total = totals[m.key];
                          // Round: 32 - 31.2 lands at 0.7999999999999972 otherwise
                          const raw = target == null || total == null ? null : target - total;
                          const left = raw == null ? null : Math.round(raw * 10) / 10;
                          const over = left != null && left < 0;
                          return (
                            <Box key={m.key} sx={{
                              width: colWidth, flex: 'none', pr: 2,
                            }}>
                              <Tooltip
                                title={left == null
                                  ? `${m.name} — no target to measure against`
                                  : over
                                    ? `${m.name} — ${Math.abs(left)}${m.unit ? ' ' + m.unit : ''} over target`
                                    : `${m.name} — ${left}${m.unit ? ' ' + m.unit : ''} still available`}
                                placement="top"
                              >
                                <Stack direction="row" alignItems="center" spacing={0.5} sx={{ cursor: 'default', width: 'fit-content' }}>
                                  <Box component="span" sx={{
                                    fontSize: 14,
                                    color: left == null ? DISABLED : over ? ERROR : PRIMARY,
                                    fontWeight: over ? 700 : 400,
                                  }}>
                                    {left == null ? '—' : Math.abs(left)}
                                  </Box>
                                  {/* The word carries it. A minus sign read as
                                      "minus 110 left", which is not what it means. */}
                                  {over && (
                                    <Box component="span" sx={{
                                      fontSize: 10, fontWeight: 700, letterSpacing: '0.06em',
                                      color: ERROR, lineHeight: 1,
                                    }}>
                                      OVER
                                    </Box>
                                  )}
                                </Stack>
                              </Tooltip>
                            </Box>
                          );
                        })}
                      </Box>

                      <Box sx={{ display: 'flex', alignItems: 'center', height: FOOTER_ROW_H }}>
                        {metrics.map((m) => {
                          const target = targetFor(m);
                          const over = target != null && totals[m.key] > target;
                          return (
                            <Box key={m.key} sx={{
                              width: colWidth, flex: 'none', pr: 2,
                            }}>
                              <Tooltip title={metricTitle(m, over)} placement="top">
                                <Stack direction="row" alignItems="center" spacing={0.5} sx={{ cursor: 'default', width: 'fit-content' }}>
                                  <Box component="span" sx={{
                                    fontSize: 14,
                                    color: over ? ERROR : PRIMARY, fontWeight: over ? 700 : 400,
                                  }}>
                                    {totals[m.key] == null ? '—' : totals[m.key]}
                                  </Box>
                                </Stack>
                              </Tooltip>
                            </Box>
                          );
                        })}
                      </Box>

                      <Box sx={{ display: 'flex', alignItems: 'center', height: FOOTER_ROW_H }}>
                        {metrics.map((m) => {
                          const target = targetFor(m);
                          const custom = targetOverrides[m.key] != null && targetOverrides[m.key] !== '';
                          if (editingTarget === m.key) {
                            return (
                              <Box key={m.key} sx={{ width: colWidth, flex: 'none', pr: 2 }}>
                                <TextField
                                  value={targetOverrides[m.key] ?? (target ?? '')}
                                  autoFocus
                                  onFocus={(e) => e.target.select()}
                                  onChange={(e) => setTargetOverrides((prev) => ({
                                    ...prev, [m.key]: e.target.value.replace(/[^0-9.]/g, ''),
                                  }))}
                                  onBlur={() => setEditingTarget(null)}
                                  onKeyDown={(e) => { if (e.key === 'Enter') setEditingTarget(null); }}
                                  variant="outlined"
                                  size="small"
                                  inputProps={{ inputMode: 'numeric', style: { padding: '2px 6px', fontSize: 13, width: 52 } }}
                                  sx={{ '& .MuiOutlinedInput-root': { borderRadius: `${RADIUS}px`, bgcolor: '#fff' } }}
                                />
                              </Box>
                            );
                          }
                          return (
                            <Box key={m.key} sx={{
                              width: colWidth, flex: 'none', pr: 2,
                            }}>
                              {/* Value and icon together are the hit area */}
                              <ButtonBase
                                onClick={() => setEditingTarget(m.key)}
                                aria-label={`Set a custom ${m.name} target`}
                                sx={{
                                  display: 'flex', alignItems: 'center', gap: 0.25,
                                  px: 0.75, py: 0.5, ml: -0.75, borderRadius: `${RADIUS}px`,
                                  maxWidth: '100%', justifyContent: 'flex-start',
                                  '&:hover': { bgcolor: 'rgba(59,73,96,0.06)' },
                                  '&:hover .tgt-edit': { opacity: 1 },
                                }}
                              >
                                <Tooltip
                                  title={target == null
                                    ? `${m.name} — no target set`
                                    : `${metricTitle(m, false)}${custom ? ' — custom target' : ''}`}
                                  placement="top"
                                >
                                  <Box component="span" sx={{
                                    fontSize: 14, fontWeight: 700,
                                    color: target == null ? DISABLED : PRIMARY,
                                  }}>
                                    {target == null ? '—' : target}
                                  </Box>
                                </Tooltip>
                                <Box className="tgt-edit" sx={{ opacity: 0, transition: 'opacity .12s', display: 'flex', flex: 'none' }}>
                                  <MI name="edit" size={13} color={GREY100} />
                                </Box>
                              </ButtonBase>
                            </Box>
                          );
                        })}
                      </Box>

                      {footerBar === 'total' && (
                        <Box sx={{ display: 'flex', alignItems: 'center', mt: 1 }}>
                          {metrics.map((m) => (
                            <TotalFooterBar
                              key={m.key}
                              metric={m}
                              total={totals[m.key]}
                              target={targetFor(m)}
                              width={colWidth}
                            />
                          ))}
                        </Box>
                      )}
                    </Box>
                  </React.Fragment>
              </Box>
            </Box>
          </Box>
        </Box>
      );
    }

    /* ── Gate ────────────────────────────────────────────────────────
       Worth being clear about what this is: the page is a static file on
       GitHub Pages, so there is no server to check anything. This keeps the
       prototype away from anyone who wanders onto the URL, and nothing more.
       Anyone who opens dev tools can walk straight past it, so do not put
       anything genuinely sensitive in here. Only the hash is stored, so the
       password itself is not sitting in the source. */
    const GATE_HASH = '59fd8c84fb1a3564f0b2ec8ea4f56fb34e16a0a59b9b1fb26ab08687a057c11f';

    const sha256Hex = async (text) => {
      const bytes = new TextEncoder().encode(text);
      const digest = await crypto.subtle.digest('SHA-256', bytes);
      return [...new Uint8Array(digest)].map((b) => b.toString(16).padStart(2, '0')).join('');
    };

    function PasswordGate({ onUnlock }) {
      const [value, setValue] = useState('');
      const [error, setError] = useState(false);
      const [checking, setChecking] = useState(false);

      const submit = async (e) => {
        e.preventDefault();
        if (!value || checking) return;
        setChecking(true);
        const ok = (await sha256Hex(value.trim())) === GATE_HASH;
        setChecking(false);
        if (ok) {
          try { sessionStorage.setItem('wt-unlocked', '1'); } catch (err) { /* private mode */ }
          onUnlock();
        } else {
          setError(true);
          setValue('');
        }
      };

      return (
        <Box sx={{
          minHeight: '100%', display: 'flex', flexDirection: 'column',
          alignItems: 'center', justifyContent: 'center', px: 3, bgcolor: '#fafafa',
        }}>
          <Box sx={{
            width: 64, height: 64, mb: 3, borderRadius: '50%', bgcolor: '#0b1220',
            display: 'flex', alignItems: 'center', justifyContent: 'center',
          }}>
            <Box component="img" src="kitman-logo.png" alt="Kitman Labs" sx={{ width: 44, height: 44, objectFit: 'contain' }} />
          </Box>

          <Typography sx={{ fontSize: 22, fontWeight: 600, mb: 0.5 }}>Workload targets prototype</Typography>
          <Typography sx={{ fontSize: 14, color: GREY100, mb: 3 }}>Enter the password to continue.</Typography>

          <Box component="form" onSubmit={submit} sx={{ display: 'flex', flexDirection: 'column', gap: 1.5, width: '100%', maxWidth: 320 }}>
            <TextField
              type="password"
              value={value}
              autoFocus
              onChange={(e) => { setValue(e.target.value); setError(false); }}
              error={error}
              helperText={error ? 'That password is not right.' : ' '}
              variant="filled"
              hiddenLabel
              placeholder="Password"
              sx={{ '& .MuiFilledInput-root': { height: 50, bgcolor: '#fff' } }}
            />
            <Button type="submit" variant="contained" color="primary" disabled={!value || checking} sx={{ height: 44 }}>
              Continue
            </Button>
          </Box>
        </Box>
      );
    }

    /* ── Hash router, so every version has a shareable link ──────────── */
    function App() {
      const [unlocked, setUnlocked] = useState(() => {
        try { return sessionStorage.getItem('wt-unlocked') === '1'; } catch (e) { return false; }
      });
      const [route, setRoute] = useState(() => window.location.hash || '#/');

      React.useEffect(() => {
        const onHashChange = () => setRoute(window.location.hash || '#/');
        window.addEventListener('hashchange', onHashChange);
        return () => window.removeEventListener('hashchange', onHashChange);
      }, []);

      const goHome = () => { window.location.hash = '#/'; };

      if (!unlocked) return <PasswordGate onUnlock={() => setUnlocked(true)} />;

      if (route === '#/v1') return <VersionOne onHome={goHome} />;
      if (route === '#/v2') return <VersionTwo onHome={goHome} />;
      if (route === '#/v3') return <VersionOne onHome={goHome} allowPercent key="v3" />;
      if (route === '#/planning-v1') return <SessionPlanning onHome={goHome} key="p1" />;
      if (route === '#/planning-v2') return <SessionPlanning onHome={goHome} rowBars="cumulative" key="p2" />;
      if (route === '#/planning-v3') return <SessionPlanning onHome={goHome} rowBars="cumulative" footerBar="total" key="p3" />;
      if (route === '#/planning-v4') return <SessionPlanning onHome={goHome} highlightOver key="p4" />;
      return <VersionsLanding />;
    }

    createRoot(document.getElementById('root')).render(
      <ThemeProvider theme={theme}>
        <CssBaseline />
        <App />
      </ThemeProvider>
    );
  </script>
</body>
</html>
