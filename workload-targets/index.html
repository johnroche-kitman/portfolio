      { valid: true,  cells: ['1st team', 'HSR Distance (m)',    '420',  '610',  '480',  '260',  '90',   '380'] },
      { valid: true,  cells: ['1st team', 'Sprint Distance (m)', '120',  '210',  '180',  '70',   '20',   '110'] },
      { valid: true,  cells: ['1st team', 'Accels >3m/s',        '28',   '38',   '32',   '18',   '8',    '26'] },
      { valid: true,  cells: ['1st team', 'Decels >3m/s',        '30',   '41',   '34',   '19',   '9',    '28'] },
      { valid: true,  cells: ['U21',      'Total Distance (m)',  '4300', '5000', '3800', '2800', '2000', '3900'] },
      { valid: true,  cells: ['U21',      'HSR Distance (m)',    '360',  '520',  '410',  '220',  '80',   '320'] },
      { valid: true,  cells: ['U21',      'RPE x Duration',      '380',  '460',  '350',  '230',  '150',  '340'] },
      { valid: true,  cells: ['U18',      'Total Distance (m)',  '3800', '4500', '3400', '2500', '1800', '3500'] },
      { valid: false, errorAt: 1, errorText: 'Not a metric in your library',
        cells: ['U21',      'Total Dist (m)',      '4300', '5000', '3800', '2800', '2000', '3900'] },
    ];

    // The percentage import needs no metric column: one figure per gameday
    // applies to every metric, taken as a share of that metric's own GD max.
    const PERCENT_CSV_COLUMNS = ['Squad', 'Position', 'Imports_used', 'GD−4', 'GD−3', 'GD−2', 'GD−1', 'GD+1', 'GD+2'];

    const PERCENT_CSV_ROWS = [
      { valid: true,  cells: ['1st team', 'All',      '5',  '46', '53', '40', '30', '21', '42'] },
      { valid: true,  cells: ['1st team', 'Midfield', '5',  '50', '57', '44', '33', '24', '46'] },
      { valid: true,  cells: ['1st team', 'Striker',  '5',  '48', '55', '42', '31', '22', '44'] },
      { valid: true,  cells: ['U21',      'All',      '5',  '45', '52', '39', '29', '20', '41'] },
      { valid: true,  cells: ['U18',      'All',      '10', '44', '50', '38', '28', '19', '40'] },
      { valid: false, errorAt: 0, errorText: 'No squad by that name',
        cells: ['U23',      'All',      '5',  '45', '52', '39', '29', '20', '41'] },
    ];

    const INSTRUCTIONS_W = 340;
    const AMBER = '#ED9A00';
    const AMBER_BG = '#FFF6E5';

    /* ── Import stepper ──────────────────────────────────────────────── */
    function StepCircle({ state, label }) {
      const bg = state === 'pending' ? '#C0C6CF' : PRIMARY;
      return (
        <Box sx={{
          width: 26, height: 26, borderRadius: '50%', bgcolor: bg, flex: 'none',
          display: 'flex', alignItems: 'center', justifyContent: 'center',
          color: '#fff', fontSize: 12, fontWeight: 600,
        }}>
          {state === 'done' ? <MI name="check" size={15} color="#fff" /> : label}
        </Box>
      );
    }

    function ImportStepper({ step, onPrevious, onNext, nextLabel, nextDisabled }) {
      return (
        <Box sx={{
          display: 'flex', alignItems: 'center', gap: 0,
          px: 3, py: 1.75, flex: 'none', borderBottom: `1px solid ${DIVIDER}`,
        }}>
          <Stack direction="row" alignItems="center" spacing={1.5}>
            <StepCircle state={step === 1 ? 'current' : 'done'} label="2" />
            <Box>
              <Typography sx={{ fontSize: 14, fontWeight: 600 }}>Import CSV</Typography>
              <Typography sx={{ fontSize: 12, color: GREY100, mt: '2px' }}>Set targets in the csv file</Typography>
            </Box>
          </Stack>

          <Box sx={{ flex: 1, height: '1px', bgcolor: DIVIDER, mx: 2.5 }} />

          <Stack direction="row" alignItems="center" spacing={1.5}>
            <StepCircle state={step === 2 ? 'current' : 'pending'} label="3" />
            <Box>
              <Typography sx={{ fontSize: 14, fontWeight: 600 }}>Preview import</Typography>
              <Typography sx={{ fontSize: 12, color: GREY100, mt: '2px' }}>Review targets</Typography>
            </Box>
          </Stack>

          <Stack direction="row" spacing={1} sx={{ ml: 3.5 }}>
            <Button variant="contained" color="secondary" onClick={onPrevious} sx={{ px: 2.5 }}>Previous</Button>
            <Button variant="contained" color="primary" onClick={onNext} disabled={nextDisabled} sx={{ px: 3 }}>
              {nextLabel}
            </Button>
          </Stack>
        </Box>
      );
    }

    /* ── Instructions panel ──────────────────────────────────────────── */
    function InstructionsPanel({ onCollapse, mode = 'metrics', onCreateTemplate }) {
      const body = { fontSize: 15, lineHeight: 1.6, color: PRIMARY };
      const strong = { fontSize: 15, fontWeight: 700, color: PRIMARY };
      return (
        <Box sx={{
          width: INSTRUCTIONS_W, flex: 'none', borderRight: `1px solid ${DIVIDER}`,
          overflowY: 'auto', bgcolor: '#fff',
        }}>
          <Stack
            direction="row" alignItems="center" justifyContent="space-between"
            sx={{ px: 3, py: 2.25, borderBottom: `1px solid ${DIVIDER}` }}
          >
            <Typography sx={{ fontSize: 20, fontWeight: 700 }}>Instructions</Typography>
            <IconButton onClick={onCollapse} aria-label="Collapse instructions" sx={{ p: 0.5 }}>
              <MI name="keyboard_double_arrow_left" size={22} color={PRIMARY} />
            </IconButton>
          </Stack>

          <Box sx={{ px: 3, py: 3, display: 'flex', flexDirection: 'column', gap: 2.5 }}>
            {/* Where a template has to be made first, the panel sends you to make
                one rather than handing you a file that does not exist yet. */}
            {onCreateTemplate ? (
              <React.Fragment>
                <Typography sx={body}>
                  Create a csv template with the relevant headers, then fill it in
                  and upload it here.
                </Typography>
                <Typography
                  component="a"
                  href="#/v5"
                  onClick={(e) => { e.preventDefault(); onCreateTemplate(); }}
                  sx={{ ...strong, textDecoration: 'none', '&:hover': { textDecoration: 'underline' } }}
                >
                  Create CSV template
                </Typography>
              </React.Fragment>
            ) : (
              <React.Fragment>
                <Typography sx={body}>
                  Download a template csv file with the relevant headers.
                  {mode === 'metrics' && ' Select metrics from the metrics sheet.'}
                </Typography>

                {/* The metrics sheet is only of use to the file that names metrics */}
                {(mode === 'metrics' ? ['template.csv', 'metrics-list.csv'] : ['template.csv']).map((file) => (
                  <Typography
                    key={file}
                    component="a"
                    href="#/v2"
                    onClick={(e) => e.preventDefault()}
                    sx={{ ...strong, textDecoration: 'none', '&:hover': { textDecoration: 'underline' } }}
                  >
                    {file}
                  </Typography>
                ))}
              </React.Fragment>
            )}

            <Typography sx={strong}>Accepted values</Typography>

            {/* The metric file carries neither, so nothing here names them */}
            {mode === 'percent' && (
              <React.Fragment>
                <Box>
                  <Typography sx={body}>Positions:</Typography>
                  <Typography sx={body}>All</Typography>
                  <Typography sx={body}>Goalkeeper</Typography>
                  <Typography sx={body}>Midfield</Typography>
                  <Typography sx={body}>Striker</Typography>
                </Box>

                <Box>
                  <Typography sx={body}>Imports_used</Typography>
                  <Typography sx={body}>(to calculate average)</Typography>
                  <Typography sx={body}>All</Typography>
                  <Typography sx={body}>1-100</Typography>
                </Box>
              </React.Fragment>
            )}

            {mode === 'percent' && (
              <Box>
                <Typography sx={body}>Percent of GD max</Typography>
                <Typography sx={body}>1-200</Typography>
                <Typography sx={body}>(over 100 to overload a day)</Typography>
              </Box>
            )}

            <Box>
              <Typography sx={body}>Game day headers</Typography>
              <Typography sx={body}>GD+1-100</Typography>
              <Typography sx={body}>GD-1-100</Typography>
            </Box>

            {mode === 'percent' && (
              <Typography sx={{ ...body, fontSize: 14, color: GREY100 }}>
                One figure per gameday. Every metric in that squad takes that share
                of its own game day maximum, so the file carries no metric rows.
              </Typography>
            )}
          </Box>
        </Box>
      );
    }

    function ExpandInstructions({ onExpand }) {
      return (
        <IconButton onClick={onExpand} aria-label="Show instructions" sx={{ p: 0.5, ml: 2.75, mt: 1.5, alignSelf: 'flex-start' }}>
          <MI name="keyboard_double_arrow_right" size={22} color={PRIMARY} />
        </IconButton>
      );
    }

    /* ── Step 1: upload ──────────────────────────────────────────────── */
    function UploadStep({ file, onFile, onRemoveFile }) {
      return (
        <Box sx={{ flex: 1, overflowY: 'auto', display: 'flex', flexDirection: 'column', alignItems: 'center', pt: 6 }}>
          <Box
            onClick={() => onFile({ name: 'my_target_file.csv', size: '100kb' })}
            sx={{
              width: 600, height: 150, border: `1px dashed #C3C9D4`, borderRadius: `${RADIUS}px`,
              display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center',
              gap: 1.25, cursor: 'pointer',
              '&:hover': { borderColor: PRIMARY, bgcolor: '#fcfcfd' },
            }}
          >
            <MI name="upload_file" size={26} color={PRIMARY} />
            <Typography sx={{ fontSize: 15, color: PRIMARY }}>
              <Box component="span" sx={{ textDecoration: 'underline' }}>Click to upload</Box> or drag and drop
            </Typography>
            <Typography sx={{ fontSize: 14, color: PRIMARY }}>.CSV file only (max. 3MB)</Typography>
          </Box>

          {file && (
            <Stack direction="row" alignItems="center" spacing={2} sx={{ width: 600, mt: 3.5, px: 2.5 }}>
              <MI name="upload_file" size={24} color={PRIMARY} />
              <Box sx={{ flex: 1 }}>
                <Typography sx={{ fontSize: 15, color: PRIMARY }}>{file.name}</Typography>
                <Typography sx={{ fontSize: 14, color: GREY100, mt: '2px' }}>{file.size}</Typography>
              </Box>
              <IconButton onClick={onRemoveFile} aria-label={`Remove ${file.name}`}>
                <MI name="delete" size={22} color={PRIMARY} />
              </IconButton>
            </Stack>
          )}
        </Box>
      );
    }

    /* ── Step 2: preview, with double-click to edit any data cell ────── */
    function EditableCell({ value, invalid, onCommit }) {
      const [editing, setEditing] = useState(false);
      const [buffer, setBuffer] = useState(value);

      const start = () => { setBuffer(value); setEditing(true); };
      const commit = () => { setEditing(false); onCommit(buffer); };

      if (editing) {
        return (
          <TextField
            value={buffer}
            autoFocus
            onChange={(e) => setBuffer(e.target.value)}
            onBlur={commit}
            onKeyDown={(e) => {
              if (e.key === 'Enter') commit();
              if (e.key === 'Escape') setEditing(false);
            }}
            variant="outlined"
            size="small"
            sx={{
              width: '100%',
              '& .MuiOutlinedInput-root': {
                height: 50, borderRadius: `${RADIUS}px`,
                '& fieldset': { borderColor: '#5B8DEF' },
                '&.Mui-focused fieldset': { borderColor: '#5B8DEF', borderWidth: 1 },
              },
              '& .MuiOutlinedInput-input': { fontSize: 15, color: PRIMARY },
            }}
          />
        );
      }

      return (
        <Box
          onDoubleClick={start}
          title="Double-click to edit"
          sx={{
            fontSize: 15, color: invalid ? PRIMARY : PRIMARY, cursor: 'text',
            px: invalid ? 1 : 0, py: invalid ? 0.75 : 0, borderRadius: `${RADIUS}px`,
            border: invalid ? `1px solid ${AMBER}` : '1px solid transparent',
            bgcolor: invalid ? AMBER_BG : 'transparent',
            // An empty cell has nothing to give it height, which left a blank row
            // with no target to double click. Every cell stands the same.
            display: 'flex', alignItems: 'center', gap: 0.75, minHeight: 26, mr: 2,
            '&:hover': { borderColor: invalid ? AMBER : '#E0E2E6' },
          }}
        >
          {invalid && <MI name="warning_amber" size={16} color={AMBER} />}
          {value}
        </Box>
      );
    }

    function PreviewStep({ rows, setRows, instructionsOpen, onExpand, columns, mode }) {
      const [tab, setTab] = useState('All');
      const [addAnchor, setAddAnchor] = useState(null);

      // New rows land at the top, where they can be seen and filled in, rather
      // than at the foot of a file that may run to hundreds of lines.
      const addRows = (count) => {
        const blanks = Array.from({ length: count }, () => ({ valid: true, cells: columns.map(() => '') }));
        setRows([...blanks, ...rows]);
        setTab('All');
        setAddAnchor(null);
      };

      const validCount = rows.filter((r) => r.valid).length;
      const shown = tab === 'All' ? rows : tab === 'Valid' ? rows.filter((r) => r.valid) : rows.filter((r) => !r.valid);

      const setCell = (rowIndex, colIndex, value) => {
        const next = rows.map((r) => ({ ...r, cells: [...r.cells] }));
        next[rowIndex].cells[colIndex] = value;
        // Editing the flagged cell is what clears the error.
        if (next[rowIndex].errorAt === colIndex && value !== rows[rowIndex].cells[colIndex]) {
          next[rowIndex].valid = true;
          delete next[rowIndex].errorAt;
        }
        setRows(next);
      };

      const head = { fontSize: 14, fontWeight: 600, lineHeight: '24px', letterSpacing: 0.17, color: PRIMARY };
      const cols = mode === 'percent'
        ? `44px 1.1fr 1fr 1fr repeat(6, 0.85fr)`
        : `44px 1.1fr 1.9fr repeat(6, 0.85fr)`;

      return (
        <Box sx={{ flex: 1, display: 'flex', flexDirection: 'column', minWidth: 0, overflow: 'hidden' }}>
          <Stack direction="row" alignItems="center" spacing={2} sx={{ px: 3, pt: 2, flex: 'none' }}>
            {!instructionsOpen && (
              <IconButton onClick={onExpand} aria-label="Show instructions" sx={{ p: 0.5 }}>
                <MI name="keyboard_double_arrow_right" size={22} color={PRIMARY} />
              </IconButton>
            )}
            <Box sx={{ display: 'flex', border: `1px solid ${DIVIDER}`, borderRadius: `${RADIUS}px`, overflow: 'hidden' }}>
              {[['All', rows.length], ['Valid', validCount], ['Invalid', rows.length - validCount]].map(([label, count], i) => (
                <Box
                  key={label}
                  onClick={() => setTab(label)}
                  sx={{
                    px: 2.25, height: 42, display: 'flex', alignItems: 'center', fontSize: 14, cursor: 'pointer',
                    borderLeft: i === 0 ? 'none' : `1px solid ${DIVIDER}`,
                    bgcolor: tab === label ? '#E9EAEC' : 'transparent',
                    '&:hover': { bgcolor: tab === label ? '#E9EAEC' : '#f7f8f9' },
                  }}
                >
                  {label} ({count})
                </Box>
              ))}
            </Box>
          </Stack>

          <Stack direction="row" alignItems="center" justifyContent="space-between" sx={{ px: 3, py: 2, flex: 'none' }}>
            <Stack direction="row" spacing={2.5} sx={{ color: PRIMARY }}>
              <MI name="view_column" size={24} />
              <MI name="download" size={24} />
              <MI name="filter_list" size={24} />
            </Stack>
            <Stack direction="row" alignItems="center" spacing={1.5}>
              <Box sx={{
                bgcolor: NEUTRAL_200, borderBottom: `1px solid ${GREY100}`, borderRadius: `${RADIUS}px ${RADIUS}px 0 0`,
                height: 38, width: 240, display: 'flex', alignItems: 'center', justifyContent: 'space-between', px: 1.5,
              }}>
                <Typography sx={{ fontSize: 14, color: PRIMARY }}>Search</Typography>
                <MI name="search" size={22} color={PRIMARY} />
              </Box>

              {/* Split: the label adds one, the caret asks how many */}
              <Stack direction="row" sx={{ flex: 'none' }}>
                <Button
                  variant="contained"
                  color="secondary"
                  onClick={() => addRows(1)}
                  sx={{ px: 2, whiteSpace: 'nowrap', borderRadius: `${RADIUS}px 0 0 ${RADIUS}px` }}
                >
                  Add row(s)
                </Button>
                <Button
                  variant="contained"
                  color="secondary"
                  onClick={(e) => setAddAnchor(e.currentTarget)}
                  aria-label="Add several rows"
                  sx={{
                    minWidth: 0, px: 0.5, borderRadius: `0 ${RADIUS}px ${RADIUS}px 0`,
                    borderLeft: `1px solid ${DIVIDER}`,
                  }}
                >
                  <MI name="arrow_drop_down" size={20} color={PRIMARY} />
                </Button>
                <Menu anchorEl={addAnchor} open={Boolean(addAnchor)} onClose={() => setAddAnchor(null)}>
                  {[4, 5, 6, 8, 10].map((n) => (
                    <MenuItem key={n} onClick={() => addRows(n)}>{n} rows</MenuItem>
                  ))}
                </Menu>
              </Stack>
            </Stack>
          </Stack>

          <Box sx={{ flex: 1, overflow: 'auto', px: 3 }}>
            <Box sx={{ minWidth: 1280 }}>
              <Box sx={{
                display: 'grid', gridTemplateColumns: cols, alignItems: 'center',
                height: 44, borderBottom: `1px solid #E0E2E6`,
              }}>
                <Box sx={{ width: 18, height: 18, border: `2px solid ${GREY100}`, borderRadius: '2px' }} />
                {columns.map((c) => <Box key={c} sx={head}>{c}</Box>)}
              </Box>

              {shown.map((row) => {
                const rowIndex = rows.indexOf(row);
                return (
                  <Box
                    key={rowIndex}
                    sx={{
                      display: 'grid', gridTemplateColumns: cols, alignItems: 'center',
                      minHeight: 52, borderBottom: `1px solid #F0F1F3`, py: 0.5, pr: 2,
                    }}
                  >
                    <Box sx={{ width: 18, height: 18, border: `2px solid ${GREY100}`, borderRadius: '2px' }} />
                    {row.cells.map((cell, colIndex) => (
                      <Box key={colIndex} sx={{ pr: 2 }}>
                        <EditableCell
                          value={cell}
                          invalid={row.errorAt === colIndex}
                          onCommit={(v) => setCell(rowIndex, colIndex, v)}
                        />
                      </Box>
                    ))}
                  </Box>
                );
              })}
            </Box>
          </Box>

          <Stack direction="row" alignItems="center" spacing={1} sx={{ px: 3, height: 60, flex: 'none' }}>
            <Stack direction="row" alignItems="center" spacing={0.25} sx={{ mr: 1.75, fontSize: 14, color: PRIMARY }}>
              25 <MI name="expand_more" size={18} color={PRIMARY} />
            </Stack>
            <MI name="chevron_left" size={20} color={DISABLED} />
            <Box sx={{
              width: 32, height: 32, borderRadius: '50%', bgcolor: PRIMARY, color: '#fff',
              display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 14,
            }}>1</Box>
            <MI name="chevron_right" size={20} color={DISABLED} />
          </Stack>
        </Box>
      );
    }

    /* ── The import flow ─────────────────────────────────────────────── */
    // Editing the targets is the preview table again, reached from the targets
    // page rather than from an upload, so the stepper gives way to a title and
    // the two buttons that end the job.
    function EditTargetsHeader({ onCancel, onSave }) {
      return (
        <Box sx={{
          display: 'flex', alignItems: 'center', justifyContent: 'space-between',
          px: 3, py: 1.75, flex: 'none', borderBottom: `1px solid ${DIVIDER}`,
        }}>
          <Typography sx={{ fontSize: 20, fontWeight: 600 }}>Edit targets</Typography>
          <Stack direction="row" spacing={1}>
            <Button variant="contained" color="secondary" onClick={onCancel} sx={{ px: 2.5 }}>Cancel</Button>
            <Button variant="contained" color="primary" onClick={onSave} sx={{ px: 3 }}>Save</Button>
          </Stack>
        </Box>
      );
    }

    function ImportFlow({ onExit, onHome, mode = 'metrics', edit = false, onCreateTemplate }) {
      // Editing opens straight onto the table: there is no file to pick.
      const [step, setStep] = useState(edit ? 2 : 1);
      const [file, setFile] = useState(null);
      // Editing opens with the panel shut: it explains a file that is not being
      // uploaded here. It is still there to open if it is wanted.
      const [instructionsOpen, setInstructionsOpen] = useState(!edit);
      const source = mode === 'percent' ? PERCENT_CSV_ROWS : CSV_ROWS;
      const columns = mode === 'percent' ? PERCENT_CSV_COLUMNS : CSV_COLUMNS;
      const [rows, setRows] = useState(() => source.map((r) => ({ ...r, cells: [...r.cells] })));

      // Instructions stay open through the whole upload step; they only close
      // when the preview appears and the table needs the width.
      const takeFile = (f) => setFile(f);

      const next = () => {
        // The panel stays as the user left it; only they close it.
        if (step === 1) setStep(2);
        else onExit(true); // Import — the targets page confirms it
      };

      const previous = () => {
        if (step === 2) setStep(1);
        else onExit(false); // backing out of the flow, nothing imported
      };

      return (
        <Box sx={{ height: '100%', display: 'flex' }}>
          <NavRail onHome={onHome} />

          <Box sx={{ flex: 1, display: 'flex', flexDirection: 'column', minWidth: 0 }}>
            <TopBar />

            {edit ? (
              <EditTargetsHeader onCancel={() => onExit(false)} onSave={() => onExit(true)} />
            ) : (
              <ImportStepper
                step={step}
                onPrevious={previous}
                onNext={next}
                nextLabel={step === 1 ? 'Next' : 'Import'}
                nextDisabled={step === 1 && !file}
              />
            )}

            <Box sx={{ flex: 1, display: 'flex', minHeight: 0 }}>
              {instructionsOpen && (
                <InstructionsPanel
                  onCollapse={() => setInstructionsOpen(false)}
                  mode={mode}
                  onCreateTemplate={onCreateTemplate}
                />
              )}

              {step === 1 ? (
                <Box sx={{ flex: 1, display: 'flex', minWidth: 0 }}>
                  {!instructionsOpen && <ExpandInstructions onExpand={() => setInstructionsOpen(true)} />}
                  <UploadStep file={file} onFile={takeFile} onRemoveFile={() => setFile(null)} />
                </Box>
              ) : (
                <PreviewStep
                  rows={rows}
                  setRows={setRows}
                  instructionsOpen={instructionsOpen}
                  onExpand={() => setInstructionsOpen(true)}
                  columns={columns}
                  mode={mode}
                />
              )}
            </Box>
          </Box>
        </Box>
      );
    }

    /* ── Version 2 ───────────────────────────────────────────────────── */
    function VersionTwo({ onHome, importMode = 'metrics' }) {
      const percentMode = importMode === 'percent';
      const sections = percentMode
        ? ['Participation and RPE', 'Workload targets']
        : V2_SUB_SECTIONS;
      const [section, setSection] = useState(sections[1]);
      const [config] = useState(importMode === 'percent' ? seedPercentConfig : seedConfig);
      const [importing, setImporting] = useState(false);
      const [editing, setEditing] = useState(false);
      const [imported, setImported] = useState(false);

      const leaveImport = (didImport) => {
        setImporting(false);
        if (didImport) setImported(true);
      };

      if (importing) return <ImportFlow onExit={leaveImport} onHome={onHome} mode={importMode} />;
      if (editing) return <ImportFlow onExit={() => setEditing(false)} onHome={onHome} mode={importMode} edit />;

      return (
        <Box sx={{ height: '100%', display: 'flex' }}>
          <NavRail onHome={onHome} />

          <Box sx={{ flex: 1, display: 'flex', flexDirection: 'column', minWidth: 0 }}>
            <TopBar />

            <Box sx={{ flex: 'none', borderBottom: `1px solid ${DIVIDER}` }}>
              <Tabs
                value="Workload"
                sx={{
                  minHeight: 46, px: 1,
                  '& .MuiTabs-indicator': { backgroundColor: PRIMARY, height: 2 },
                  '& .MuiTab-root': { pointerEvents: 'none' },
                }}
              >
                {ORG_TABS.map((label) => <Tab key={label} label={label} value={label} />)}
              </Tabs>
            </Box>

            <Box sx={{ flex: 1, display: 'flex', minHeight: 0 }}>
              <SubNav value={section} onChange={setSection} sections={sections} />

              <Box sx={{ flex: 1, display: 'flex', flexDirection: 'column', minWidth: 0 }}>
                {section === sections[0] ? (
                  <ParticipationView />
                ) : (
                  <ReadOnlyView
                    config={config}
                    title={percentMode ? 'Workload targets' : 'Workload metrics and targets'}
                    actionLabel="Import targets"
                    onAction={() => setImporting(true)}
                    secondaryLabel={percentMode ? undefined : 'Edit targets'}
                    onSecondary={() => setEditing(true)}
                    percentOnly={percentMode}
                    showPosition={percentMode}
                    showImports={percentMode}

                )}
              </Box>
            </Box>
          </Box>

          {/* Stays until dismissed, so it is still there when you look back. */}
          <Snackbar
            open={imported}
            anchorOrigin={{ vertical: 'bottom', horizontal: 'right' }}
            sx={{ right: '28px !important', bottom: '32px !important' }}
          >
            <Alert
              severity="success"
              onClose={() => setImported(false)}
              sx={{ width: 324, alignItems: 'flex-start' }}

            </Alert>
          </Snackbar>
        </Box>
      );
    }

    /* ══ Session planning ════════════════════════════════════════════ */

    // Up to six, matching the cap on the targets pages. Six is why the split
    // between the drills and the values needs to be draggable.
    // The same library as the targets pages, with the short column label and the
    // behaviour each metric has over time. agg says how it aggregates: sum scales
    // with the drill duration and adds up across the session; avg and max do
    // neither, because a per minute rate does not double when a drill runs twice
    // as long, and a peak velocity is a peak. Only the metrics the squad has
    // configured carry a target, which is the point: the rest show none.
    const METRIC_LIBRARY_SESSION = [
      { key: 'td',      label: 'TD (m)',        name: 'Total Distance (m)',          unit: 'm',     agg: 'sum', color: '#00968F' },
      { key: 'dpm',     label: 'DPM (m/min)',   name: 'Distance Per Minute (m/min)', unit: 'm/min', agg: 'avg', color: '#5D4037' },
      { key: 'hmld',    label: 'HMLD (m)',      name: 'HMLD (m)',                    unit: 'm',     agg: 'sum', color: '#00838F' },
      { key: 'hsr',     label: 'HSR (m)',       name: 'HSR Distance (m)',            unit: 'm',     agg: 'sum', color: '#2E7D32' },
      { key: 'sd',      label: 'SD (m)',        name: 'Sprint Distance (m)',         unit: 'm',     agg: 'sum', color: '#1565C0' },
      { key: 'acceld',  label: 'Accel D (m)',   name: 'Accels Distance (m)',         unit: 'm',     agg: 'sum', color: '#EF6C00' },
      { key: 'accels',  label: 'Acc >3m/s',     name: 'Accels >3m/s',                unit: '',      agg: 'sum', color: '#E8590C' },
      { key: 'deceld',  label: 'Decel D (m)',   name: 'Decels Distance (m)',         unit: 'm',     agg: 'sum', color: '#6A1B9A' },
      { key: 'decels',  label: 'Dec >3m/s',     name: 'Decels >3m/s',                unit: '',      agg: 'sum', color: '#7C3AED' },
      { key: 'rpedur',  label: 'RPE x Dur',     name: 'RPE x Duration',              unit: 'AU',    agg: 'sum', color: '#AD1457' },
      { key: 'maxvel',  label: '% max vel',     name: '% max velocity',              unit: '',      agg: 'max', color: '#546E7A' },
    ];

    // The vendor metrics join the session library too, so a column can be set to
    // one. No import stands behind them here, so they read as dashes until a
    // figure is typed, which is the honest state for a metric nobody has pulled.
    const VENDOR_COLOURS = ['#00968F', '#2E7D32', '#1565C0', '#E8590C', '#7C3AED', '#AD1457', '#00838F', '#5D4037'];
    METRIC_GROUPS.filter((g) => g.header !== 'Kitman').forEach((group) => {
      group.items.forEach((name, i) => {
        METRIC_LIBRARY_SESSION.push({
          key: name.toLowerCase().replace(/[^a-z0-9]+/g, '-'),
          label: name,
          name,
          unit: '',
          // Rates and balances do not add up over a session; the rest do.
          agg: /Per Min|Per Minute|Power|Work Rate|Balance/.test(name) ? 'avg' : 'sum',
          color: VENDOR_COLOURS[i % VENDOR_COLOURS.length],
        });
      });
    });

    const metricByKey = (key) => METRIC_LIBRARY_SESSION.find((m) => m.key === key);
    const DEFAULT_COLUMNS = ['td', 'hmld', 'hsr', 'sd', 'accels', 'decels'];
    const MAX_SESSION_COLUMNS = 6;

    // base values hold at baseDuration; a drill scales linearly from there.
    const SESSION_DRILLS = [
      {
        id: 'd1', name: 'Rondo 5v1 3reps x 3mins', tag: 'Warm up',
        desc: 'Rondo 6v2 interspersed with mobility and dynamic flexibility.',
        duration: 15, baseDuration: 15,
        base: { td: 280, dpm: 19, hmld: 62, hsr: 40, sd: 85, acceld: 9, accels: 12, deceld: 4, decels: 3, rpedur: 45, maxvel: 78 },
        athletes: [22, 24], staff: [3, 3],
      },
      {
        id: 'd2', name: '1v1 SDP', tag: 'Game play',
        desc: 'Activity begins with shot from side players into mini-goal. After pass play continues to the wide areas.',
        principles: ['Breaking Lines (Progressing and Penetrating, Defending, Tactical)'],
        duration: 30, baseDuration: 30,
        base: { td: 1100, dpm: 37, hmld: 240, hsr: 210, sd: 45, acceld: 22, accels: 6, deceld: 30, decels: 11, rpedur: 180, maxvel: 94 },
        athletes: [20, 24], staff: [3, 3],
      },
      {
        id: 'd3', name: 'Goalkeeper catching and holding', tag: 'Goalkeepers',
        desc: 'The GK should keep their eyes on the ball using their hand eye coordination to catch and hold.',
        duration: 15, baseDuration: 15,
        base: { td: 520, dpm: 35, hmld: 115, hsr: 95, sd: 170, acceld: 8, accels: 3, deceld: 20, decels: 8, rpedur: 75, maxvel: 67 },
        athletes: [3, 24], staff: [1, 3],
      },
      {
        id: 'd4', name: '7v6 build out game', tag: 'Medium games',
        desc: 'GK throws out. Team in possession attempts to score on any of the 2 mini goals.',
        duration: 15, baseDuration: 15,
        base: { td: 750, dpm: 50, hmld: 165, hsr: 140, sd: 20, acceld: 18, accels: 9, deceld: 6, decels: 2, rpedur: 105, maxvel: 86 },
        athletes: [21, 24], staff: [3, 3],
      },
      {
        // Never imported, so there is nothing to average: no values, and no
        // duration either until somebody sets one.
        id: 'd5', name: 'Positional 4v4 + 2 floaters', tag: 'Small sided games',
        desc: 'Four against four in thirds with two floating players, working the ball between lines.',
        duration: null, baseDuration: 15,
        base: {},
        athletes: [18, 24], staff: [2, 3],
      },
    ];

    // The session targets are not their own numbers: this is a GD−3 session for
    // the first team, so they are read straight off that squad's GD−3 column on
    // the targets pages. Metrics that squad has not configured get no target,
    // which is why the metrics outside its six show a dash.
    const CONFIG_METRIC_TO_SESSION = METRIC_LIBRARY_SESSION.reduce(
      (acc, m) => ({ ...acc, [m.name]: m.key }), {},
    );

    const SESSION_SQUAD = '1st team';
    const SESSION_GD = 'GD−3';

    // What a cohort does to a session. A player in rehab covers a fraction of the
    // ground and carries a target to match, but the two do not move in step: that
    // is the whole reason to look cohort by cohort, since who is over target
    // changes with who you are looking at. Somebody playing up is the clearest
    // case, doing a senior session against an academy target.
    const SQUAD_ATHLETES = [
      'Jordan Pierce', 'Sam Whitfield', 'Alex Romero', 'Chris Doyle',
      'Marco Bellini', 'Tobias Lang', 'Danny Okafor', 'Reece Sutherland',
      'Kofi Mensah', 'Luca Ferraro', 'Owen Bradley', 'Nathan Ellis',
      'Diego Salas', 'Finn Gallagher', 'Yusuf Karim', 'Mateo Duarte',
      'Harvey Nolan', 'Ilias Bakker', 'Rory Kavanagh', 'Andre Nkemba',
    ];

    const COHORT_SECTIONS = [
      { items: ['Whole squad'] },
      { header: 'Positions', items: ['Goalkeeper', 'Defender', 'Midfielder', 'Forward'] },
      {
        header: 'Groups',
        items: ['Starters', 'Non starters', 'Rehab', 'Return to play', 'Playing up', 'On loan'],
      },
      { header: 'Athletes', items: SQUAD_ATHLETES },
    ];

    const COHORT_EFFECT = {
      'Whole squad':         { value: 1,    target: 1 },
      'Goalkeeper':          { value: 0.42, target: 0.50 },
      'Defender':            { value: 0.96, target: 1.00 },
      'Midfielder':          { value: 1.14, target: 1.06 },
      'Forward':             { value: 1.06, target: 1.02 },
      'Starters':            { value: 0.98, target: 1.00 },
      'Non starters':        { value: 1.22, target: 1.15 },
      'Rehab':               { value: 0.35, target: 0.40 },
      'Return to play':      { value: 0.62, target: 0.70 },
      'Playing up':          { value: 1.08, target: 0.95 },
      'On loan':             { value: 0.90, target: 0.95 },
    };

    // Who has targets of their own. The list marks everybody else "no target",
    // and the page follows through: their values are shown against nothing, since
    // holding them to a target somebody else was set would be a fiction.
    const COHORT_WITH_TARGET = new Set([
      'Whole squad', 'Goalkeeper', 'Midfielder', 'Rehab', 'Return to play',
      'Jordan Pierce', 'Alex Romero', 'Kofi Mensah',
    ]);

    // One player is not the squad average, so each carries a spread of their own.
    // Standing figures rather than random ones: the same name reads the same way
    // every time the page is opened.
    SQUAD_ATHLETES.forEach((name, i) => {
      COHORT_EFFECT[name] = {
        value: Math.round((0.80 + (i % 9) * 0.06) * 100) / 100,
        target: Math.round((0.90 + (i % 5) * 0.05) * 100) / 100,
      };
    });

    // Where each player sits, so their session can be read as their position or
    // their group instead of as themselves.
    const ATHLETE_POSITIONS = ['Goalkeeper', 'Defender', 'Midfielder', 'Forward'];
    const ATHLETE_GROUPS = ['Starters', 'Non starters', 'Rehab', 'Return to play', 'Playing up', 'On loan'];
    const ATHLETE_OF = {};
    SQUAD_ATHLETES.forEach((name, i) => {
      ATHLETE_OF[name] = {
        position: ATHLETE_POSITIONS[i % 4 === 0 && i > 8 ? 0 : (i % 3) + 1],
        group: ATHLETE_GROUPS[i % ATHLETE_GROUPS.length],
      };
    });


    const SESSION_TARGETS = (() => {
      const dayIndex = GD_DEFAULT.indexOf(SESSION_GD);
      const out = {};
      Object.entries(SQUAD_TARGETS[SESSION_SQUAD]).forEach(([configName, values]) => {
        const key = CONFIG_METRIC_TO_SESSION[configName];
        if (key && values[dayIndex] != null) out[key] = values[dayIndex];
      });
      return out;
    })();

    const drillValue = (drill, metric) => {
      const base = drill.base[metric.key];
      // No import behind the drill, or no duration to scale by, means no value.
      if (base == null || drill.duration == null) return null;
      // Only accumulating metrics scale with how long the drill runs.
      if (metric.agg !== 'sum') return base;
      return Math.round((base * drill.duration) / drill.baseDuration);
    };

    // resolve says where a drill's value comes from. It is drillValue everywhere
    // but the version that lets a figure be typed in where an import left none.
    const totalFor = (drills, metric, resolve = drillValue) => {
      const vals = drills.map((d) => resolve(d, metric)).filter((v) => v != null);
      if (!vals.length) return null;
      if (metric.agg === 'max') return Math.max(...vals);
      if (metric.agg === 'avg') return Math.round(vals.reduce((a, b) => a + b, 0) / vals.length);
      return vals.reduce((a, b) => a + b, 0);
    };

    const formatDuration = (mins) => {
      const h = Math.floor(mins / 60);
      const m = mins % 60;
      if (h && m) return `${h} hr ${m} mins`;
      if (h) return `${h} hr`;
      return `${m} mins`;
    };

    // Below this the card content wraps and the rows grow unevenly, so the drag
    // stops here rather than letting the layout fall apart.
    const SPLIT_MIN_DRILL = 360;
    // The values flex with the divider down to this width, which is the point
    // where six columns still read cleanly. Past it they stop shrinking and
    // slide off the right edge instead.
    const FOOTER_ROW_H = 24;               // labels and values share this
    const DURATION_LINE_H = 20;            // the duration line, held open when empty
    const ADD_LINE_H = 24;                 // the add row, its own margin included
    const WORKLOAD_CARD_TAIL = 28;         // duration line to card foot, workload view
    const SCROLL_COL_W = 150;              // fixed column, the version that scrolls
    const TABLE_HEAD_H = 34;               // heading row, the version drawn as a table
    const MIN_COL_W = 96;                  // floor for a dragged table column
    const MENU_ITEM_H = 33;                // a metric in the column menu
    const MENU_VISIBLE_ITEMS = 6;          // shown before the list starts scrolling
    const METRIC_LIST_H = 280;             // the metric list, before it scrolls
    const COHORT_MENU_H = 320;             // the cohort list, headings and all
    const VALUES_GUTTER = 24;              // keeps the last bar off the right edge
    const VALUES_MIN = 492 + VALUES_GUTTER;
    // The + Metric button reaches the keyline: its cell sits over the panel gutter
    // rather than before it, so what it actually costs the columns is the button
    // less that gutter. Not a whole column, which left a hole on the right.
    const ADD_METRIC_W = 55;               // the button, label and its own padding
    const ADD_METRIC_COST = ADD_METRIC_W - VALUES_GUTTER;
    const SPLIT_HANDLE = 13;
    const OFF_NUM_W = 42;                  // drill number and edit, workload hidden
    const OFF_PART_W = 104;                // attendance, workload hidden

    /* ── Drill diagram placeholder ───────────────────────────────────── */
    function PitchThumb() {
      return (
        <Box sx={{ width: 120, height: 68, flex: 'none', borderRadius: '2px', overflow: 'hidden' }}>
          <svg viewBox="0 0 120 68" width="120" height="68" role="img" aria-label="Drill diagram">
            <rect width="120" height="68" fill="#4C9A45" />
            <g stroke="#ffffff" strokeWidth="1" fill="none" opacity="0.85">
              <rect x="4" y="4" width="112" height="60" />
              <line x1="60" y1="4" x2="60" y2="64" />
              <circle cx="60" cy="34" r="11" />
              <rect x="4" y="18" width="14" height="32" />
              <rect x="102" y="18" width="14" height="32" />
            </g>
            <g fill="#E53935">
              <circle cx="30" cy="22" r="3" /><circle cx="44" cy="44" r="3" /><circle cx="28" cy="48" r="3" />
            </g>
            <g fill="#1E88E5">
              <circle cx="82" cy="26" r="3" /><circle cx="92" cy="46" r="3" />
            </g>
          </svg>
        </Box>
      );
    }

    /* ── One metric cell: value over a bar showing its share of target ── */
    // The metric names already carry their unit, so the tooltip just repeats the
    // name, saying which of the two states the cell is in when it is in one.
    const metricTitle = (metric, over, missing) =>
      `${metric.name}${over ? ' — over target' : ''}${missing ? ' — no data' : ''}`;

    function MetricBar({ metric, mode, value, target, before }) {
      const track = { height: 5, borderRadius: '2px', bgcolor: '#E4E7EB', overflow: 'hidden', display: 'flex' };

      if (mode === 'none') return <Box sx={{ height: 5 }} />;

      // The running total through this drill: the budget filling up as you read down
      if (mode === 'cumulative' && metric.agg === 'sum' && target && value != null) {
        const beforePct = Math.min(100, (before / target) * 100);
        const cum = before + value;
        const cumPct = Math.min(100, (cum / target) * 100);
        return (
          <Box sx={track}>
            <Box sx={{ width: `${beforePct}%`, bgcolor: metric.color, opacity: 0.25 }} />
            <Box sx={{ width: `${Math.max(0, cumPct - beforePct)}%`, bgcolor: cum > target ? ERROR : metric.color }} />
          </Box>
        );
      }

      if (!target || value == null) return <Box sx={{ height: 5 }} />;
      const over = value > target;
      return (
        <Box sx={track}>
          <Box sx={{ width: `${Math.min(100, (value / target) * 100)}%`, bgcolor: over ? ERROR : metric.color }} />
        </Box>
      );
    }

    // The gap between drill rows lives on the card, not the row, so the value
    // panels stack flush and a tinted column runs unbroken. Each cell owns its
    // own top padding for the same reason.
    const COLUMN_TINT = 'rgba(195, 29, 43, 0.08)';

    function MetricCell({
      metric, value, target, width, mode = 'target', before = 0, highlight = false, padTop = 0,
      table = false, editable = false, editing = false, typed = false,
      draft = '', onStartEdit, onDraft, onCommit, onCancel,
    }) {
      const over = target != null && value != null && value > target;

      // As a table the cell is a cell: ruled, its value sat in the middle of the
      // row, and no bar. The number carries it on its own.
      if (table) {
        const cellSx = {
          width, flex: 'none', px: 1.5, display: 'flex', alignItems: 'center',
          borderRight: `1px solid ${DIVIDER}`,
          ...(highlight && { bgcolor: COLUMN_TINT }),
        };

        // Nothing was imported for this drill, so a figure can be typed instead.
        if (editing) {
          return (
            <Box sx={cellSx}>
              <TextField
                value={draft}
                autoFocus
                onFocus={(e) => e.target.select()}
                onChange={(e) => onDraft(e.target.value.replace(/[^0-9.]/g, ''))}
                onBlur={onCommit}
                onKeyDown={(e) => {
                  if (e.key === 'Enter') onCommit();
                  if (e.key === 'Escape') onCancel();
                }}
                variant="outlined"
                size="small"
                inputProps={{ inputMode: 'numeric', style: { padding: '2px 6px', fontSize: 14, width: 56 } }}
                sx={{ '& .MuiOutlinedInput-root': { borderRadius: `${RADIUS}px`, bgcolor: '#fff' } }}
              />
            </Box>
          );
        }

        return (
          <Box
            onClick={editable ? onStartEdit : undefined}
            sx={{
              ...cellSx,
              ...(editable && { cursor: 'pointer', '&:hover .cell-edit': { opacity: 1 } }),
            }}
          >
            <Tooltip
              title={`${metricTitle(metric, over, value == null)}${typed ? ' — entered by hand' : ''}`}
              placement="top"
              followCursor
            >
              <Stack direction="row" alignItems="center" spacing={0.5} sx={{ cursor: 'inherit', width: 'fit-content' }}>
                <Typography sx={{ fontSize: 15, color: over ? ERROR : PRIMARY, fontWeight: over ? 700 : 400 }}>
                  {value == null ? '—' : value}
                </Typography>
                {over && <MI name="error" size={15} color={ERROR} />}
                {editable && (
                  <Box className="cell-edit" sx={{ opacity: 0, transition: 'opacity .12s', display: 'flex', flex: 'none' }}>
                    <MI name="edit" size={13} color={GREY100} />
                  </Box>
                )}
              </Stack>
            </Tooltip>
          </Box>
        );
      }

      // The same cell with a bar under it. A figure can be typed here too, where
      // the import left none: the field stands in place of the number, and the
      // bar below it holds its ground so the row does not jump.
      return (
        <Box sx={{
          width, flex: 'none', pr: 2, pt: padTop,
          ...(highlight && { bgcolor: COLUMN_TINT }),
        }}>
          {editing ? (
            <Box sx={{ mb: 0.75, height: 22, display: 'flex', alignItems: 'center' }}>
              <TextField
                value={draft}
                autoFocus
                onFocus={(e) => e.target.select()}
                onChange={(e) => onDraft(e.target.value.replace(/[^0-9.]/g, ''))}
                onBlur={onCommit}
                onKeyDown={(e) => {
                  if (e.key === 'Enter') onCommit();
                  if (e.key === 'Escape') onCancel();
                }}
                variant="outlined"
                size="small"
                inputProps={{ inputMode: 'numeric', style: { padding: '1px 6px', fontSize: 14, width: 52 } }}
                sx={{ '& .MuiOutlinedInput-root': { borderRadius: `${RADIUS}px`, bgcolor: '#fff' } }}
              />
            </Box>
          ) : (
            <Tooltip
              title={`${metricTitle(metric, over, value == null)}${typed ? ' — entered by hand' : ''}`}
              placement="top"
              followCursor
            >
              <Stack
                direction="row" alignItems="center" spacing={0.5}
                onClick={editable ? onStartEdit : undefined}
                sx={{
                  mb: 0.75, width: 'fit-content',
                  cursor: editable ? 'pointer' : 'default',
                  ...(editable && { '&:hover .cell-edit': { opacity: 1 } }),
                }}
              >
                <Typography sx={{ fontSize: 15, color: over ? ERROR : PRIMARY, fontWeight: over ? 700 : 400 }}>
                  {value == null ? '—' : value}
                </Typography>
                {/* Colour on its own is not enough of a signal */}
                {over && <MI name="error" size={15} color={ERROR} />}
                {editable && (
                  <Box className="cell-edit" sx={{ opacity: 0, transition: 'opacity .12s', display: 'flex', flex: 'none' }}>
                    <MI name="edit" size={13} color={GREY100} />
                  </Box>
                )}
              </Stack>
            </Tooltip>
          )}
          <MetricBar metric={metric} mode={mode} value={value} target={target} before={before} />
        </Box>
      );
    }

    // Just the session total against its target. No drill segments: version 4
    // already carries that in each row, so repeating it here only adds noise.
    function TotalFooterBar({ metric, total, target, width, table = false }) {
      const cell = { width, flex: 'none', ...(table ? { px: 1.5 } : { pr: 2 }) };
      if (!target || total == null) return <Box sx={cell}><Box sx={{ height: 5 }} /></Box>;
      const over = total > target;
      return (
        <Box sx={cell}>
          {/* Same weight as the row bars, but a white track: the grey one
              disappeared into the grey of the bar itself. As a table these are
              the only bars on the page, so a colour per metric is telling nobody
              anything: they all read navy, and red when they are over. */}
          <Box sx={{ height: 5, borderRadius: '2px', bgcolor: '#ffffff', overflow: 'hidden', display: 'flex' }}>
            <Box sx={{
              width: `${Math.min(100, (total / target) * 100)}%`,
              bgcolor: over ? ERROR : table ? PRIMARY : metric.color,
            }} />
          </Box>
        </Box>
      );
    }

    /* ── Session planning, version 1 ─────────────────────────────────── */
    function SessionPlanning({
      onHome, rowBars = 'target', footerBar = 'none', highlightOver = false,
      scrollValues = false, table = false, manualEntry = false, byCohort = false,
    }) {
      const [drills, setDrills] = useState(() => SESSION_DRILLS.map((d) => ({ ...d })));
      const [showWorkload, setShowWorkload] = useState(true);
      const [complete, setComplete] = useState(false);
      const [editingId, setEditingId] = useState(null);
      const [durationDraft, setDurationDraft] = useState('');
      const [splitWidth, setSplitWidth] = useState(640);
      const [dragging, setDragging] = useState(false);
      const [areaWidth, setAreaWidth] = useState(0);
      const [columns, setColumns] = useState(DEFAULT_COLUMNS);
      const [colAnchor, setColAnchor] = useState(null);   // { el, index }
      const [colWidths, setColWidths] = useState({});     // key → px, table version
      // Figures typed in where an import left none: drill id → metric key → value
      const [manualValues, setManualValues] = useState({});
      const [editingCell, setEditingCell] = useState(null); // { drillId, key }
      const [cellDraft, setCellDraft] = useState('');
      const [cohort, setCohort] = useState('Whole squad');
      const [cohortAnchor, setCohortAnchor] = useState(null);
      const [cohortQuery, setCohortQuery] = useState('');
      const [basis, setBasis] = useState('Self');
      const [basisAnchor, setBasisAnchor] = useState(null);
      const [draggingId, setDraggingId] = useState(null);
      const rowRefs = React.useRef({});
      const [metricQuery, setMetricQuery] = useState('');
      const [targetOverrides, setTargetOverrides] = useState({});
      const [editingTarget, setEditingTarget] = useState(null);
      const areaRef = React.useRef(null);
      // One scroll position for the whole values area: the headings, every drill
      // row and the targets bar all read it, so they can never drift apart.
      const [scrollX, setScrollX] = useState(0);

      const metrics = columns.map(metricByKey);
      // An athlete can be read as themselves, as their position or as their
      // group; anyone else is only ever themselves.
      const athlete = ATHLETE_OF[cohort];
      // The two pickers do what they say: the targets come from whoever is named
      // under Targets for, the drill values from whoever is named beside them.
      const readAs = !athlete || basis === 'Self' ? cohort : basis;
      const valueEffect = COHORT_EFFECT[readAs] || COHORT_EFFECT['Whole squad'];
      const targetEffect = COHORT_EFFECT[cohort] || COHORT_EFFECT['Whole squad'];

      // The metric menu keeps the library's own headings, and a heading goes when
      // a search takes the last of its metrics.
      const sessionMetricSections = METRIC_GROUPS
        .map((g) => ({
          header: g.header,
          items: g.items
            .map((name) => METRIC_LIBRARY_SESSION.find((m) => m.name === name))
            .filter((m) => m && metricMatches(m.name, metricQuery)),
        }))
        .filter((g) => g.items.length);

      // Values can be read as anybody; only the athlete gets the choice.
      const basisSections = [
        { items: ['Self', 'Whole squad'] },
        ...COHORT_SECTIONS.filter((s) => s.header === 'Positions' || s.header === 'Groups'),
      ];

      // Headings drop away with the last of their items when a search narrows it.
      const cohortSections = COHORT_SECTIONS
        .map((s) => ({ ...s, items: s.items.filter((i) => metricMatches(i, cohortQuery)) }))
        .filter((s) => s.items.length);

      const targetFor = (metric) => {
        // A typed target is the figure the coach meant, so it stands as typed.
        const custom = targetOverrides[metric.key];
        if (custom != null && custom !== '') return Number(custom);
        const base = SESSION_TARGETS[metric.key];
        if (base == null) return null;
        if (!byCohort) return base;
        // No target of their own means no target: the bar shows the values and
        // leaves the target blank rather than holding them to somebody else's.
        if (!COHORT_WITH_TARGET.has(cohort)) return null;
        return Math.round(base * targetEffect.target);
      };

      // Inside the padding, since that is where the columns actually start.
      const contentBox = (el) => {
        const cs = getComputedStyle(el);
        const padL = parseFloat(cs.paddingLeft) || 0;
        const padR = parseFloat(cs.paddingRight) || 0;
        const box = el.getBoundingClientRect();
        return { left: box.left + padL, width: box.width - padL - padR };
      };

      React.useEffect(() => {
        const el = areaRef.current;
        if (!el) return;
        const measure = () => setAreaWidth(contentBox(el).width);
        measure();
        const ro = new ResizeObserver(measure);
        ro.observe(el);
        return () => ro.disconnect();
      }, []);

      // One number drives the drill column, the value columns, the totals and the
      // targets, so the four can never fall out of line.
      React.useEffect(() => {
        if (!dragging) return;
        const onMove = (e) => {
          const el = areaRef.current;
          if (!el) return;
          const box = contentBox(el);
          // Dragging right pushes the values off the edge rather than squeezing
          // them, so the only ceiling is the width of the area itself.
          const max = Math.max(SPLIT_MIN_DRILL, box.width);
          setSplitWidth(Math.max(SPLIT_MIN_DRILL, Math.min(e.clientX - box.left, max)));
        };
        const onUp = () => setDragging(false);
        window.addEventListener('mousemove', onMove);
        window.addEventListener('mouseup', onUp);
        document.body.style.cursor = 'col-resize';
        document.body.style.userSelect = 'none';
        return () => {
          window.removeEventListener('mousemove', onMove);
          window.removeEventListener('mouseup', onUp);
          document.body.style.cursor = '';
          document.body.style.userSelect = '';
        };
      }, [dragging]);

      // Grab a drill by its grip and the order follows the pointer. The row the
      // pointer is over is read from the DOM each time rather than from a list
      // captured on mousedown, which would be the order before the first swap.
      // Everything else follows the array: the values sit in the drill's own row,
      // and the cumulative bars recount from the new order.
      const onDrillGrab = (id) => (e) => {
        e.preventDefault();
        setDraggingId(id);
        const move = (ev) => {
          const overId = Object.keys(rowRefs.current).find((key) => {
            const el = rowRefs.current[key];
            if (!el) return false;
            const r = el.getBoundingClientRect();
            return ev.clientY >= r.top && ev.clientY <= r.bottom;
          });
          if (!overId || overId === id) return;
          setDrills((prev) => {
            const from = prev.findIndex((d) => d.id === id);
            const to = prev.findIndex((d) => d.id === overId);
            if (from < 0 || to < 0 || from === to) return prev;
            const next = [...prev];
            next.splice(to, 0, next.splice(from, 1)[0]);
            return next;
          });
        };
        const up = () => {
          window.removeEventListener('mousemove', move);
          window.removeEventListener('mouseup', up);
          document.body.style.cursor = '';
          document.body.style.userSelect = '';
          setDraggingId(null);
        };
        window.addEventListener('mousemove', move);
        window.addEventListener('mouseup', up);
        document.body.style.cursor = 'grabbing';
        document.body.style.userSelect = 'none';
      };

      // The field holds its own value until the tick, so a cancel leaves the
      // drill as it was. Cleared back to empty means no duration again, not zero.
      const openDuration = (drill) => {
        setDurationDraft(drill.duration == null ? '' : String(drill.duration));
        setEditingId(drill.id);
      };

      const commitDuration = (id) => {
        const mins = durationDraft === '' ? null : Math.max(0, parseInt(durationDraft, 10));
        setDrills((prev) => prev.map((d) => (d.id === id ? { ...d, duration: mins } : d)));
        setEditingId(null);
      };

      // The imported figure, or the one typed in its place. Everything downstream
      // reads this, so a typed value counts towards the totals like any other.
      const typedValue = (drill, metric) => {
        const raw = manualValues[drill.id]?.[metric.key];
        return raw == null || raw === '' ? null : Number(raw);
      };
      const valueFor = (drill, metric) => {
        const imported = drillValue(drill, metric);
        if (imported != null) return byCohort ? Math.round(imported * valueEffect.value) : imported;
        // Typed by hand, so it is already the figure for whoever is being shown.
        return manualEntry ? typedValue(drill, metric) : null;
      };
      const canType = (drill, metric) => manualEntry && drillValue(drill, metric) == null;

      const commitCell = () => {
        if (!editingCell) return;
        const { drillId, key } = editingCell;
        setManualValues((prev) => ({
          ...prev,
          [drillId]: { ...prev[drillId], [key]: cellDraft === '' ? undefined : cellDraft },
        }));
        setEditingCell(null);
      };

      const totals = metrics.reduce((acc, m) => {
        acc[m.key] = totalFor(drills, m, valueFor);
        return acc;
      }, {});

      // Metrics whose session total has passed its target. Every version colours
      // the heading with this; only version 4 also tints the column.
      const overMetrics = new Set(
        metrics.filter((m) => {
          const t = targetFor(m);
          return t != null && totals[m.key] != null && totals[m.key] > t;
        }).map((m) => m.key)
      );
      const overColumns = new Set(highlightOver ? [...overMetrics] : []);

      // Running total ahead of each drill, for the cumulative bars
      const runningBefore = (() => {
        const out = [];
        const running = {};
        drills.forEach((d, i) => {
          out[i] = { ...running };
          metrics.forEach((m) => { running[m.key] = (running[m.key] ?? 0) + (valueFor(d, m) ?? 0); });
        });
        return out;
      })();
      const totalMinutes = drills.reduce((sum, d) => sum + (d.duration ?? 0), 0);

      // Both ends of the toggle are pixel widths so the card can animate between
      // them; hiding the workload widens the card, which pushes the values off
      // the right edge while they fade.
      const cardWidth = showWorkload
        ? splitWidth
        : (areaWidth ? Math.max(SPLIT_MIN_DRILL, areaWidth - OFF_NUM_W - OFF_PART_W) : '100%');
      // The mirror of fadeSx: these two only exist when the workload view is off
      const offFadeSx = {
        opacity: showWorkload ? 0 : 1,
        pointerEvents: showWorkload ? 'none' : 'auto',
        transition: 'opacity .22s ease',
      };
      const growSx = { transition: dragging ? 'none' : 'width .3s cubic-bezier(.4,0,.2,1)' };
      const fadeSx = {
        opacity: showWorkload ? 1 : 0,
        pointerEvents: showWorkload ? 'auto' : 'none',
        transition: 'opacity .22s ease',
      };
      // Fades and gives its height back, so the targets bar shrinks to the
      // duration line and the column headings leave no gap behind.
      const collapseSx = {
        ...fadeSx,
        maxHeight: showWorkload ? 160 : 0,
        overflow: 'hidden',
        transition: 'opacity .22s ease, max-height .3s cubic-bezier(.4,0,.2,1)',
      };

      // Flex owns this rather than a measured width: the panel grows into
      // whatever the divider leaves it, stops at a floor that keeps six columns
      // legible, and past that overflows and is clipped, so it slides off right.
      // Collapsed to nothing when the workload view is off, or it would keep its
      // minimum width and shove the attendance column off the right edge.
      const valuesSx = showWorkload
        ? {
          flex: '1 1 auto', minWidth: scrollValues ? 0 : VALUES_MIN,
          pr: `${VALUES_GUTTER}px`, ...(scrollValues && { overflow: 'hidden' }),
        }
        : { flex: '0 0 0px', width: 0, minWidth: 0, overflow: 'hidden', pr: 0 };

      // Stretching divides the panel between the columns. Scrolling holds every
      // column at a legible width and moves the whole area instead.
      // The + button needs its own width, not a whole column: reserve that much
      // and give the rest to the metrics, so dropping a column widens the ones
      // that remain instead of leaving a hole on the right.
      const colWidth = scrollValues
        ? SCROLL_COL_W
        : metrics.length < MAX_SESSION_COLUMNS
          ? `calc((100% - ${ADD_METRIC_COST}px) / ${metrics.length})`
          : `${100 / MAX_SESSION_COLUMNS}%`;

      // Where the columns hold a width rather than dividing the panel, each can be
      // dragged to a width of its own. Where they stretch, they are all one width
      // and there is nothing to drag.
      const colWidthOf = (metric) => (scrollValues ? (colWidths[metric.key] ?? SCROLL_COL_W) : colWidth);

      // How wide the columns actually are, which the scroll runs against.
      const trackW = (scrollValues ? metrics.reduce((sum, m) => sum + colWidthOf(m), 0) : 0)
        + (metrics.length < MAX_SESSION_COLUMNS ? ADD_METRIC_W : 0);

      // Drag the right edge of a heading to set that column's width. The floor is
      // what still holds a heading and a number worth reading.
      const onColResize = (metric) => (e) => {
        e.preventDefault();
        e.stopPropagation();
        const startX = e.clientX;
        const startW = colWidthOf(metric);
        const move = (ev) => {
          const width = Math.max(MIN_COL_W, Math.round(startW + ev.clientX - startX));
          setColWidths((prev) => ({ ...prev, [metric.key]: width }));
        };
        const up = () => {
          window.removeEventListener('mousemove', move);
          window.removeEventListener('mouseup', up);
          document.body.style.cursor = '';
          document.body.style.userSelect = '';
        };
        window.addEventListener('mousemove', move);
        window.addEventListener('mouseup', up);
        document.body.style.cursor = 'col-resize';
        document.body.style.userSelect = 'none';
      };

      // Every values panel rides this, so one scroll position moves them together.
      // A plain function rather than a component: declared in the render, a
      // component is a new type every time and remounts everything under it.
      const valuesTrack = (children, column = false) => (
        scrollValues
          ? (
            <Box sx={{
              width: trackW, flex: 'none',
              transform: `translateX(${-scrollX}px)`,
              ...(column && { display: 'flex', flexDirection: 'column', flex: 1 }),
            }}>
              {children}
            </Box>
          )
          : children
      );

      // What the panel actually shows, and so how far there is to scroll. There
      // is no bar to read it off: the columns are swiped sideways, or moved with
      // shift and a wheel.
      const valuesViewW = Math.max(0, areaWidth - splitWidth - SPLIT_HANDLE - VALUES_GUTTER);
      const maxScroll = Math.max(0, trackW - valuesViewW);
      const clampScroll = (x) => Math.max(0, Math.min(maxScroll, x));

      // Dragging the divider changes how much there is to see, so the position
      // has to come back inside the new range.
      React.useEffect(() => {
        setScrollX((x) => Math.max(0, Math.min(maxScroll, x)));
      }, [maxScroll]);

      // Trackpads swipe sideways over the values, and shift with a wheel does the
      // same on a mouse.
      const onValuesWheel = (e) => {
        if (!scrollValues || !maxScroll) return;
        const delta = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : (e.shiftKey ? e.deltaY : 0);
        if (delta) setScrollX((x) => clampScroll(x + delta));
      };


      // Sits inside the first drill's row rather than in a band of its own,
      // which is where the space above the drills was going.
      // A plain function, not a component declared in the render: as a component
      // it would be a new type every render, remounting the headings and leaving
      // the menu's anchor detached, which parked it in the top left corner.
      const renderMetricHeaders = () => (
        <Box sx={{
          display: 'flex',
          ...(table && {
            height: TABLE_HEAD_H, bgcolor: NEUTRAL_200,
            borderBottom: `1px solid ${DIVIDER}`, flex: 'none',
          }),
        }}>
          {metrics.map((m, i) => (
            <Box key={m.key} sx={{
              width: colWidthOf(m), flex: 'none',
              ...(table
                ? { px: 1.5, borderRight: `1px solid ${DIVIDER}` }
                : { pr: 2, pt: '10px' }),
              ...(scrollValues && { position: 'relative' }),
              display: 'flex', alignItems: 'center',
              ...(overColumns.has(m.key) && { bgcolor: COLUMN_TINT }),
              '&:hover .col-tool': { opacity: 1 },
              '&:hover .col-grip': { opacity: 1 },
            }}>
              {/* The whole label is the hit area, not just the icon */}
              <ButtonBase
                onClick={(e) => { setMetricQuery(''); setColAnchor({ el: e.currentTarget, index: i }); }}
                aria-label={`Change the ${m.name} column`}
                sx={{
                  display: 'flex', alignItems: 'center', gap: 0.25, minWidth: 0,
                  px: 0.75, py: 0.5, ml: -0.75, borderRadius: `${RADIUS}px`,
                  justifyContent: 'flex-start',
                  '&:hover': { bgcolor: 'rgba(59,73,96,0.06)' },
                }}
              >
                <Tooltip title={metricTitle(m, overMetrics.has(m.key))} placement="top">
                  {/* The full name where the columns hold a fixed width, cut with
                      an ellipsis when it outruns one. The tooltip has the whole of
                      it either way. minWidth is what lets the cut happen at all:
                      a flex item will not shrink below its text without it. */}
                  <Box component="span" sx={{
                    fontSize: 12, minWidth: 0,
                    color: overMetrics.has(m.key) ? ERROR : GREY100,
                    fontWeight: overMetrics.has(m.key) ? 700 : 400,
                    whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis',
                  }}>
                    {scrollValues ? m.name : m.label}
                  </Box>
                </Tooltip>
                <Box className="col-tool" sx={{ opacity: 0, transition: 'opacity .12s', display: 'flex', flex: 'none' }}>
                  <MI name="edit" size={13} color={GREY100} />
                </Box>
              </ButtonBase>

              {/* Sits outside the button: nesting it would fire the menu too */}
              {metrics.length > 1 && (
                <IconButton
                  className="col-tool"
                  size="small"
                  onClick={() => setColumns((prev) => prev.filter((_, idx) => idx !== i))}
                  aria-label={`Remove the ${m.name} column`}
                  sx={{ opacity: 0, transition: 'opacity .12s', p: 0.25, flex: 'none' }}
                >
                  <MI name="close" size={13} color={GREY100} />
                </IconButton>
              )}

              {/* On the table it sits over the rule between this column and the
                  next; without one it is the only thing marking the edge. */}
              {scrollValues && (
                <Box
                  className="col-grip"
                  onMouseDown={onColResize(m)}
                  onClick={(e) => e.stopPropagation()}
                  title="Drag to resize the column"
                  sx={{
                    position: 'absolute', top: 0, bottom: 0, right: -3,
                    width: 7, cursor: 'col-resize', zIndex: 2,
                    display: 'flex', justifyContent: 'center',
                    opacity: 0, transition: 'opacity .12s',
                    ...(table ? {} : { height: TABLE_HEAD_H }),
                  }}
                >
                  <Box sx={{ width: 3, height: '100%', bgcolor: PRIMARY, borderRadius: 2 }} />
                </Box>
              )}
            </Box>
          ))}

          {metrics.length < MAX_SESSION_COLUMNS && (
            <Box sx={{
              width: ADD_METRIC_W, flex: 'none', mr: `-${VALUES_GUTTER}px`,
              pt: table ? 0 : '10px', pl: table ? 1.5 : 0,
              display: 'flex', alignItems: 'center',
            }}>
              <ButtonBase
                onClick={(e) => { setMetricQuery(''); setColAnchor({ el: e.currentTarget, index: null }); }}
                aria-label="Add a metric column"
                sx={{
                  display: 'flex', alignItems: 'center', gap: 0.25,
                  px: 0.75, py: 0.5, ml: -0.75, borderRadius: `${RADIUS}px`,
                  color: GREY100, fontSize: 12,
                  '&:hover': { bgcolor: 'rgba(59,73,96,0.06)' },
                }}
              >
                <MI name="add" size={14} color={GREY100} />
                Metric
              </ButtonBase>
            </Box>
          )}
        </Box>
      );

      return (
        <Box sx={{ height: '100%', display: 'flex' }}>
          <NavRail onHome={onHome} activeLabel="Calendar" />

          <Box sx={{ flex: 1, display: 'flex', flexDirection: 'column', minWidth: 0 }}>
            <TopBar breadcrumb="Calendar" />

            <Box sx={{ flex: 1, display: 'flex', flexDirection: 'column', minHeight: 0, overflow: 'hidden' }}>

              {/* Everything above the targets bar scrolls, including the heading */}
              <Box sx={{ flex: 1, overflowY: 'auto', overflowX: 'hidden', bgcolor: '#FAFAFA' }}>

                {/* Heading band stays white down to and including the tabs */}
                <Box sx={{ bgcolor: '#fff', px: 3, pt: 2.5 }}>

                  <Stack direction="row" alignItems="center" spacing={0.5} sx={{ color: GREY100, mb: 0.5 }}>
                    <MI name="chevron_left" size={18} color={GREY100} />
                    <Typography sx={{ fontSize: 14, color: GREY100 }}>Gameweek</Typography>
                  </Stack>

                  <Stack direction="row" alignItems="center" justifyContent="space-between">
                    <Typography sx={{ fontSize: 28, fontWeight: 600, letterSpacing: -0.2 }}>Training</Typography>

                    <Stack direction="row" alignItems="center" spacing={2}>
                      <Stack
                        direction="row" alignItems="center" spacing={0.75}
                        onClick={() => setShowWorkload((v) => !v)}
                        sx={{ cursor: 'pointer', userSelect: 'none' }}
                      >
                        <Typography sx={{ fontSize: 14 }}>Workload</Typography>
                        <MI name={showWorkload ? 'visibility' : 'visibility_off'} size={20} color={PRIMARY} />
                      </Stack>

                      <Stack direction="row" alignItems="center" spacing={0.5}>
                        <Typography sx={{ fontSize: 14 }}>Complete</Typography>
                        <Switch
                          checked={complete}
                          onChange={(e) => setComplete(e.target.checked)}
                          inputProps={{ 'aria-label': 'Mark session complete' }}
                        />
                      </Stack>

                      <Button variant="contained" color="secondary" sx={{ px: 2.25 }}>Edit details</Button>
                      <MI name="more_vert" size={22} color={PRIMARY} />
                    </Stack>
                  </Stack>

                  <Stack direction="row" spacing={3} sx={{ mt: 1, mb: 2, flexWrap: 'wrap' }}>
                    {[
                      ['Date:', '4 Apr 2025 10:00'],
                      ['Gameweek:', 'IS6 - Arsenal FC (Away)'],
                      ['GD:', SESSION_GD.replace('GD', '')],
                      ['Surface type:', 'Grass'],
                    ].map(([k, v]) => (
                      <Typography key={k} sx={{ fontSize: 14, color: GREY100 }}>
                        {k} <Box component="span" sx={{ color: PRIMARY, fontWeight: 600 }}>{v}</Box>
                      </Typography>
                    ))}
                  </Stack>

                  <Box sx={{ borderBottom: `1px solid ${DIVIDER}` }}>
                    <Tabs
                      value="Planning"
                      sx={{
                        minHeight: 44,
                        '& .MuiTabs-indicator': { backgroundColor: PRIMARY, height: 2 },
                        '& .MuiTab-root': { pointerEvents: 'none', px: 0, mr: 3.5, minWidth: 0 },
                      }}
                    >
                      {['Planning', 'Athlete selection', 'Staff selection', 'Development goals', 'Collection', 'Imported data']
                        .map((l) => <Tab key={l} label={l} value={l} />)}
                    </Tabs>
                  </Box>
                </Box>

                <Box ref={areaRef} sx={{ px: 3, pt: 2, pb: 4 }}>

                  {drills.map((drill, drillIndex) => {
                  const hasPrinciples = Boolean(drill.principles?.length);
                  // Each is offered only while the drill is without one. The
                  // workload view offers duration alone: it is the one that moves
                  // the numbers beside it, and the rest belong to the other mode.
                  const canAddDuration = drill.duration == null && editingId !== drill.id;
                  const addItems = showWorkload
                    ? (canAddDuration ? ['Duration'] : [])
                    : [
                      ...(canAddDuration ? ['Duration'] : []),
                      'Area size', 'Note',
                      ...(hasPrinciples ? [] : ['Principles']),
                    ];

                  // The workload view closes the card just under its last line, and
                  // the cards have to stand level, so the padding takes back
                  // whatever that drill happens not to be carrying. The regular view
                  // keeps its roomier foot, with the same allowance for a drill that
                  // shows no duration line.
                  const tail = (drill.duration != null ? DURATION_LINE_H : 0)
                    + (addItems.length ? ADD_LINE_H : 0);
                  const bottomPad = showWorkload
                    ? Math.max(8, WORKLOAD_CARD_TAIL - tail)
                    : 8 + (canAddDuration ? DURATION_LINE_H + 4 : 0);
                  return (
                    <Box
                      key={drill.id}
                      ref={(el) => { rowRefs.current[drill.id] = el; }}
                      sx={{
                        display: 'flex', alignItems: 'flex-start',
                        // Lifted while it is being carried, so it is clear which
                        // row is moving and which are making way for it.
                        ...(draggingId === drill.id && { opacity: 0.55 }),
                      }}
                    >

                      {/* Drill number and edit, only without the workload view */}
                      <Box sx={{
                        width: showWorkload ? 0 : OFF_NUM_W, flex: 'none', overflow: 'hidden',
                        display: 'flex', alignItems: 'center', gap: 0.5, pt: '14px',
                        ...growSx, ...offFadeSx,
                      }}>
                        <Typography sx={{ fontSize: 14, color: GREY100 }}>{drillIndex + 1}</Typography>
                        <MI name="edit" size={14} color={GREY100} />
                      </Box>

                      {/* Fixed width and clipped, so dragging the divider left slides
                          the values over the card rather than reflowing it. */}
                      <Box sx={{
                        width: cardWidth, flex: 'none', ...growSx, mb: 1.5,
                        minWidth: 0, overflow: 'hidden', position: 'relative',
                        border: `1px solid ${DIVIDER}`, borderRadius: `${RADIUS}px`, bgcolor: '#fff',
                        display: 'flex', alignItems: 'flex-start', gap: 1.5, p: 1.5,
                      }}>
                        <Box
                          onMouseDown={onDrillGrab(drill.id)}
                          title="Drag to reorder"
                          sx={{
                            pt: 1.5, flex: 'none', alignSelf: 'stretch',
                            cursor: draggingId ? 'grabbing' : 'grab',
                            '&:hover .grip-dots': { color: GREY100 },
                          }}
                        >
                          <Box className="grip-dots" sx={{ color: '#C3C9D4', display: 'flex' }}>
                            <MI name="drag_indicator" size={18} color="currentColor" />
                          </Box>
                        </Box>

                        <PitchThumb />

                        <Box sx={{ flex: 1, minWidth: 0, pr: 5, pb: `${bottomPad}px` }}>
                          <Stack direction="row" alignItems="center" spacing={1} sx={{ mb: 0.5, minWidth: 0 }}>
                            <Typography sx={{
                              fontSize: 15, fontWeight: 700, minWidth: 0,
                              whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis',
                            }}>{drill.name}</Typography>
                            <Box sx={{
                              bgcolor: NEUTRAL_200, borderRadius: '3px', px: 1, py: '2px', flex: 'none',
                              fontSize: 12, color: PRIMARY, whiteSpace: 'nowrap',
                            }}>{drill.tag}</Box>
                          </Stack>

                          <Typography sx={{
                            fontSize: 14, color: PRIMARY, mb: 0.75,
