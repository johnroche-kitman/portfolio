<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Org settings — Workload metrics and targets</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet" />
  <style>
    html, body, #root { height: 100%; margin: 0; }
    body {
      font-family: 'Open Sans', sans-serif;
      background: #fff;
      color: #3b4960;
      -webkit-font-smoothing: antialiased;
    }
    * { box-sizing: border-box; }

    /* Force the filled-variant InputLabel to sit inside the grey box, as per the Playbook toolkit.
       Same workaround as performance-settings/index.html — the variant class does not always
       reach InputLabel through TextField, so pin it from CSS instead. */
    .MuiFormControl-root:has(.MuiFilledInput-root) { position: relative !important; }
    .MuiFormControl-root:has(.MuiFilledInput-root) .MuiInputLabel-root {
      position: absolute !important;
      left: 0 !important;
      top: 0 !important;
      z-index: 2 !important;
      max-width: none !important;
      pointer-events: none !important;
      font-size: 12px !important;
      line-height: 1 !important;
      letter-spacing: 0.15px !important;
      color: #5F7089 !important;
      transform: translate(12px, 9px) !important;
      transform-origin: left top !important;
      transition: none !important;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/@babel/standalone@7.25.6/babel.min.js"></script>

  <script type="importmap">
  {
    "imports": {
      "react": "https://esm.sh/react@18.3.1",
      "react/": "https://esm.sh/react@18.3.1/",
      "react-dom": "https://esm.sh/react-dom@18.3.1",
      "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
      "@mui/material": "https://esm.sh/@mui/material@5.16.7?external=react,react-dom,@emotion/react,@emotion/styled",
      "@emotion/react": "https://esm.sh/@emotion/react@11.13.3?external=react",
      "@emotion/styled": "https://esm.sh/@emotion/styled@11.13.0?external=react,@emotion/react"
    }
  }
  </script>

  <script type="text/babel" data-type="module" data-presets="react">
    import React, { useState, useMemo } from 'react';
    import { createRoot } from 'react-dom/client';
    import {
      createTheme, ThemeProvider, CssBaseline,
      Box, Stack, Typography, Button, IconButton, Divider, Tooltip,
      Tabs, Tab, List, ListItemButton, ListItemText,
      TextField, MenuItem, Menu, Avatar, ButtonBase,
      Snackbar, Alert, AlertTitle,
    } from '@mui/material';

    /* ── Design tokens (Figma variables, Playbook toolkit) ───────────── */
    const PRIMARY     = '#3b4960';   // primary/main, text/primary
    const GREY100     = '#5F7089';   // Grey/100
    const DISABLED    = '#AFB7C4';   // Grey/100 50%
    const NEUTRAL_200 = '#F1F2F3';   // Neutral/200, secondary/main
    const DIVIDER     = '#3b49601f';
    const PRIMARY_SEL = '#3b496014'; // primary/selected
    const ACTIVE_NAV  = '#0F28FF';
    const UNDERLINE   = '#3b49606b'; // components/input/standard/enabledBorder
    const RADIUS      = 4;

    /* ── Material icon helper (Outlined only) ────────────────────────── */
    const MI = ({ name, size = 20, color, style }) => (
      <span className="material-icons-outlined" style={{ fontSize: size, lineHeight: 1, color, ...style }}>{name}</span>
    );

    // Material's Clear glyph, same mark as @mui/icons-material/Clear.
    // In the real codebase write `import ClearIcon from '@mui/icons-material/Clear'`.
    // This prototype has no bundler, and pulling the icons package in through the
    // import map loads a second copy of MUI's internals, which breaks
    // FormControl context — disabled stops reaching the inputs. The icon font
    // renders the identical glyph with none of that.
    const ClearIcon = ({ sx = {} }) => <MI name="clear" size={sx.fontSize || 20} color={sx.color} />;

    /* ── Theme ───────────────────────────────────────────────────────── */
    const theme = createTheme({
      palette: {
        primary:   { main: PRIMARY, contrastText: '#ffffff' },
        secondary: { main: NEUTRAL_200, contrastText: PRIMARY },
        text:      { primary: PRIMARY, secondary: GREY100 },
        divider:   DIVIDER,
      },
      shape: { borderRadius: RADIUS },
      typography: {
        fontFamily: "'Open Sans', sans-serif",
        body1: { fontSize: 16, lineHeight: 1.5, letterSpacing: 0.15 },
        body2: { fontSize: 14, lineHeight: 1.43, letterSpacing: 0.17 },
      },
      components: {
        MuiButton: { styleOverrides: { root: {
          textTransform: 'none', fontFamily: "'Open Sans', sans-serif",
          fontWeight: 600, fontSize: 14, lineHeight: '24px', letterSpacing: 0.4, boxShadow: 'none',
          '&:hover': { boxShadow: 'none' },
        }}},
        MuiTab: { styleOverrides: { root: {
          textTransform: 'none', fontFamily: "'Open Sans', sans-serif",
          fontWeight: 600, fontSize: 14, minHeight: 46, color: GREY100,
          '&.Mui-selected': { color: PRIMARY },
        }}},
        MuiInputBase:  { styleOverrides: { root: { fontFamily: "'Open Sans', sans-serif", fontSize: 14 } } },
        MuiTypography: { styleOverrides: { root: { fontFamily: "'Open Sans', sans-serif" } } },
        MuiListItemText: { styleOverrides: { primary: { fontFamily: "'Open Sans', sans-serif", fontSize: 15 } } },
        MuiFilledInput: { styleOverrides: { root: {
          backgroundColor: NEUTRAL_200,
          // Square bottom corners over a 1px underline, per the Playbook toolkit.
          borderRadius: `${RADIUS}px ${RADIUS}px 0 0`,
          borderBottom: `1px solid ${UNDERLINE}`,
          '&:hover':        { backgroundColor: '#e8e9eb' },
          '&.Mui-focused':  { backgroundColor: NEUTRAL_200, borderBottomColor: PRIMARY },
          '&:before, &:after': { display: 'none' },
        }}},
        MuiInputLabel: { styleOverrides: { root: { fontFamily: "'Open Sans', sans-serif" } } },
        MuiFormControl: { styleOverrides: { root: { position: 'relative' } } },
        MuiMenuItem: { styleOverrides: { root: { fontFamily: "'Open Sans', sans-serif", fontSize: 14 } } },
      },
    });

    /* ── Reference data ──────────────────────────────────────────────── */
    const NAV_ITEMS = [
      { icon: 'bar_chart',           label: 'Analysis' },
      { icon: 'science',             label: 'My iP' },
      { icon: 'groups',              label: 'Athletes' },
      { icon: 'medical_services',    label: 'Medical' },
      { icon: 'monitor_weight',      label: 'Performance' },
      { icon: 'assignment',          label: 'Forms' },
      { icon: 'calendar_today',      label: 'Calendar' },
      { icon: 'file_copy',           label: 'Documents' },
      { icon: 'chat_bubble_outline', label: 'Messaging' },
      { icon: 'smart_display',       label: 'Media' },
      { icon: 'assignment_ind',      label: 'Recruitment' },
      { icon: 'settings',            label: 'Org settings', active: true },
    ];

    const ORG_TABS = ['Appearance', 'Workload', 'Planning', 'Security and privacy', 'My iP', 'Calendar', 'Locations', 'Notifications'];
    const SUB_SECTIONS = ['Participation and RPE', 'Workload metrics and targets'];

    const SQUADS    = ['1st team', 'U21', 'U18'];
    const POSITIONS = ['All', 'Goalkeeper', 'Defender', 'Midfielder', 'Forward'];

    const METRIC_LIBRARY = [
      'Total distance', 'High speed running', 'Sprint distance',
      'Accelerations (count)', 'Decelerations (count)', 'Player load',
      'Max speed', 'Distance per minute', 'Dynamic stress load',
    ];

    const IMPORT_WINDOWS = ['Last 3 imports', 'Last 5 imports', 'Last 10 imports', 'All imports'];

    // Gameday markers, in training-week order. The minus sign matches the design (U+2212).
    // Match day itself is deliberately absent: the game cannot carry a target.
    const GD_ALL = ['GD−5', 'GD−4', 'GD−3', 'GD−2', 'GD−1', 'GD+1', 'GD+2', 'GD+3'];
    const GD_DEFAULT = ['GD−4', 'GD−3', 'GD−2', 'GD−1', 'GD+1', 'GD+2'];

    const MAX_METRICS = 6;

    // The grid always holds exactly MAX_METRICS slots. A slot with an empty
    // metric name is an open row waiting to be filled; clearing a row empties
    // it in place rather than removing it, so the row count never changes.
    const emptySlot = () => ({ metric: '', targets: {} });
    const emptySlots = () => Array.from({ length: MAX_METRICS }, emptySlot);
    const isFilled = (slot) => Boolean(slot && slot.metric);

    // Session totals for a soccer training week. GD−3 is the heaviest day, GD−1 is
    // activation and GD+1 is recovery. Younger squads carry less volume.
    // Order of values matches GD_DEFAULT: GD−4, GD−3, GD−2, GD−1, GD+1, GD+2.
    const SQUAD_TARGETS = {
      '1st team': {
        'Total distance':       [4800, 5600, 4200, 3100, 2200, 4400],
        'High speed running':   [420, 610, 480, 260, 90, 380],
        'Sprint distance':      [120, 210, 180, 70, 20, 110],
        'Accelerations (count)': [28, 38, 32, 18, 8, 26],
        'Decelerations (count)': [30, 41, 34, 19, 9, 28],
      },
      'U21': {
        'Total distance':       [4300, 5000, 3800, 2800, 2000, 3900],
        'High speed running':   [360, 520, 410, 220, 80, 320],
        'Sprint distance':      [95, 170, 145, 55, 15, 90],
        'Accelerations (count)': [24, 33, 28, 16, 7, 22],
        'Decelerations (count)': [26, 35, 30, 17, 8, 24],
      },
      'U18': {
        'Total distance':       [3800, 4500, 3400, 2500, 1800, 3500],
        'High speed running':   [300, 430, 340, 180, 65, 270],
        'Sprint distance':      [75, 135, 115, 45, 12, 70],
        'Accelerations (count)': [20, 28, 24, 13, 6, 19],
        'Decelerations (count)': [22, 30, 26, 14, 7, 20],
      },
    };

    // U18 sessions are less frequent, so the average leans on a longer window.
    const SQUAD_IMPORTS = { '1st team': 'Last 5 imports', 'U21': 'Last 5 imports', 'U18': 'Last 10 imports' };

    const seedMetrics = (squad) => {
      const slots = emptySlots();
      Object.entries(SQUAD_TARGETS[squad]).forEach(([metric, values], i) => {
        slots[i] = {
          metric,
          targets: GD_DEFAULT.reduce((acc, day, d) => ({ ...acc, [day]: String(values[d]) }), {}),
        };
      });
      return slots;
    };

    // A squad + position combination holds its own metrics and its own import window.
    const emptyCombination = () => ({ imports: 'Last 5 imports', metrics: emptySlots() });

    const seedConfig = () => {
      const cfg = {};
      SQUADS.forEach((squad) => {
        cfg[squad] = {
          days: [...GD_DEFAULT],
          byPosition: { All: { imports: SQUAD_IMPORTS[squad], metrics: seedMetrics(squad) } },
        };
      });
      return cfg;
    };

    const clone = (o) => JSON.parse(JSON.stringify(o));

    /* ── Layout constants (from the Figma frame) ─────────────────────── */
    const RAIL_W    = 60;
    const DRAWER_W  = 280;
    const CONTENT_X = 26;   // content inset inside the pane
    const COL_METRIC = 219;
    const COL_DAY    = 145;
    const IN_METRIC  = 193;
    const IN_DAY     = 129;
    const ROW_H      = 77;

    /* ── Chrome ──────────────────────────────────────────────────────── */
    function NavRail({ onHome }) {
      return (
        <Box sx={{
          width: RAIL_W, flex: 'none', color: '#fff',
          background: 'linear-gradient(160deg, #0c0d13 0%, #0c0d13 58%, #1c2130 100%)',
          display: 'flex', flexDirection: 'column', alignItems: 'center', py: 1.5,
        }}>
          <Tooltip title="Back to prototype versions" placement="right">
            <ButtonBase
              onClick={onHome}
              aria-label="Back to prototype versions"
              sx={{ borderRadius: '50%', mb: 1.25, flex: 'none' }}
            >
              <Box
                component="img"
                src="kitman-logo.png"
                alt="Kitman Labs"
                sx={{ width: 36, height: 36, display: 'block', objectFit: 'contain' }}
              />
            </ButtonBase>
          </Tooltip>

          {NAV_ITEMS.map((item) => (
            <Tooltip key={item.label} title={item.label} placement="right">
              <Box sx={{
                width: RAIL_W, height: 40, flex: 'none',
                display: 'flex', alignItems: 'center', justifyContent: 'center',
                bgcolor: item.active ? ACTIVE_NAV : 'transparent',
                cursor: 'pointer',
                '&:hover': { bgcolor: item.active ? ACTIVE_NAV : 'rgba(255,255,255,0.08)' },
              }}>
                <MI name={item.icon} size={22} color="#fff" />
              </Box>
            </Tooltip>
          ))}

          <Box sx={{ mt: 'auto', display: 'flex', flexDirection: 'column', gap: 1.5, pb: 1 }}>
            <Box sx={{ width: RAIL_W, height: 32, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
              <MI name="help_outline" size={22} color="#fff" />
            </Box>
            <Box sx={{ width: RAIL_W, height: 32, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
              <MI name="keyboard_double_arrow_left" size={22} color="#fff" />
            </Box>
          </Box>
        </Box>
      );
    }

    function TopBar({ contextLabel }) {
      return (
        <Box sx={{
          height: 50, flex: 'none', display: 'flex', alignItems: 'center',
          justifyContent: 'space-between', px: 3, borderBottom: `1px solid ${DIVIDER}`,
        }}>
          <Typography sx={{ fontSize: 14, color: GREY100 }}>Org settings</Typography>
          <Stack direction="row" alignItems="center" spacing={1.5}>
            <Stack direction="row" alignItems="center" spacing={0.5} sx={{ cursor: 'pointer' }}>
              <Typography sx={{ fontSize: 14, color: PRIMARY }}>{contextLabel}</Typography>
              <MI name="expand_more" size={20} color={PRIMARY} />
            </Stack>
            <Avatar sx={{ width: 32, height: 32, bgcolor: '#c9cfd9', fontSize: 13, color: PRIMARY }}>RP</Avatar>
          </Stack>
        </Box>
      );
    }

    function SubNav({ value, onChange, sections = SUB_SECTIONS }) {
      return (
        <Box sx={{ width: DRAWER_W, flex: 'none', borderRight: `1px solid ${DIVIDER}`, bgcolor: '#fff' }}>
          <List disablePadding sx={{ pt: 1 }}>
            {sections.map((section) => (
              <ListItemButton
                key={section}
                selected={value === section}
                onClick={() => onChange(section)}
                sx={{
                  height: 48, px: 3,
                  '&.Mui-selected':        { bgcolor: NEUTRAL_200 },
                  '&.Mui-selected:hover':  { bgcolor: NEUTRAL_200 },
                }}
              >
                <ListItemText primary={section} />
              </ListItemButton>
            ))}
          </List>
        </Box>
      );
    }

    /* ── Read-only view ──────────────────────────────────────────────── */
    function SquadTargetTable({ squad, cfg }) {
      const rows = [];
      const filled = [];
      POSITIONS.forEach((position) => {
        const combo = cfg.byPosition[position];
        if (!combo) return;
        const set = combo.metrics.filter(isFilled);
        if (set.length === 0) return;
        filled.push({ position, imports: combo.imports });
        set.forEach((row) => rows.push({ position, ...row }));
      });

      // The design states the window once beneath the table. Only name the positions
      // when they have drifted apart.
      const uniform = filled.length > 0 && filled.every((f) => f.imports === filled[0].imports);
      const tableWidth = 220 + 165 + cfg.days.length * 150;

      const cell = { fontSize: 14, letterSpacing: 0.17, color: PRIMARY };
      const head = { fontSize: 14, fontWeight: 600, lineHeight: '24px', letterSpacing: 0.17, color: PRIMARY };

      return (
        <Box sx={{ mb: 5 }}>
          <Typography sx={{ fontSize: 20, fontWeight: 700, mb: 1.5 }}>
            {squad} targets by GD
          </Typography>

          <Box sx={{ overflowX: 'auto' }}>
            <Box sx={{ minWidth: tableWidth }}>
              <Box sx={{ display: 'flex', alignItems: 'center', height: 44, borderBottom: `1px solid ${DIVIDER}` }}>
                <Box sx={{ width: 220, flex: 'none', ...head }}>Metric</Box>
                <Box sx={{ width: 165, flex: 'none', ...head }}>Position</Box>
                {cfg.days.map((day) => (
                  <Box key={day} sx={{ width: 150, flex: 'none', ...head }}>{day}</Box>
                ))}
              </Box>

              {rows.map((row, i) => (
                <Box
                  key={`${row.position}-${row.metric}-${i}`}
                  sx={{ display: 'flex', alignItems: 'center', height: 50, borderBottom: `1px solid ${DIVIDER}` }}
                >
                  <Box sx={{ width: 220, flex: 'none', ...cell }}>{row.metric}</Box>
                  <Box sx={{ width: 165, flex: 'none', ...cell }}>{row.position}</Box>
                  {cfg.days.map((day) => (
                    <Box key={day} sx={{ width: 150, flex: 'none', ...cell }}>
                      {row.targets[day] || <span style={{ color: DISABLED }}>&mdash;</span>}
                    </Box>
                  ))}
                </Box>
              ))}
            </Box>
          </Box>

          {rows.length === 0 && (
            <Box sx={{ py: 3 }}>
              <Typography sx={{ fontSize: 14, color: GREY100 }}>
                No metrics set for this squad yet.
              </Typography>
            </Box>
          )}

          {uniform && (
            <Typography sx={{ fontSize: 14, fontWeight: 600, mt: 2 }}>
              Averages based on {filled[0].imports.toLowerCase()}
            </Typography>
          )}

          {!uniform && filled.map((f) => (
            <Typography key={f.position} sx={{ fontSize: 14, fontWeight: 600, mt: 1 }}>
              {f.position}: averages based on {f.imports.toLowerCase()}
            </Typography>
          ))}
        </Box>
      );
    }

    function ReadOnlyView({ config, onAction, title = 'Workload metrics and targets', actionLabel = 'Edit' }) {
      return (
        <Box sx={{ pl: `${CONTENT_X}px`, pt: 4, pb: 6, overflowY: 'auto', flex: 1 }}>
          <Stack direction="row" alignItems="flex-start" justifyContent="space-between" sx={{ mb: 3.5, pr: `${CONTENT_X}px` }}>
            <Typography sx={{ fontSize: 28, fontWeight: 600, letterSpacing: -0.2 }}>
              {title}
            </Typography>
            <Button variant="contained" color="primary" onClick={onAction} sx={{ px: 2.5 }}>
              {actionLabel}
            </Button>
          </Stack>

          {SQUADS.map((squad) => (
            <SquadTargetTable key={squad} squad={squad} cfg={config[squad]} />
          ))}
        </Box>
      );
    }

    /* ── Edit view ───────────────────────────────────────────────────── */
    function FilledSelect({ label, value, options, onChange, width, disabledOptions = [] }) {
      return (
        <TextField
          select
          label={label}
          value={value}
          onChange={(e) => onChange(e.target.value)}
          variant="filled"
          sx={{
            width, flex: 'none',
            '& .MuiFilledInput-root': { height: 50 },
            '& .MuiSelect-select':    { pt: '24px', pb: '6px', fontSize: 15, color: PRIMARY, minHeight: 0 },
          }}
        >
          {options.map((option) => (
            <MenuItem key={option} value={option} disabled={disabledOptions.includes(option)}>
              {option}
            </MenuItem>
          ))}
        </TextField>
      );
    }

    function EditView({ draft, setDraft, squad, setSquad, position, setPosition, onSave, onCancel }) {
      const [dayAnchor, setDayAnchor] = useState(null);

      const cfg   = draft[squad];
      const combo = cfg.byPosition[position] || emptyCombination();
      const rows  = combo.metrics;
      const usedCount = rows.filter(isFilled).length;
      const usedMetrics = rows.filter(isFilled).map((r) => r.metric);
      const unusedDays = GD_ALL.filter((d) => !cfg.days.includes(d));

      const mutate = (fn) => {
        const next = clone(draft);
        if (!next[squad].byPosition[position]) next[squad].byPosition[position] = emptyCombination();
        fn(next);
        setDraft(next);
      };

      const setMetric = (index, metric) => mutate((next) => {
        next[squad].byPosition[position].metrics[index].metric = metric;
      });

      const setTarget = (index, day, raw) => mutate((next) => {
        const value = raw.replace(/[^0-9.]/g, '');
        next[squad].byPosition[position].metrics[index].targets[day] = value;
      });

      // Empties the row in place. The six rows are fixed, so nothing shifts up.
      const clearMetric = (index) => mutate((next) => {
        next[squad].byPosition[position].metrics[index] = emptySlot();
      });

      const addDay = (day) => mutate((next) => {
        const days = next[squad].days;
        days.push(day);
        days.sort((a, b) => GD_ALL.indexOf(a) - GD_ALL.indexOf(b));
      });

      const removeDay = (day) => mutate((next) => {
        const cur = next[squad];
        cur.days = cur.days.filter((d) => d !== day);
        Object.values(cur.byPosition).forEach((c) =>
          c.metrics.forEach((slot) => { delete slot.targets[day]; })
        );
      });

      // Specific to this squad and position combination, not to the squad.
      const setImports = (value) => mutate((next) => {
        next[squad].byPosition[position].imports = value;
      });

      const ensurePosition = (nextPosition) => {
        if (!draft[squad].byPosition[nextPosition]) {
          const next = clone(draft);
          next[squad].byPosition[nextPosition] = emptyCombination();
          setDraft(next);
        }
        setPosition(nextPosition);
      };

      const head = { fontSize: 14, fontWeight: 600, lineHeight: '24px', letterSpacing: 0.17, color: PRIMARY };

      // Always six rows. An empty one is how a metric gets added.
      const tableWidth = CONTENT_X + COL_METRIC + (cfg.days.length + 1) * COL_DAY;

      return (
        <Box sx={{ pt: 4, pb: 6, overflowY: 'auto', flex: 1 }}>
          <Stack direction="row" alignItems="flex-start" justifyContent="space-between" sx={{ mb: 3, px: `${CONTENT_X}px` }}>
            <Typography sx={{ fontSize: 28, fontWeight: 600, letterSpacing: -0.2 }}>
              Workload metrics and targets
            </Typography>
            <Stack direction="row" spacing={1}>
              <Button variant="contained" color="primary" onClick={onSave} sx={{ px: 3 }}>Save</Button>
              <Button variant="contained" color="secondary" onClick={onCancel} sx={{ px: 3 }}>Cancel</Button>
            </Stack>
          </Stack>

          {/* These two filter what the grid shows. */}
          <Stack direction="row" spacing={1.25} sx={{ mb: 3.5, pl: `${CONTENT_X}px` }}>
            <FilledSelect label="Squad"       value={squad}    options={SQUADS}    onChange={setSquad}       width={251} />
            <FilledSelect label="Position(s)" value={position} options={POSITIONS} onChange={ensurePosition} width={240} />
          </Stack>

          <Divider sx={{ mb: 0 }} />

          {/* One scroll container so the header cells and the inputs below them
              can never drift out of alignment at narrow widths. */}
          <Box sx={{ overflowX: 'auto' }}>
          <Box sx={{ minWidth: tableWidth }}>

          {/* Header row */}
          <Box sx={{ display: 'flex', alignItems: 'center', height: 56, borderBottom: `1px solid ${DIVIDER}` }}>
            <Box sx={{ width: COL_METRIC, flex: 'none', pl: `${CONTENT_X}px`, ...head }}>Metric</Box>
            {cfg.days.map((day) => (
              <Box key={day} sx={{
                width: COL_DAY, flex: 'none', pl: '16px', ...head,
                display: 'flex', alignItems: 'center', gap: 0.5,
                '&:hover .day-remove': { opacity: 1 },
              }}>
                {day}
                <IconButton
                  className="day-remove"
                  size="small"
                  onClick={() => removeDay(day)}
                  sx={{ opacity: 0, transition: 'opacity .12s', p: 0.25 }}
                  aria-label={`Remove ${day}`}
                >
                  <MI name="close" size={14} color={GREY100} />
                </IconButton>
              </Box>
            ))}

      { valid: false, errorAt: 2, errorText: 'Not a metric in your library',

    const INSTRUCTIONS_W = 340;

    /* ── Import stepper ──────────────────────────────────────────────── */

    /* ── Step 2: preview, with double-click to edit any data cell ────── */
    function EditableCell({ value, invalid, onCommit }) {
      const [editing, setEditing] = useState(false);
      const [buffer, setBuffer] = useState(value);

      const start = () => { setBuffer(value); setEditing(true); };
      const commit = () => { setEditing(false); onCommit(buffer); };

      if (editing) {
        return (
          <TextField
            value={buffer}
            autoFocus
            onChange={(e) => setBuffer(e.target.value)}
            onBlur={commit}
            onKeyDown={(e) => {
              if (e.key === 'Enter') commit();
              if (e.key === 'Escape') setEditing(false);
            }}
            variant="outlined"
            size="small"
            sx={{
              width: '100%',
              '& .MuiOutlinedInput-root': {
                height: 50, borderRadius: `${RADIUS}px`,
                '& fieldset': { borderColor: '#5B8DEF' },
                '&.Mui-focused fieldset': { borderColor: '#5B8DEF', borderWidth: 1 },
              },
              '& .MuiOutlinedInput-input': { fontSize: 15, color: PRIMARY },
            }}
          />
        );
      }

      return (
        <Box
          onDoubleClick={start}
          title="Double-click to edit"
          sx={{
            fontSize: 15, color: invalid ? PRIMARY : PRIMARY, cursor: 'text',
            px: invalid ? 1 : 0, py: invalid ? 0.75 : 0, borderRadius: `${RADIUS}px`,
            border: invalid ? `1px solid ${AMBER}` : '1px solid transparent',
            bgcolor: invalid ? AMBER_BG : 'transparent',
            display: 'flex', alignItems: 'center', gap: 0.75,
            '&:hover': { borderColor: invalid ? AMBER : '#E0E2E6' },
          }}
        >
          {invalid && <MI name="warning_amber" size={16} color={AMBER} />}
          {value}
        </Box>
      );
    }

    function PreviewStep({ rows, setRows, instructionsOpen, onExpand }) {
      const [tab, setTab] = useState('All');

      const validCount = rows.filter((r) => r.valid).length;
      const shown = tab === 'All' ? rows : tab === 'Valid' ? rows.filter((r) => r.valid) : rows.filter((r) => !r.valid);

      const setCell = (rowIndex, colIndex, value) => {
        const next = rows.map((r) => ({ ...r, cells: [...r.cells] }));
        next[rowIndex].cells[colIndex] = value;
        // Editing the flagged cell is what clears the error.
        if (next[rowIndex].errorAt === colIndex && value !== rows[rowIndex].cells[colIndex]) {
          next[rowIndex].valid = true;
          delete next[rowIndex].errorAt;
        }
        setRows(next);
      };

      const head = { fontSize: 14, fontWeight: 600, lineHeight: '24px', letterSpacing: 0.17, color: PRIMARY };
      const cols = `44px 1.1fr 1fr 1.4fr 1fr repeat(6, 0.85fr)`;

      return (
        <Box sx={{ flex: 1, display: 'flex', flexDirection: 'column', minWidth: 0, overflow: 'hidden' }}>
          <Stack direction="row" alignItems="center" spacing={2} sx={{ px: 3, pt: 2, flex: 'none' }}>
            {!instructionsOpen && (
              <IconButton onClick={onExpand} aria-label="Show instructions" sx={{ p: 0.5 }}>
                <MI name="keyboard_double_arrow_right" size={22} color={PRIMARY} />
              </IconButton>
            )}
            <Box sx={{ display: 'flex', border: `1px solid ${DIVIDER}`, borderRadius: `${RADIUS}px`, overflow: 'hidden' }}>
              {[['All', rows.length], ['Valid', validCount], ['Invalid', rows.length - validCount]].map(([label, count], i) => (
                <Box
                  key={label}
                  onClick={() => setTab(label)}
                  sx={{
                    px: 2.25, height: 42, display: 'flex', alignItems: 'center', fontSize: 14, cursor: 'pointer',
                    borderLeft: i === 0 ? 'none' : `1px solid ${DIVIDER}`,
                    bgcolor: tab === label ? '#E9EAEC' : 'transparent',
                    '&:hover': { bgcolor: tab === label ? '#E9EAEC' : '#f7f8f9' },
                  }}
                >
                  {label} ({count})
                </Box>
              ))}
            </Box>
          </Stack>

          <Stack direction="row" alignItems="center" justifyContent="space-between" sx={{ px: 3, py: 2, flex: 'none' }}>
            <Stack direction="row" spacing={2.5} sx={{ color: PRIMARY }}>
              <MI name="view_column" size={24} />
              <MI name="download" size={24} />
              <MI name="filter_list" size={24} />
            </Stack>
            <Box sx={{
              bgcolor: NEUTRAL_200, borderBottom: `1px solid ${GREY100}`, borderRadius: `${RADIUS}px ${RADIUS}px 0 0`,
              height: 38, width: 240, display: 'flex', alignItems: 'center', justifyContent: 'space-between', px: 1.5,
            }}>
              <Typography sx={{ fontSize: 14, color: PRIMARY }}>Search</Typography>
              <MI name="search" size={22} color={PRIMARY} />
            </Box>
          </Stack>

          <Box sx={{ flex: 1, overflow: 'auto', px: 3 }}>
            <Box sx={{ minWidth: 1280 }}>
              <Box sx={{
                display: 'grid', gridTemplateColumns: cols, alignItems: 'center',
                height: 44, borderBottom: `1px solid #E0E2E6`,
              }}>
                <Box sx={{ width: 18, height: 18, border: `2px solid ${GREY100}`, borderRadius: '2px' }} />
                {CSV_COLUMNS.map((c) => <Box key={c} sx={head}>{c}</Box>)}
              </Box>

              {shown.map((row) => {
                const rowIndex = rows.indexOf(row);
                return (
                  <Box
                    key={rowIndex}
                    sx={{
                      display: 'grid', gridTemplateColumns: cols, alignItems: 'center',
                      minHeight: 52, borderBottom: `1px solid #F0F1F3`, py: 0.5, pr: 2,
                    }}
                  >
                    <Box sx={{ width: 18, height: 18, border: `2px solid ${GREY100}`, borderRadius: '2px' }} />
                    {row.cells.map((cell, colIndex) => (
                      <Box key={colIndex} sx={{ pr: 2 }}>
                        <EditableCell
                          value={cell}
                          invalid={row.errorAt === colIndex}
                          onCommit={(v) => setCell(rowIndex, colIndex, v)}
                        />
                      </Box>
                    ))}
                  </Box>
                );
              })}
            </Box>
          </Box>

          <Stack direction="row" alignItems="center" spacing={1} sx={{ px: 3, height: 60, flex: 'none' }}>
            <Stack direction="row" alignItems="center" spacing={0.25} sx={{ mr: 1.75, fontSize: 14, color: PRIMARY }}>
              25 <MI name="expand_more" size={18} color={PRIMARY} />
            </Stack>
            <MI name="chevron_left" size={20} color={DISABLED} />
            <Box sx={{
              width: 32, height: 32, borderRadius: '50%', bgcolor: PRIMARY, color: '#fff',
              display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 14,
            }}>1</Box>
            <MI name="chevron_right" size={20} color={DISABLED} />
          </Stack>
        </Box>
      );
    }

    /* ── The import flow ─────────────────────────────────────────────── */
    function ImportFlow({ onExit, onHome }) {
      const [step, setStep] = useState(1);
      const [file, setFile] = useState(null);
      const [instructionsOpen, setInstructionsOpen] = useState(true);
      const [rows, setRows] = useState(() => CSV_ROWS.map((r) => ({ ...r, cells: [...r.cells] })));

      // Instructions stay open through the whole upload step; they only close
      // when the preview appears and the table needs the width.
      const takeFile = (f) => setFile(f);

      const next = () => {
        if (step === 1) { setStep(2); setInstructionsOpen(false); }
        else onExit(true); // Import — the targets page confirms it
      };

      const previous = () => {
        if (step === 2) setStep(1);
        else onExit(false); // backing out of the flow, nothing imported
      };

      return (
        <Box sx={{ height: '100%', display: 'flex' }}>
          <NavRail onHome={onHome} />

          <Box sx={{ flex: 1, display: 'flex', flexDirection: 'column', minWidth: 0 }}>
            <TopBar contextLabel="Primary Squad" />

            <ImportStepper
              step={step}
              onPrevious={previous}
              onNext={next}
              nextLabel={step === 1 ? 'Next' : 'Import'}
              nextDisabled={step === 1 && !file}
            />

            <Box sx={{ flex: 1, display: 'flex', minHeight: 0 }}>
              {instructionsOpen && <InstructionsPanel onCollapse={() => setInstructionsOpen(false)} />}

              {step === 1 ? (
                <Box sx={{ flex: 1, display: 'flex', minWidth: 0 }}>
                  {!instructionsOpen && <ExpandInstructions onExpand={() => setInstructionsOpen(true)} />}
                  <UploadStep file={file} onFile={takeFile} onRemoveFile={() => setFile(null)} />
                </Box>
              ) : (
                <PreviewStep
                  rows={rows}
                  setRows={setRows}
                  instructionsOpen={instructionsOpen}
                  onExpand={() => setInstructionsOpen(true)}
                />
              )}
            </Box>
          </Box>
        </Box>
      );
    }

    /* ── Version 2 ───────────────────────────────────────────────────── */
    function VersionTwo({ onHome }) {
      const [section, setSection] = useState(V2_SUB_SECTIONS[0]);
      const [config] = useState(seedConfig);
      const [importing, setImporting] = useState(false);
      const [imported, setImported] = useState(false);

      const leaveImport = (didImport) => {
        setImporting(false);
        if (didImport) setImported(true);
      };

      if (importing) return <ImportFlow onExit={leaveImport} onHome={onHome} />;

      return (
        <Box sx={{ height: '100%', display: 'flex' }}>
          <NavRail onHome={onHome} />

          <Box sx={{ flex: 1, display: 'flex', flexDirection: 'column', minWidth: 0 }}>
            <TopBar contextLabel={section === V2_SUB_SECTIONS[1] ? '1st team' : 'Kitman Labs'} />

            <Box sx={{ flex: 'none', borderBottom: `1px solid ${DIVIDER}` }}>
              <Tabs
                value="Workload"
                sx={{
                  minHeight: 46, px: 1,
                  '& .MuiTabs-indicator': { backgroundColor: PRIMARY, height: 2 },
                  '& .MuiTab-root': { pointerEvents: 'none' },
                }}
              >
                {ORG_TABS.map((label) => <Tab key={label} label={label} value={label} />)}
              </Tabs>
            </Box>

            <Box sx={{ flex: 1, display: 'flex', minHeight: 0 }}>
              <SubNav value={section} onChange={setSection} sections={V2_SUB_SECTIONS} />

              <Box sx={{ flex: 1, display: 'flex', flexDirection: 'column', minWidth: 0 }}>
                {section === V2_SUB_SECTIONS[0] ? (
                  <ParticipationView />
                ) : (
                  <ReadOnlyView
                    config={config}
                    title="Workload metrics targets"
                    actionLabel="Import targets"
                    onAction={() => setImporting(true)}
                  />
                )}
              </Box>
            </Box>
          </Box>

          {/* Stays until dismissed, so it is still there when you look back. */}
          <Snackbar
            open={imported}
            anchorOrigin={{ vertical: 'bottom', horizontal: 'right' }}
            sx={{ right: '28px !important', bottom: '32px !important' }}
          >
            <Alert
              severity="success"
              onClose={() => setImported(false)}
              sx={{ width: 324, alignItems: 'flex-start' }}
            >
              <AlertTitle sx={{ fontWeight: 600, mb: 0.25 }}>Import successful</AlertTitle>
              Targets will update shortly
            </Alert>
          </Snackbar>
        </Box>
      );
    }

    /* ── Hash router, so every version has a shareable link ──────────── */
    function App() {
      const [route, setRoute] = useState(() => window.location.hash || '#/');

      React.useEffect(() => {
        const onHashChange = () => setRoute(window.location.hash || '#/');
        window.addEventListener('hashchange', onHashChange);
        return () => window.removeEventListener('hashchange', onHashChange);
      }, []);

      const goHome = () => { window.location.hash = '#/'; };

      if (route === '#/v1') return <VersionOne onHome={goHome} />;
      if (route === '#/v2') return <VersionTwo onHome={goHome} />;
      return <VersionsLanding />;
    }

    createRoot(document.getElementById('root')).render(
      <ThemeProvider theme={theme}>
        <CssBaseline />
        <App />
      </ThemeProvider>
    );
  </script>
</body>
</html>
