  <script type="text/babel" data-type="module" data-presets="react">

    // ── PALETTE ───────────────────────────────────────────────────────────────────
    const NAV_BG     = '#1b2a3b';
    const NAV_ACCENT = '#00b4a6';

    const BORDER     = '#e0e3e7';

    // ── METRIC CONFIG ─────────────────────────────────────────────────────────────
    const METRIC_CONFIG = {
      distance:     { label:'Total distance',      unit:'m',    col:'Today',  scale:1.000 },
      accels_dist:  { label:'Accels distance',     unit:'m',    col:'Accels (m)', scale:0.18 },
      accels_count: { label:'Accels count',        unit:'',     col:'Accels',     scale:0.003 },
      decels_dist:  { label:'Decels distance',     unit:'m',    col:'Decels (m)', scale:0.17 },
      decels_count: { label:'Decels count',        unit:'',     col:'Decels',     scale:0.0028 },
      sprint_dist:  { label:'Sprint distance',     unit:'m',    col:'Sprint (m)', scale:0.06 },
      hmld:         { label:'HMLD',                unit:'m',    col:'HMLD',       scale:0.25 },
      hsr:          { label:'High Speed running',  unit:'m',    col:'HSR (m)',    scale:0.12 },
      dist_per_min: { label:'Distance per minute', unit:'m/min',col:'Dist/min',   scale:null },
    };

    function acwrColor(v) {
      if (v > 1.5) return RED_NUM;
      if (v > 1.3) return '#e65100';
      if (v >= 0.8) return TEAL_NUM;
      return PURPLE_NUM;
    }

    function TrendArrow({ current, prev }) {
      if (prev == null) return null;
      const diff = current - prev;
      const pct = Math.abs(diff) / prev;
      if (pct < 0.01) return <span style={{ fontSize:13, color:BODY_LIGHT, marginLeft:4 }}>→</span>;
      return diff > 0
        ? <span style={{ fontSize:13, color:TEAL_NUM,  marginLeft:4 }}>↑</span>
        : <span style={{ fontSize:13, color:RED_NUM,   marginLeft:4 }}>↓</span>;
    }

    function metricVal(baseM, metric) {
      const cfg = METRIC_CONFIG[metric];
      if (!cfg) return baseM;
      if (metric === 'dist_per_min') return (baseM / 90).toFixed(1);
      return Math.round(baseM * cfg.scale);
    }

    function metricFmt(val, metric) {
      if (val == null) return '—';
      const cfg = METRIC_CONFIG[metric];
      const unit = cfg?.unit || '';
      return unit ? `${Number(val).toLocaleString()}${unit}` : Number(val).toLocaleString();
    }

    const METRIC_SLIDER_CONFIG = {
      distance:     { min:0, max:60,  step:2,   unit:'km',    dflt:[10, 20] },
      sprint_dist:  { min:0, max:6,   step:0.2, unit:'km',    dflt:[0.6, 1.2] },
      hmld:         { min:0, max:16,  step:0.5, unit:'km',    dflt:[2.5, 5] },
      hsr:          { min:0, max:8,   step:0.5, unit:'km',    dflt:[1, 2] },
      accels_dist:  { min:0, max:10,  step:0.5, unit:'km',    dflt:[1, 2] },
      accels_count: { min:0, max:200, step:5,   unit:'',      dflt:[30, 60] },
      decels_dist:  { min:0, max:10,  step:0.5, unit:'km',    dflt:[1, 2] },
      decels_count: { min:0, max:200, step:5,   unit:'',      dflt:[30, 60] },
      dist_per_min: { min:0, max:150, step:5,   unit:'m/min', dflt:[80, 100] },
    };

    // ── DATA ──────────────────────────────────────────────────────────────────────
    // Per-gameweek day labels — last entry is always 'GD' (game day, future)
    const GW_DAYS = {
      default:            ['GD-5','GD-4','GD-2','GD-1','GD'],
      'IS1-Brentford':    ['GD-4','GD-3','GD-2','GD-1','GD'],
      'IS2-Leicester':    ['GD-5','GD-4','GD-3','GD-2','GD-1','GD'],
      'IS3-Brighton':     ['GD-4','GD-2','GD-1','GD'],
      'IS4-Everton':      ['GD-5','GD-4','GD-2','GD-1','GD'],
      'IS5-Fulham':       ['GD-6','GD-5','GD-4','GD-2','GD-1','GD'],
      'IS6-Newcastle':    ['GD-4','GD-3','GD-1','GD'],
      'IS7-Wolves':       ['GD-5','GD-4','GD-2','GD-1','GD'],
      'IS8-Chelsea':      ['GD-4','GD-3','GD-2','GD-1','GD'],
      'IS9-ManUtd':       ['GD-6','GD-5','GD-4','GD-2','GD-1','GD'],
      'IS10-Arsenal':     ['GD-3','GD-2','GD-1','GD'],
      'IS11-Liverpool':   ['GD-5','GD-4','GD-2','GD-1','GD'],

      'IS13-West Ham':    ['GD-6','GD-5','GD-4','GD-3','GD-1','GD'],
      'IS14-Aston Villa': ['GD-5','GD-4','GD-2','GD-1','GD'],
    };
    // All other gameweeks cycle through the default 5-day pattern
    function getGdDays(gw) { return GW_DAYS[gw] || GW_DAYS.default; }

    // 6-entry max patterns (last entry always future/GD). Sliced to gdDays.length per gameweek.
    const GD_PATTERNS = [
      [{t:'target',d:'ON TARGET',f:0,a:10000,tgt:10000},{t:'under',d:'20 UNDER',f:.07,a:9800,tgt:10000},{t:'over',d:'30 OVER',f:.14,a:10300,tgt:10000},{t:'over',d:'30 OVER',f:.14,a:10300,tgt:10000},{t:'under',d:'20 UNDER',f:.07,a:9800,tgt:10000},{t:'future',d:'',f:0,a:null,tgt:10000}],
      [{t:'over',d:'25 OVER',f:.12,a:10250,tgt:10000},{t:'under',d:'15 UNDER',f:.05,a:9850,tgt:10000},{t:'under',d:'10 UNDER',f:.04,a:9900,tgt:10000},{t:'target',d:'ON TARGET',f:0,a:10000,tgt:10000},{t:'over',d:'20 OVER',f:.10,a:10200,tgt:10000},{t:'future',d:'',f:0,a:null,tgt:10000}],
      [{t:'under',d:'12 UNDER',f:.05,a:9880,tgt:10000},{t:'over',d:'30 OVER',f:.14,a:10300,tgt:10000},{t:'target',d:'ON TARGET',f:0,a:10000,tgt:10000},{t:'under',d:'15 UNDER',f:.05,a:9850,tgt:10000},{t:'target',d:'ON TARGET',f:0,a:10000,tgt:10000},{t:'future',d:'',f:0,a:null,tgt:10000}],
      [{t:'over',d:'18 OVER',f:.08,a:10180,tgt:10000},{t:'target',d:'ON TARGET',f:0,a:10000,tgt:10000},{t:'over',d:'40 OVER',f:.19,a:10400,tgt:10000},{t:'under',d:'10 UNDER',f:.04,a:9900,tgt:10000},{t:'over',d:'25 OVER',f:.10,a:10250,tgt:10000},{t:'future',d:'',f:0,a:null,tgt:10000}],
      [{t:'target',d:'ON TARGET',f:0,a:10000,tgt:10000},{t:'under',d:'50 UNDER',f:.24,a:9500,tgt:10000},{t:'under',d:'30 UNDER',f:.14,a:9700,tgt:10000},{t:'over',d:'20 OVER',f:.10,a:10200,tgt:10000},{t:'under',d:'15 UNDER',f:.05,a:9850,tgt:10000},{t:'future',d:'',f:0,a:null,tgt:10000}],
    ];

    const GROUPS = ['Starter','Non starter','Rehab','Academy','On loan','Goalkeeper'];

    const RAW_PLAYERS = [
      {id:1,  name:'Dan Jones',      pos:'LB',  group:'Starter',     acwr:1.8, risk:'High',   todayM:4200, weekToDate:11000, weekOver:1800, weekUnder:0,   rolling7:12500, rolling7Prev:11800, targetTomorrow:10000},
      {id:2,  name:'Marcus Webb',    pos:'CB',  group:'Starter',     acwr:1.9, risk:'High',   todayM:3900, weekToDate:10500, weekOver:500,  weekUnder:0,   rolling7:11800, rolling7Prev:12200, targetTomorrow:10000},
      {id:3,  name:'Tom Brady',      pos:'GK',  group:'Starter',     acwr:0.9, risk:'Low',    todayM:3100, weekToDate:9200,  weekOver:200,  weekUnder:0,   rolling7:10500, rolling7Prev:10500, targetTomorrow:9000},
      {id:4,  name:'Aaron Reid',     pos:'RB',  group:'Starter',     acwr:1.7, risk:'High',   todayM:4500, weekToDate:11200, weekOver:1200, weekUnder:0,   rolling7:12800, rolling7Prev:11900, targetTomorrow:10500},
      {id:5,  name:'Kyle Foster',    pos:'CB',  group:'Starter',     acwr:1.0, risk:'Low',    todayM:3700, weekToDate:9800,  weekOver:0,    weekUnder:0,   rolling7:11200, rolling7Prev:10800, targetTomorrow:9500},
      {id:6,  name:'Owen Clarke',    pos:'CM',  group:'Starter',     acwr:1.2, risk:'Low',    todayM:3800, weekToDate:10100, weekOver:100,  weekUnder:0,   rolling7:11600, rolling7Prev:11900, targetTomorrow:9800},
      {id:7,  name:'Ryan Moss',      pos:'AM',  group:'Starter',     acwr:1.6, risk:'High',   todayM:4100, weekToDate:10800, weekOver:800,  weekUnder:0,   rolling7:12200, rolling7Prev:11500, targetTomorrow:10000},
      {id:8,  name:'Scott Allen',    pos:'ST',  group:'Starter',     acwr:1.1, risk:'Low',    todayM:3600, weekToDate:9600,  weekOver:0,    weekUnder:400, rolling7:11000, rolling7Prev:11000, targetTomorrow:9200},
      {id:9,  name:'James Hunt',     pos:'CM',  group:'Non starter', acwr:1.8, risk:'High',   todayM:2800, weekToDate:7500,  weekOver:500,  weekUnder:0,   rolling7:8500,  rolling7Prev:7900,  targetTomorrow:7000},
      {id:10, name:'Luca Rossi',     pos:'RW',  group:'Non starter', acwr:1.1, risk:'Medium', todayM:3000, weekToDate:8000,  weekOver:0,    weekUnder:600, rolling7:9000,  rolling7Prev:9400,  targetTomorrow:7500},
      {id:11, name:'Euan Blair',     pos:'LW',  group:'Non starter', acwr:0.9, risk:'Low',    todayM:2900, weekToDate:7800,  weekOver:0,    weekUnder:0,   rolling7:8800,  rolling7Prev:8600,  targetTomorrow:7200},
      {id:12, name:'Nathan Park',    pos:'CB',  group:'Non starter', acwr:1.5, risk:'Medium', todayM:3100, weekToDate:8200,  weekOver:200,  weekUnder:0,   rolling7:9200,  rolling7Prev:9200,  targetTomorrow:7800},
      {id:13, name:'Callum West',    pos:'RB',  group:'Non starter', acwr:1.7, risk:'High',   todayM:2700, weekToDate:7200,  weekOver:700,  weekUnder:0,   rolling7:8200,  rolling7Prev:7600,  targetTomorrow:6800},
      {id:14, name:'Felix Meyer',    pos:'ST',  group:'Rehab',       acwr:0.7, risk:'High',   todayM:1500, weekToDate:4000,  weekOver:0,    weekUnder:800, rolling7:4500,  rolling7Prev:4200,  targetTomorrow:4000},
      {id:15, name:'Ali Hassan',     pos:'LW',  group:'Rehab',       acwr:0.6, risk:'High',   todayM:1200, weekToDate:3200,  weekOver:0,    weekUnder:500, rolling7:3800,  rolling7Prev:4100,  targetTomorrow:3500},
      {id:16, name:'Chris Lane',     pos:'CB',  group:'Rehab',       acwr:0.8, risk:'Medium', todayM:1800, weekToDate:4800,  weekOver:0,    weekUnder:0,   rolling7:5200,  rolling7Prev:4900,  targetTomorrow:4500},
      {id:17, name:'Joe Murphy',     pos:'GK',  group:'Rehab',       acwr:0.5, risk:'High',   todayM:900,  weekToDate:2400,  weekOver:0,    weekUnder:900, rolling7:2800,  rolling7Prev:3100,  targetTomorrow:2500},
      {id:18, name:'Pedro Silva',    pos:'RB',  group:'Academy',     acwr:1.8, risk:'High',   todayM:3200, weekToDate:8500,  weekOver:500,  weekUnder:0,   rolling7:9500,  rolling7Prev:8800,  targetTomorrow:8000},
      {id:19, name:'Sam Wright',     pos:'CM',  group:'Academy',     acwr:0.8, risk:'Medium', todayM:2800, weekToDate:7400,  weekOver:0,    weekUnder:300, rolling7:8400,  rolling7Prev:8700,  targetTomorrow:7000},
      {id:20, name:'Leo Burns',      pos:'LB',  group:'Academy',     acwr:1.3, risk:'Low',    todayM:3000, weekToDate:8000,  weekOver:0,    weekUnder:0,   rolling7:9000,  rolling7Prev:8800,  targetTomorrow:7500},
      {id:21, name:"Finn O'Brien",   pos:'AM',  group:'Academy',     acwr:0.7, risk:'High',   todayM:2600, weekToDate:6800,  weekOver:0,    weekUnder:700, rolling7:7800,  rolling7Prev:8200,  targetTomorrow:6500},
      {id:22, name:'Yuki Tanaka',    pos:'AM',  group:'On loan',     acwr:1.8, risk:'High',   todayM:3500, weekToDate:9200,  weekOver:1200, weekUnder:0,   rolling7:10500, rolling7Prev:9800,  targetTomorrow:9000},
      {id:23, name:'Ben Carter',     pos:'ST',  group:'On loan',     acwr:1.4, risk:'Medium', todayM:3200, weekToDate:8500,  weekOver:500,  weekUnder:0,   rolling7:9500,  rolling7Prev:9500,  targetTomorrow:8000},
      {id:24, name:'Hugo Diaz',      pos:'RW',  group:'On loan',     acwr:1.0, risk:'Low',    todayM:3000, weekToDate:7900,  weekOver:0,    weekUnder:0,   rolling7:9000,  rolling7Prev:9300,  targetTomorrow:7500},
      {id:25, name:'Marc Lefort',    pos:'CB',  group:'On loan',     acwr:1.6, risk:'High',   todayM:3800, weekToDate:9800,  weekOver:800,  weekUnder:0,   rolling7:11000, rolling7Prev:10400, targetTomorrow:9000},
      {id:26, name:'Sam Keane',      pos:'GK',  group:'Goalkeeper',  acwr:1.1, risk:'Low',    todayM:3200, weekToDate:8800,  weekOver:0,    weekUnder:200, rolling7:10000, rolling7Prev:9700,  targetTomorrow:8500},
      {id:27, name:'Owen Peters',    pos:'GK',  group:'Goalkeeper',  acwr:0.9, risk:'Medium', todayM:2900, weekToDate:7600,  weekOver:0,    weekUnder:400, rolling7:9200,  rolling7Prev:9600,  targetTomorrow:7800},
    ];

    const PLAYERS = RAW_PLAYERS.map((p, i) => ({
      ...p,
      gdData: GD_PATTERNS[i % GD_PATTERNS.length],
      status: p.acwr > 1.5 ? 'over' : p.acwr < 0.8 ? 'under' : 'target',
    }));

    const GROUP_ROWS = GROUPS.map((g, i) => ({
      group: g,
      todayM:        [4000, 3000, 1800, 3000, 3400, 3100][i],
      weekToDate:    [10000, 8000, 4000, 8000, 9000, 8600][i],
      weekOver:      [1600, 500,  0,   0, 800, 0  ][i],
      weekUnder:     [0,    0,   600, 300, 0,  400][i],
      rolling7:      [12000, 9000, 4500, 9000, 10000, 9800][i],
      acwr:          [1.8, 1.4, 0.7, 1.2, 1.5, 1.0][i],
      risk:          ['High','Medium','High','Low','Medium','Low'][i],
      targetTomorrow:[10000, 7500, 4000, 7500, 8500, 8000][i],
      gdData:        GD_PATTERNS[i % GD_PATTERNS.length],
      thisWeek:      [62400, 48200, 21500, 57800, 53600, 51200][i],
      avg3wk:        [65100, 51800, 24300, 60200, 57400, 54000][i],
    }));

    const CHART_DATA = GROUP_ROWS.map(g => ({
      name: g.group === 'On loan' ? 'On loan' : g.group,
      'This week': g.thisWeek,
      '3 week average': g.avg3wk,
    }));

    // ── LOAD MODAL (shared by player rows and group rows) ─────────────────────────
    function LoadModal({ subject, onClose, targetKm = [10, 20], gdDays = GW_DAYS.default }) {
      if (!subject) return null;

      const [hidden, setHidden] = useState({});

      const days = gdDays;
      const visibleGdData = subject.gdData.slice(-days.length);
      let cumul = 0;
      const chartData = days.map((day, i) => {
        const gd = visibleGdData[i];
        const isFuture = gd.t === 'future' || gd.a == null;
        if (!isFuture) cumul += gd.a;
        return {
          day,
          'Cumulative load': isFuture ? null : cumul,
          'Daily load':      isFuture ? null : gd.a,
          targetMin: targetKm[0] * 1000 * (i + 1),
          'Target band': targetKm[1] * 1000 * (i + 1),
        };
      });

      function handleLegendClick(data, index, e) {
        if (e && e.stopPropagation) e.stopPropagation();
        const key = data && data.dataKey;
        if (!key) return;
        setHidden(prev => ({ ...prev, [key]: !prev[key] }));
      }

      const isGroup = !!subject.group && !subject.pos;
      const title = isGroup ? subject.group : subject.name;
      const sub   = isGroup ? 'Group load by game day' : 'Load by game day';

      return (
        <Dialog open={!!subject} onClose={onClose} maxWidth="sm" fullWidth
          PaperProps={{ elevation:4, sx:{ borderRadius:'4px', m:2 } }}>
          <DialogTitle sx={{ fontSize:18, fontWeight:600, pb:0, pt:3, px:3, color:'#212121' }}>
            {title}
            <span style={{ fontSize:13, fontWeight:400, color:BODY_LIGHT, marginLeft:8 }}>{sub}</span>
          </DialogTitle>
          <DialogContent sx={{ px:3, pt:2, pb:2 }}>
            <div onClick={e => e.stopPropagation()}>
            <ResponsiveContainer width="100%" height={300}>
              <ComposedChart data={chartData} margin={{ top:8, right:16, bottom:4, left:16 }}>
                <CartesianGrid strokeDasharray="3 3" stroke="#eeeeee" vertical={false} />
                <XAxis dataKey="day" tick={{ fontSize:12, fill:TH_COLOR }} axisLine={false} tickLine={false} />
                <YAxis tick={{ fontSize:11, fill:TH_COLOR }} axisLine={false} tickLine={false}
                  tickFormatter={v => `${(v/1000).toFixed(0)}km`} />
                <RTooltip
                  formatter={(v, name) => {
                    if (name === 'targetMin' || name === 'Target band') return null;
                    return v != null ? [`${v.toLocaleString()}m`, name] : ['-', name];
                  }}
                  contentStyle={{ fontSize:12, borderRadius:4, border:`1px solid ${BORDER}` }} />
                <Legend
                  iconSize={10}
                  onClick={handleLegendClick}
                  wrapperStyle={{ fontSize:12, paddingTop:12, cursor:'pointer' }}
                  formatter={(value, entry) => {
                    if (value === 'targetMin') return null;
                    const isHidden = !!hidden[value];
                    return (
                      <span style={{ color: isHidden ? '#cfd8dc' : BODY_TEXT, textDecoration: isHidden ? 'line-through' : 'none' }}>
                        {value}
                      </span>
                    );
                  }}
                />
                <Area type="linear" dataKey="Target band" fill="#b2dfdb" stroke="none" fillOpacity={0.5} legendType="rect" tooltipType="none" isAnimationActive={false} hide={!!hidden['Target band']} />
                <Area type="linear" dataKey="targetMin" fill="#fff" stroke="none" fillOpacity={1} legendType="none" tooltipType="none" isAnimationActive={false} hide={!!hidden['Target band']} />
                <Line type="monotone" dataKey="Cumulative load"
                  stroke={TAB_BLUE} strokeWidth={2}
                  dot={{ r:4, fill:TAB_BLUE, strokeWidth:0 }}
                  hide={!!hidden['Cumulative load']} connectNulls={false} />
                <Line type="monotone" dataKey="Daily load"
                  stroke="#26C6DA" strokeWidth={2} strokeDasharray="4 3"
                  dot={{ r:3, fill:'#26C6DA', strokeWidth:0 }}
                  hide={!!hidden['Daily load']} connectNulls={false} />
              </ComposedChart>
            </ResponsiveContainer>
            </div>
          </DialogContent>
          <DialogActions sx={{ px:3, pb:3, pt:0, justifyContent:'flex-end' }}>
            <Button onClick={onClose} variant="contained"
              sx={{ textTransform:'none', fontSize:13, bgcolor:TAB_BLUE, px:2.5, py:.75,
                borderRadius:'4px', boxShadow:'none',
                '&:hover':{ bgcolor:'#2d3a4e', boxShadow:'none' } }}>
              Close
            </Button>
          </DialogActions>
        </Dialog>
      );
    }

    // ── GD BAR ────────────────────────────────────────────────────────────────────
    // Red stripe at TOP = over target (proportional to overage)
    // Purple stripe at BOTTOM = under target (proportional to shortfall)
    // All dark navy = on target | Light grey = future day
    const GD_PURPLE = '#7b1fa2';
    function GdBar({ gd, metric = 'distance' }) {
      const { t, d, f = 0, a, tgt } = gd;
      const isFuture  = t === 'future';
      const isOver    = t === 'over';
      const isUnder   = t === 'under';
      const isTarget  = t === 'target';
      const BAR_H     = 42;
      const stripeH   = Math.max(2, Math.round(f * BAR_H));
      const stripePattern = `repeating-linear-gradient(-45deg, #2d3a4e 0px, #2d3a4e 3px, #3d4e64 3px, #3d4e64 6px)`;
      const barBg     = isFuture ? GD_FUTURE : isTarget ? TEAL_NUM : stripePattern;
      const deltaColor = isOver ? GD_RED : isTarget ? TEAL_NUM : isUnder ? GD_PURPLE : BODY_LIGHT;

      const cfg = METRIC_CONFIG[metric] || METRIC_CONFIG.distance;
      const fmtVal = v => v != null ? `${metricVal(v, metric).toLocaleString()}${cfg.unit}` : null;

      const tipContent = isFuture
        ? (tgt ? `Target: ${fmtVal(tgt)}` : '')
        : (a != null && tgt != null)
          ? `${fmtVal(a)} / ${fmtVal(tgt)}`
          : '';

      const bar = (
        <div style={{ display:'flex', flexDirection:'column', alignItems:'center', width:44, cursor: tipContent ? 'default' : undefined }}>
          <div style={{ width:44, height:BAR_H, background:barBg, position:'relative', borderRadius:'1px' }}>
            {isOver && <div style={{ position:'absolute', top:0, left:0, width:44, height:stripeH, background:GD_RED, borderRadius:'1px 1px 0 0' }} />}
            {isUnder && <div style={{ position:'absolute', top:0, left:0, width:44, height:stripeH, background:GD_PURPLE, borderRadius:'1px 1px 0 0' }} />}
          </div>
          <span style={{ fontSize:'8px', color:deltaColor, lineHeight:'1', marginTop:'3px', whiteSpace:'nowrap' }}>{d || '\u00A0'}</span>
        </div>
      );

      return tipContent
        ? <Tooltip title={tipContent} arrow placement="top"><span>{bar}</span></Tooltip>
        : bar;
    }

    // ── CHIPS ─────────────────────────────────────────────────────────────────────
    function GroupChip({ label }) {
      return (
        <span style={{
          background:CHIP_BG, color:CHIP_TXT,
          fontSize:12, padding:'2px 10px',
          borderRadius:16, display:'inline-block',
          whiteSpace:'nowrap', lineHeight:'20px',
        }}>{label}</span>
      );
    }

    function RiskBadge({ risk }) {
      const bg = risk === 'High' ? RISK_RED : risk === 'Medium' ? '#e65100' : TEAL_NUM;
      return (
        <span style={{
          background:bg, color:'#fff',
          fontSize:12, fontWeight:600, padding:'4px 14px',
          borderRadius:20, display:'inline-block', whiteSpace:'nowrap',
        }}>{risk}</span>
      );
    }

    // ── SUMMARY CARDS ─────────────────────────────────────────────────────────────
    function SummaryCard({ count, label, color, active, onClick }) {
      return (
        <div onClick={onClick} style={{
          width:216, minHeight:127, background:'#fff',
          border:`1px solid ${active ? color : BORDER}`,
          borderRadius:4, padding:'12px 16px 14px',
          cursor:'pointer', position:'relative',
          boxShadow: active ? `0 0 0 1px ${color}` : '0 1px 3px rgba(0,0,0,.06)',
          transition:'box-shadow .15s, border-color .15s',
        }}>
          {active && (
            <span className="material-icons-outlined" style={{ position:'absolute', top:12, right:12, fontSize:18, color }}>filter_list</span>
          )}
          <div style={{ fontSize:80, fontWeight:700, lineHeight:1, color, marginBottom:4 }}>{count}</div>
          <div style={{ fontSize:13, color:BODY_LIGHT }}>{label}</div>
        </div>
      );
    }

    // ── TABLE STYLES ──────────────────────────────────────────────────────────────
    const TH = {
      fontSize:13, fontWeight:500, color:BODY_TEXT,
      padding:'10px 12px',
      borderBottom:`1px solid ${BORDER}`,
      whiteSpace:'nowrap', background:'#fff', textAlign:'left',
    };
    const TD = {
      fontSize:13, color:BODY_TEXT,
      padding:'0 12px',
      borderBottom:`1px solid ${BORDER}`,
      verticalAlign:'middle',
    };
    const TD_GD = { ...TD, padding:'8px 4px', textAlign:'center' };

    // ── SORT HELPERS ──────────────────────────────────────────────────────────────
    function SortArrow({ col, sortCol, sortDir }) {
      if (sortCol !== col) return <span style={{ fontSize:12, color:'#cfd8dc', marginLeft:3 }}>↕</span>;
      return <span style={{ fontSize:12, color:TAB_BLUE, marginLeft:3 }}>{sortDir === 'asc' ? '↑' : '↓'}</span>;
    }

    function useSortedRows(rows, sortCol, sortDir, getVal) {
      return useMemo(() => {
        if (!sortCol) return rows;
        return [...rows].sort((a, b) => {
          const av = getVal(a, sortCol);
          const bv = getVal(b, sortCol);
          if (av == null) return 1;
          if (bv == null) return -1;
          const cmp = typeof av === 'string' ? av.localeCompare(bv) : av - bv;
          return sortDir === 'asc' ? cmp : -cmp;
        });
      }, [rows, sortCol, sortDir]);
    }

    // ── INDIVIDUALS TABLE ─────────────────────────────────────────────────────────
    function IndividualsTable({ rows, metric, targetKm = [10, 20], gdDays = GW_DAYS.default, scrolled = false }) {
      const [sortCol, setSortCol] = useState(null);
      const [sortDir, setSortDir] = useState('asc');
      const [selectedSubject, setSelectedSubject] = useState(null);

      function handleSort(col) {
        if (sortCol === col) setSortDir(d => d === 'asc' ? 'desc' : 'asc');
        else { setSortCol(col); setSortDir('asc'); }
      }

      function getVal(p, col) {
        const map = {
          name: p.name, group: p.group, todayM: p.todayM,
          weekToDate: p.weekToDate, rolling7: p.rolling7,
          acwr: p.acwr, targetTomorrow: p.targetTomorrow, risk: p.risk,
        };
        return map[col] ?? null;
      }

      const sorted = useSortedRows(rows, sortCol, sortDir, getVal);

      function thSort(col, label, style = {}) {
        return (
          <th className="sortable" onClick={() => handleSort(col)} style={{ ...TH, ...style }}>
            {label}<SortArrow col={col} sortCol={sortCol} sortDir={sortDir} />
          </th>
        );
      }

      const gdThStyle    = { ...TH, width:52, textAlign:'center', padding:'10px 4px' };
      const todayThStyle = { ...TH, width:52, textAlign:'center', padding:'10px 4px', fontWeight:600, color:BODY_TEXT, borderTop:`2px solid ${BODY_TEXT}` };
      const gdRegStyle   = { ...TH, width:52, textAlign:'center', padding:'10px 4px' };

      const theadStyle = { position:'sticky', top:0, zIndex:2, background:'#fff', boxShadow: scrolled ? '0 4px 8px rgba(0,0,0,0.15)' : 'none' };

      const trainingDays = Math.max(1, gdDays.filter(d => d !== 'GD').length);
      const todayTargetMin = (targetKm[0] * 1000) / trainingDays;
      const todayTargetMax = (targetKm[1] * 1000) / trainingDays;

      return (
        <>
        <table style={{ borderCollapse:'separate', borderSpacing:0, width:'100%', minWidth:1060 }}>
            <thead style={theadStyle}>
              <tr>
                {thSort('name',       'Athlete', { paddingLeft:24 })}
                {thSort('group',      'Group')}
                {thSort('todayM',     METRIC_CONFIG[metric]?.col || 'Today')}
                {thSort('weekToDate', 'Week to date')}
                {thSort('rolling7',   '7 day rolling avg.')}
                {thSort('acwr',       'ACWR')}
                {gdDays.map((day, di) => {
                  const isGD = day === 'GD';
                  const isPrev = di === gdDays.length - 2;
                  return <th key={day} style={isGD ? todayThStyle : isPrev ? gdRegStyle : gdThStyle}>{day}</th>;
                })}
                {thSort('targetTomorrow','Target tomorrow')}
                {thSort('risk',          'Injury risk', { paddingRight:24 })}
              </tr>
            </thead>
            <tbody>
              {(() => {
                const n = sorted.length || 1;
                const avg = {
                  todayM:        Math.round(sorted.reduce((s,p) => s + p.todayM,        0) / n),
                  weekToDate:    Math.round(sorted.reduce((s,p) => s + p.weekToDate,    0) / n),
                  rolling7:      Math.round(sorted.reduce((s,p) => s + p.rolling7,      0) / n),
                  rolling7Prev:  Math.round(sorted.reduce((s,p) => s + (p.rolling7Prev||p.rolling7), 0) / n),
                  acwr:          Math.round(sorted.reduce((s,p) => s + p.acwr,          0) / n * 10) / 10,
                  targetTomorrow:Math.round(sorted.reduce((s,p) => s + p.targetTomorrow,0) / n),
                };
                const AVG_BG = '#f0f4f8';
                const avgTD = { ...TD, background:AVG_BG, borderBottom:`1px solid ${BORDER}` };
                return (
                  <tr style={{ background:AVG_BG }}>
                    <td style={{ ...avgTD, paddingLeft:24 }}>
                      <div style={{ padding:'10px 0 8px' }}>
                        <div style={{ fontWeight:600, fontSize:12, color:TH_COLOR, textTransform:'uppercase', letterSpacing:'0.04em' }}>Squad avg</div>
                      </div>
                    </td>
                    <td style={avgTD} />
                    <td style={avgTD}>{metricFmt(metricVal(avg.todayM, metric), metric)}</td>
                    <td style={avgTD}>{metricFmt(metricVal(avg.weekToDate, metric), metric)}</td>
                    <td style={avgTD}>
                      <div style={{ display:'flex', alignItems:'center' }}>
                        {metricFmt(metricVal(avg.rolling7, metric), metric)}
                        <TrendArrow current={avg.rolling7} prev={avg.rolling7Prev} />
                      </div>
                    </td>
                    <td style={avgTD}>
                      <span style={{ fontWeight:600, color:acwrColor(avg.acwr) }}>{avg.acwr}</span>
                    </td>
                    {gdDays.map((_, di) => <td key={di} style={{ ...avgTD, padding:'8px 4px', textAlign:'center' }} />)}
                    <td style={avgTD}>{metricFmt(metricVal(avg.targetTomorrow, metric), metric)}</td>
                    <td style={{ ...avgTD, paddingRight:24 }} />
                  </tr>
                );
              })()}
              {sorted.map((p) => {
                const visibleGd = p.gdData.slice(-gdDays.length);
                const todayOver  = metric === 'distance' ? Math.max(0, p.todayM - todayTargetMax) : 0;
                const todayUnder = metric === 'distance' ? Math.max(0, todayTargetMin - p.todayM)  : 0;
                return (
                <tr key={p.id} className="data-row" onClick={() => setSelectedSubject(p)} style={{ cursor:'pointer' }}>
                  <td style={{ ...TD, paddingLeft:24 }}>
                    <div style={{ padding:'12px 0 10px' }}>
                      <div style={{ fontWeight:500, fontSize:13 }}>{p.name}</div>
                      <div style={{ fontSize:11, color:BODY_LIGHT }}>{p.pos}</div>
                    </div>
                  </td>
                  <td style={TD}><GroupChip label={p.group} /></td>
                  <td style={TD}>
                    <div>{metricFmt(metricVal(p.todayM, metric), metric)}</div>
                    {metric === 'distance' && todayOver  > 0 && <div style={{ fontSize:11, color:GD_RED    }}>({todayOver.toLocaleString()} over)</div>}
                    {metric === 'distance' && todayUnder > 0 && <div style={{ fontSize:11, color:GD_PURPLE }}>({todayUnder.toLocaleString()} under)</div>}
                    {metric === 'distance' && todayOver === 0 && todayUnder === 0 && <div style={{ fontSize:11, color:TEAL_NUM }}>(On target)</div>}
                  </td>
                  <td style={TD}>
                    <div>{metricFmt(metricVal(p.weekToDate, metric), metric)}</div>
                    {metric === 'distance' && p.weekOver  > 0 && <div style={{ fontSize:11, color:GD_RED    }}>({p.weekOver.toLocaleString()} over)</div>}
                    {metric === 'distance' && p.weekUnder > 0 && <div style={{ fontSize:11, color:GD_PURPLE }}>({p.weekUnder.toLocaleString()} under)</div>}
                    {metric === 'distance' && p.weekOver === 0 && p.weekUnder === 0 && <div style={{ fontSize:11, color:TEAL_NUM }}>(On target)</div>}
                  </td>
                  <td style={TD}>
                    <div style={{ display:'flex', alignItems:'center' }}>
                      {metricFmt(metricVal(p.rolling7, metric), metric)}
                      <TrendArrow current={p.rolling7} prev={p.rolling7Prev} />
                    </div>
                  </td>
                  <td style={TD}>
                    <span style={{ fontWeight:600, color:acwrColor(p.acwr) }}>{p.acwr}</span>
                  </td>
                  {visibleGd.map((gd, di) => (
                    <td key={di} style={TD_GD}><GdBar gd={gd} metric={metric} /></td>
                  ))}
                  <td style={TD}>{metricFmt(metricVal(p.targetTomorrow, metric), metric)}</td>
                  <td style={{ ...TD, paddingRight:24 }}><RiskBadge risk={p.risk} /></td>
                </tr>
                );
              })}
            </tbody>
          </table>
        <LoadModal subject={selectedSubject} onClose={() => setSelectedSubject(null)} targetKm={targetKm} gdDays={gdDays} />
        </>
      );
    }

    // ── GROUPS TABLE ──────────────────────────────────────────────────────────────
    function GroupsTable({ rows, metric, targetKm = [10, 20], gdDays = GW_DAYS.default, scrolled = false }) {
      const [sortCol, setSortCol] = useState(null);
      const [sortDir, setSortDir] = useState('asc');
      const [selectedSubject, setSelectedSubject] = useState(null);

      function handleSort(col) {
        if (sortCol === col) setSortDir(d => d === 'asc' ? 'desc' : 'asc');
        else { setSortCol(col); setSortDir('asc'); }
      }

      function getVal(g, col) {
        const map = {
          group: g.group, todayM: g.todayM, weekToDate: g.weekToDate,
          rolling7: g.rolling7, acwr: g.acwr,
          targetTomorrow: g.targetTomorrow, risk: g.risk,
        };
        return map[col] ?? null;
      }

      const sorted = useSortedRows(rows, sortCol, sortDir, getVal);

      function thSort(col, label, style = {}) {
        return (
          <th className="sortable" onClick={() => handleSort(col)} style={{ ...TH, ...style }}>
            {label}<SortArrow col={col} sortCol={sortCol} sortDir={sortDir} />
          </th>
        );
      }

      const gdThStyle    = { ...TH, width:52, textAlign:'center', padding:'10px 4px' };
      const todayThStyle = { ...TH, width:52, textAlign:'center', padding:'10px 4px', fontWeight:600, color:BODY_TEXT, borderTop:`2px solid ${BODY_TEXT}` };
      const gdRegStyle   = { ...TH, width:52, textAlign:'center', padding:'10px 4px' };

      const theadStyle = { position:'sticky', top:0, zIndex:2, background:'#fff', boxShadow: scrolled ? '0 4px 8px rgba(0,0,0,0.15)' : 'none' };

      return (
        <>
        <table style={{ borderCollapse:'separate', borderSpacing:0, width:'100%', minWidth:1000 }}>
            <thead style={theadStyle}>
              <tr>
                {thSort('group',      'Group', { paddingLeft:24 })}
                {thSort('todayM',     METRIC_CONFIG[metric]?.col || 'Today')}
                {thSort('weekToDate', 'Week to date')}
                {thSort('rolling7',   '7 day rolling avg.')}
                {thSort('acwr',       'ACWR')}
                {gdDays.map((day, di) => {
                  const isGD = day === 'GD';
                  const isPrev = di === gdDays.length - 2;
                  return <th key={day} style={isGD ? todayThStyle : isPrev ? gdRegStyle : gdThStyle}>{day}</th>;
                })}
                {thSort('targetTomorrow','Target tomorrow')}
                {thSort('risk',          'Injury risk', { paddingRight:24 })}
              </tr>
            </thead>
            <tbody>
              {sorted.map((g) => {
                const visibleGd = g.gdData.slice(-gdDays.length);
                const gTrainingDays = Math.max(1, gdDays.filter(d => d !== 'GD').length);
                const gDayMax = (targetKm[1]*1000) / gTrainingDays;
                const gDayMin = (targetKm[0]*1000) / gTrainingDays;
                const todayOver  = metric === 'distance' ? Math.max(0, g.todayM - gDayMax) : 0;
                const todayUnder = metric === 'distance' ? Math.max(0, gDayMin - g.todayM)  : 0;
                return (
                <tr key={g.group} className="data-row" onClick={() => setSelectedSubject(g)} style={{ cursor:'pointer' }}>
                  <td style={{ ...TD, paddingLeft:24 }}><GroupChip label={g.group} /></td>
                  <td style={TD}>
                    <div>{metricFmt(metricVal(g.todayM, metric), metric)}</div>
                    {metric === 'distance' && todayOver  > 0 && <div style={{ fontSize:11, color:GD_RED    }}>({todayOver.toLocaleString()} over)</div>}
                    {metric === 'distance' && todayUnder > 0 && <div style={{ fontSize:11, color:GD_PURPLE }}>({todayUnder.toLocaleString()} under)</div>}
                    {metric === 'distance' && todayOver === 0 && todayUnder === 0 && <div style={{ fontSize:11, color:TEAL_NUM }}>(On target)</div>}
                  </td>
                  <td style={TD}>
                    <div>{metricFmt(metricVal(g.weekToDate, metric), metric)}</div>
                    {metric === 'distance' && g.weekOver  > 0 && <div style={{ fontSize:11, color:GD_RED    }}>({g.weekOver.toLocaleString()} over)</div>}
                    {metric === 'distance' && g.weekUnder > 0 && <div style={{ fontSize:11, color:GD_PURPLE }}>({g.weekUnder.toLocaleString()} under)</div>}
                    {metric === 'distance' && g.weekOver === 0 && g.weekUnder === 0 && <div style={{ fontSize:11, color:TEAL_NUM }}>(On target)</div>}
                  </td>
                  <td style={TD}>{metricFmt(metricVal(g.rolling7, metric), metric)}</td>
                  <td style={TD}>{g.acwr}</td>
                  {visibleGd.map((gd, di) => (
                    <td key={di} style={TD_GD}><GdBar gd={gd} metric={metric} /></td>
                  ))}
                  <td style={TD}>{metricFmt(metricVal(g.targetTomorrow, metric), metric)}</td>
                  <td style={{ ...TD, paddingRight:24 }}><RiskBadge risk={g.risk} /></td>
                </tr>
                );
              })}
            </tbody>
          </table>
        <LoadModal subject={selectedSubject} onClose={() => setSelectedSubject(null)} targetKm={targetKm} gdDays={gdDays} />
        </>
      );
    }

    // ── CUSTOM TICK ───────────────────────────────────────────────────────────────
    function CustomXAxisTick({ x, y, payload }) {
      const lines = payload.value.split('\n');
      return (
        <g transform={`translate(${x},${y})`}>
          {lines.map((line, i) => (
            <text key={i} x={0} y={0} dy={14 + i*14} textAnchor="middle" fill="#78909c" fontSize={11}>{line}</text>
          ))}
        </g>
      );
    }

    // ── TARGET MODAL ──────────────────────────────────────────────────────────────
    const DAYS_OF_WEEK = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];

    function TargetModal({ open, onClose, targetKm, onTargetChange, metric = 'distance' }) {
      const [workloadMode, setWorkloadMode] = useState('equal');
      const [checked, setChecked] = useState({Mon:true,Tue:false,Wed:true,Thu:true,Fri:true,Sat:false,Sun:false});
      const [manual, setManual] = useState({Mon:'10000',Tue:'10000',Wed:'10000',Thu:'10000',Fri:'10000',Sat:'10000',Sun:'10000'});

      const sliderCfg = METRIC_SLIDER_CONFIG[metric] || METRIC_SLIDER_CONFIG.distance;
      const metricLabel = METRIC_CONFIG[metric]?.label || 'Total distance';
      const valLabel = sliderCfg.unit
        ? `${targetKm[0]}–${targetKm[1]} ${sliderCfg.unit}`
        : `${targetKm[0]}–${targetKm[1]}`;

      return (
        <Dialog open={open} onClose={onClose} maxWidth="xs" fullWidth
          PaperProps={{ elevation:4, sx:{ borderRadius:'4px', m:2 } }}>
          <DialogTitle sx={{ fontSize:20, fontWeight:700, pb:1, pt:3, px:3, color:'#212121' }}>
            Set gameweek target
          </DialogTitle>
          <DialogContent sx={{ px:3, pt:1, pb:0 }}>

            {/* Slider */}
            <div style={{ marginBottom:24 }}>
              <div style={{ display:'flex', justifyContent:'space-between', alignItems:'baseline', marginBottom:4 }}>
                <span style={{ fontSize:13, color:'#78909c' }}>{metricLabel}</span>
                <span style={{ fontSize:16, fontWeight:600, color:'#212121' }}>{valLabel}</span>
              </div>
              <Slider
                value={targetKm}
                min={sliderCfg.min} max={sliderCfg.max} step={sliderCfg.step} marks
                onChange={(_, v) => onTargetChange(v)}
                sx={{
                  color: TAB_BLUE,
                  height:4,
                  '& .MuiSlider-thumb':{ width:16, height:16 },
                  '& .MuiSlider-rail':{ opacity:.3 },
                }}
              />
              <div style={{ display:'flex', justifyContent:'space-between', marginTop:-4 }}>
                <span style={{ fontSize:11, color:'#90a4ae' }}>{sliderCfg.min}{sliderCfg.unit ? ' '+sliderCfg.unit : ''}</span>
                <span style={{ fontSize:11, color:'#90a4ae' }}>{sliderCfg.max}{sliderCfg.unit ? ' '+sliderCfg.unit : ''}</span>
              </div>
            </div>

            <div style={{ fontSize:14, fontWeight:500, color:'#212121', marginBottom:10 }}>Workload</div>
            <div style={{ display:'flex', flexDirection:'column', gap:8 }}>
              {[
                { v:'equal',  l:'Apply equal to all training days' },
                { v:'manual', l:'Set each manually' },
              ].map(({ v, l }) => (
                <label key={v} style={{ display:'flex', alignItems:'center', gap:8, cursor:'pointer' }}>
                  <input
                    type="radio"
                    name="workloadMode"
                    value={v}
                    checked={workloadMode === v}
                    onChange={() => setWorkloadMode(v)}
                    style={{ accentColor: TAB_BLUE, width:16, height:16, cursor:'pointer', flexShrink:0 }}
                  />
                  <span style={{ fontSize:14, color:'#37474f' }}>{l}</span>
                </label>
              ))}
            </div>

            <div style={{ fontSize:14, fontWeight:500, color:'#212121', marginTop:16, marginBottom:10 }}>
              Select training days
            </div>
            <div style={{ display:'flex', gap:8, marginBottom:4 }}>
              {DAYS_OF_WEEK.map(d => (
                <div key={d} style={{ display:'flex', flexDirection:'column', alignItems:'center', gap:4, flex:1 }}>
                  <span style={{ fontSize:12, color:'#546e7a', fontWeight:400 }}>{d}</span>
                  <Checkbox
                    checked={!!checked[d]}
                    onChange={() => setChecked(prev => ({ ...prev, [d]:!prev[d] }))}
                    size="small"
                    sx={{
                      p:0,
                      color: checked[d] ? TAB_BLUE : '#cfd8dc',
                      '&.Mui-checked':{ color:TAB_BLUE },
                      '& .MuiSvgIcon-root':{ fontSize:20 },
                    }}
                  />
                  {workloadMode === 'manual' && (
                    <input
                      type="number"
                      value={checked[d] ? manual[d] : ''}
                      disabled={!checked[d]}
                      onChange={e => setManual(prev => ({ ...prev, [d]:e.target.value }))}
                      style={{
                        width:'100%', fontSize:12, textAlign:'center',
                        padding:'4px 2px', borderRadius:3,
                        border:`1px solid ${checked[d] ? TAB_BLUE : '#e0e3e7'}`,
                        background: checked[d] ? '#fff' : '#f5f5f5',
                        color: checked[d] ? '#37474f' : '#bdbdbd',
                        outline:'none', boxSizing:'border-box',
                      }}
                    />
                  )}
                </div>
              ))}
            </div>

          </DialogContent>
          <DialogActions sx={{ px:3, pb:3, pt:2, justifyContent:'flex-end', gap:.5 }}>
            <Button onClick={onClose} variant="text"
              sx={{ textTransform:'none', fontSize:13, color:'#546e7a', px:2, py:.75, minWidth:0 }}>
              Cancel
            </Button>
            <Button onClick={onClose} variant="contained"
              sx={{ textTransform:'none', fontSize:13, bgcolor:TAB_BLUE, px:2.5, py:.75,
                borderRadius:'4px', boxShadow:'none',
                '&:hover':{ bgcolor:'#2d3a4e', boxShadow:'none' } }}>
              Done
            </Button>
          </DialogActions>
        </Dialog>
      );
    }

    // ── REHAB TARGET MODAL ────────────────────────────────────────────────────────
    function RehabModal({ open, onClose, metric = 'distance', onSaveName }) {
      const [workloadMode, setWorkloadMode] = useState('equal');
      const [checked, setChecked] = useState({Mon:true,Tue:false,Wed:true,Thu:true,Fri:true,Sat:false,Sun:false});
      const [manual, setManual] = useState({Mon:'4000',Tue:'4000',Wed:'4000',Thu:'4000',Fri:'4000',Sat:'4000',Sun:'4000'});
      const baseCfg = METRIC_SLIDER_CONFIG[metric] || METRIC_SLIDER_CONFIG.distance;
      const rehabMax = Math.round(baseCfg.max / 2);
      const rehabDflt = [baseCfg.dflt[0] / 2, baseCfg.dflt[1] / 2];
      const [sliderVal, setSliderVal] = useState(rehabDflt);
      const [targetName, setTargetName] = useState('Rehab target');
      const [selectedGroups, setSelectedGroups] = useState(['Rehab']);
      const metricLabel = METRIC_CONFIG[metric]?.label || 'Total distance';
      const valLabel = baseCfg.unit
        ? `${sliderVal[0]}–${sliderVal[1]} ${baseCfg.unit}`
        : `${sliderVal[0]}–${sliderVal[1]}`;

      function toggleGroup(g) {
        setSelectedGroups(prev =>
          prev.includes(g) ? prev.filter(x => x !== g) : [...prev, g]
        );
      }

      function handleDone() {
        if (onSaveName) onSaveName(targetName);
        onClose();
      }

      return (
        <Dialog open={open} onClose={onClose} maxWidth="xs" fullWidth
          PaperProps={{ elevation:4, sx:{ borderRadius:'4px', m:2 } }}>
          <DialogTitle sx={{ fontSize:20, fontWeight:700, pb:1, pt:3, px:3, color:'#212121' }}>
            Set additional target
          </DialogTitle>
          <DialogContent sx={{ px:3, pt:1, pb:0 }}>

            {/* Target name */}
            <div style={{ marginBottom:20 }}>
              <div style={{ fontSize:13, color:'#78909c', marginBottom:4 }}>Target name</div>
              <input
                type="text"
                value={targetName}
                onChange={e => setTargetName(e.target.value)}
                style={{
                  width:'100%', fontSize:14, padding:'8px 10px', borderRadius:4,
                  border:`1px solid #cfd8dc`, outline:'none', color:'#212121',
                  boxSizing:'border-box',
                }}
              />
            </div>

            {/* Group selector */}
            <div style={{ marginBottom:20 }}>
              <div style={{ fontSize:13, color:'#78909c', marginBottom:8 }}>Applies to groups</div>
              <div style={{ display:'flex', flexWrap:'wrap', gap:8 }}>
                {GROUPS.map(g => {
                  const active = selectedGroups.includes(g);
                  return (
                    <button key={g} onClick={() => toggleGroup(g)} style={{
                      fontSize:12, padding:'5px 12px', borderRadius:20, cursor:'pointer',
                      border:`1px solid ${active ? TAB_BLUE : '#cfd8dc'}`,
                      background: active ? TAB_BLUE : '#fff',
                      color: active ? '#fff' : '#546e7a',
                      fontWeight: active ? 600 : 400,
                      transition:'all 0.15s',
                    }}>{g}</button>
                  );
                })}
              </div>
            </div>

            <div style={{ marginBottom:24 }}>
              <div style={{ display:'flex', justifyContent:'space-between', alignItems:'baseline', marginBottom:4 }}>
                <span style={{ fontSize:13, color:'#78909c' }}>{metricLabel}</span>
                <span style={{ fontSize:16, fontWeight:600, color:'#212121' }}>{valLabel}</span>
              </div>
              <Slider
                value={sliderVal}
                min={0} max={rehabMax} step={baseCfg.step} marks
                onChange={(_, v) => setSliderVal(v)}
                sx={{
                  color: TAB_BLUE,
                  height:4,
                  '& .MuiSlider-thumb':{ width:16, height:16 },
                  '& .MuiSlider-rail':{ opacity:.3 },
                }}
              />
              <div style={{ display:'flex', justifyContent:'space-between', marginTop:-4 }}>
                <span style={{ fontSize:11, color:'#90a4ae' }}>0{baseCfg.unit ? ' '+baseCfg.unit : ''}</span>
                <span style={{ fontSize:11, color:'#90a4ae' }}>{rehabMax}{baseCfg.unit ? ' '+baseCfg.unit : ''}</span>
              </div>
            </div>

            <div style={{ fontSize:14, fontWeight:500, color:'#212121', marginBottom:10 }}>Workload</div>
            <div style={{ display:'flex', flexDirection:'column', gap:8 }}>
              {[
                { v:'equal',  l:'Apply equal to all training days' },
                { v:'manual', l:'Set each manually' },
              ].map(({ v, l }) => (
                <label key={v} style={{ display:'flex', alignItems:'center', gap:8, cursor:'pointer' }}>
                  <input
                    type="radio"
                    name="rehabWorkloadMode"
                    value={v}
                    checked={workloadMode === v}
                    onChange={() => setWorkloadMode(v)}
                    style={{ accentColor: TAB_BLUE, width:16, height:16, cursor:'pointer', flexShrink:0 }}
                  />
                  <span style={{ fontSize:14, color:'#37474f' }}>{l}</span>
                </label>
              ))}
            </div>

            <div style={{ fontSize:14, fontWeight:500, color:'#212121', marginTop:16, marginBottom:10 }}>
              Select training days
            </div>
            <div style={{ display:'flex', gap:8, marginBottom:4 }}>
              {DAYS_OF_WEEK.map(d => (
                <div key={d} style={{ display:'flex', flexDirection:'column', alignItems:'center', gap:4, flex:1 }}>
                  <span style={{ fontSize:12, color:'#546e7a', fontWeight:400 }}>{d}</span>
                  <Checkbox
                    checked={!!checked[d]}
                    onChange={() => setChecked(prev => ({ ...prev, [d]:!prev[d] }))}
                    size="small"
                    sx={{
                      p:0,
                      color: checked[d] ? TAB_BLUE : '#cfd8dc',
                      '&.Mui-checked':{ color:TAB_BLUE },
                      '& .MuiSvgIcon-root':{ fontSize:20 },
                    }}
                  />
                  {workloadMode === 'manual' && (
                    <input
                      type="number"
                      value={checked[d] ? manual[d] : ''}
                      disabled={!checked[d]}
                      onChange={e => setManual(prev => ({ ...prev, [d]:e.target.value }))}
                      style={{
                        width:'100%', fontSize:12, textAlign:'center',
                        padding:'4px 2px', borderRadius:3,
                        border:`1px solid ${checked[d] ? TAB_BLUE : '#e0e3e7'}`,
                        background: checked[d] ? '#fff' : '#f5f5f5',
                        color: checked[d] ? '#37474f' : '#bdbdbd',
                        outline:'none', boxSizing:'border-box',
                      }}
                    />
                  )}
                </div>
              ))}
            </div>

          </DialogContent>
          <DialogActions sx={{ px:3, pb:3, pt:2, justifyContent:'space-between', gap:.5 }}>
            <Button onClick={onClose} variant="text"
              sx={{ textTransform:'none', fontSize:13, color:'#c62828', px:0, py:.75, minWidth:0,
                '&:hover':{ background:'none', textDecoration:'underline' } }}>
              Remove
            </Button>
            <div style={{ display:'flex', gap:4 }}>
            <Button onClick={onClose} variant="text"
              sx={{ textTransform:'none', fontSize:13, color:'#546e7a', px:2, py:.75, minWidth:0 }}>
              Cancel
            </Button>
            <Button onClick={handleDone} variant="contained"
              sx={{ textTransform:'none', fontSize:13, bgcolor:TAB_BLUE, px:2.5, py:.75,
                borderRadius:'4px', boxShadow:'none',
                '&:hover':{ bgcolor:'#2d3a4e', boxShadow:'none' } }}>
              Done
            </Button>
            </div>
          </DialogActions>
        </Dialog>
      );
    }

    // ── NAV ───────────────────────────────────────────────────────────────────────
    const NAV_ICONS = [
      { icon:'bar_chart',     label:'Analytics' },
      { icon:'description',   label:'Reports' },
      { icon:'person_outline',label:'Profile' },
      { icon:'calendar_today',label:'Planning', active:true },
    ];
    const NAV_ACTIVE_ACCENT = '#fdb632';

    function NavItem({ icon, label, active }) {
      return (
        <Tooltip title={label} placement="right">
          <div style={{
            width:60, height:32,
            display:'flex', alignItems:'center', justifyContent:'center',
            cursor:'pointer', position:'relative',
            background: active ? 'rgba(0,0,0,0.6)' : 'transparent',
            color: active ? '#fff' : 'rgba(255,255,255,0.6)',
            transition:'background 0.15s, color 0.15s',
          }}>
            {active && <div style={{ position:'absolute', left:0, top:0, bottom:0, width:6, background:NAV_ACTIVE_ACCENT, borderRadius:'0 1px 1px 0' }} />}
            <span className="material-icons" style={{ fontSize:20 }}>{icon}</span>
          </div>
        </Tooltip>
      );
    }

    function SideNav() {
      return (
        <div style={{
          width:60, flexShrink:0, background:'#071952',
          display:'flex', flexDirection:'column',
          alignItems:'center', paddingTop:10, paddingBottom:12,
          boxShadow:'0 4.8px 14.4px rgba(0,0,0,0.18), 0 25.6px 57.6px rgba(0,0,0,0.22)',
          position:'relative', zIndex:10,
        }}>
          {/* Logo */}
          <div style={{
            width:43, height:43, borderRadius:'50%', background:'#fff',
            display:'flex', alignItems:'center', justifyContent:'center',
            marginBottom:20, marginTop:2, flexShrink:0, overflow:'hidden',
          }}>
            <img src="Chelsea_FC.svg.png" alt="Chelsea FC" style={{ width:43, height:43, objectFit:'cover', borderRadius:'50%' }} />
          </div>
          {/* Main nav */}
          <div style={{ display:'flex', flexDirection:'column', alignItems:'center', gap:8, flex:1 }}>
            {NAV_ICONS.map((item, i) => (
              <NavItem key={i} icon={item.icon} label={item.label} active={!!item.active} />
            ))}
          </div>
          {/* Bottom */}
          <div style={{ display:'flex', flexDirection:'column', alignItems:'center', gap:8 }}>
            <NavItem icon="help_outline" label="Help" />
            <NavItem icon="chevron_right" label="Collapse" />
          </div>
        </div>
      );
    }

    // ── CONTROLS INPUT — grey bg, dark bottom border, top corners rounded ────────
    function CtrlInput({ label, value, icon = 'arrow_drop_down', onClick }) {
      return (
        <div onClick={onClick} style={{ cursor: onClick ? 'pointer' : 'default', minWidth:180 }}>
          <div style={{
            background:'#f5f5f5',
            borderRadius:'2px 2px 0 0',
            borderBottom:`1px solid ${BODY_TEXT}`,
            padding:'5px 10px 6px',
          }}>
            <div style={{ fontSize:10, color:BODY_TEXT, lineHeight:1, marginBottom:2 }}>{label}</div>
            <div style={{ display:'flex', alignItems:'center', gap:2 }}>
              <span style={{ fontSize:13, color:BODY_TEXT, flex:1 }}>{value}</span>
              <span className="material-icons" style={{ fontSize:18, color:BODY_TEXT }}>{icon}</span>
            </div>
          </div>
        </div>
      );
    }

    // ── APP ───────────────────────────────────────────────────────────────────────
    function App() {
      const [tab, setTab] = useState(0);
      const [scrolled, setScrolled] = useState(false);
      const [metric, setMetric] = useState('distance');
      const [filterStatus, setFilterStatus] = useState(null);
      const [modalOpen, setModalOpen] = useState(false);
      const [rehabModalOpen, setRehabModalOpen] = useState(false);
      const [rehabName, setRehabName] = useState('Rehab target');
      const [gameweek, setGameweek] = useState('IS7-Wolves');
      const [regularTarget, setRegularTarget] = useState([10, 20]);
      const gdDays = getGdDays(gameweek);

      function handleMetricChange(newMetric) {
        setMetric(newMetric);
        const cfg = METRIC_SLIDER_CONFIG[newMetric] || METRIC_SLIDER_CONFIG.distance;
        setRegularTarget(cfg.dflt);
      }

      const counts = useMemo(() => ({
        over:   PLAYERS.filter(p => p.status === 'over').length,
        target: PLAYERS.filter(p => p.status === 'target').length,
        under:  PLAYERS.filter(p => p.status === 'under').length,
      }), []);

      const filtered = useMemo(() => {
        if (!filterStatus) return PLAYERS;
        return PLAYERS.filter(p => p.status === filterStatus);
      }, [filterStatus]);

      return (
        <div style={{ display:'flex', height:'100vh', overflow:'hidden' }}>
          <SideNav />

          <div style={{ flex:1, display:'flex', flexDirection:'column', overflow:'hidden', minWidth:0 }}>

            {/* Top bar */}
            <div style={{ height:48, display:'flex', alignItems:'center', padding:'0 24px', borderBottom:`1px solid ${BORDER}`, flexShrink:0 }}>
              <span style={{ fontSize:13, color:TH_COLOR }}>Planning</span>
              <div style={{ flex:1 }} />
              <span style={{ fontSize:13, color:BODY_TEXT, marginRight:4 }}>Primary Squad</span>
              <span className="material-icons" style={{ fontSize:18, color:TH_COLOR }}>arrow_drop_down</span>
              <div style={{ width:32, height:32, borderRadius:16, background:'#cfd8dc', marginLeft:12, display:'flex', alignItems:'center', justifyContent:'center', overflow:'hidden' }}>
                <span className="material-icons" style={{ fontSize:18, color:'#546e7a' }}>person</span>
              </div>
            </div>

            {/* Page title row */}
            <div style={{ display:'flex', alignItems:'center', padding:'12px 24px', flexShrink:0 }}>
              <span style={{ fontSize:20, fontWeight:400, color:'#37474f', letterSpacing:'0.01em' }}>
                Workload tracking
              </span>
              <div style={{ flex:1 }} />
              <div style={{ position:'relative' }}>
                <select
                  value={metric}
                  onChange={e => handleMetricChange(e.target.value)}
                  style={{
                    appearance:'none', WebkitAppearance:'none',
                    background:'transparent',
                    border:'none',
                    padding:'5px 24px 6px 0',
                    fontSize:13, color:BODY_TEXT, cursor:'pointer',
                    outline:'none', minWidth:140,
                  }}>
                  <option value="distance">Total distance</option>
                  <option value="accels_dist">Accels distance</option>
                  <option value="accels_count">Accels count</option>
                  <option value="decels_dist">Decels distance</option>
                  <option value="decels_count">Decels count</option>
                  <option value="sprint_dist">Sprint distance</option>
                  <option value="hmld">HMLD</option>
                  <option value="hsr">High Speed running</option>
                  <option value="dist_per_min">Distance per minute</option>
                </select>
                <span className="material-icons" style={{ position:'absolute', right:6, top:'50%', transform:'translateY(-50%)', fontSize:18, color:BODY_TEXT, pointerEvents:'none' }}>arrow_drop_down</span>
              </div>
              <Tooltip title="Settings">
                <button style={{ marginLeft:8, background:'none', border:'none', cursor:'pointer', display:'flex', alignItems:'center', padding:6, borderRadius:4 }}>
                  <span className="material-icons-outlined" style={{ fontSize:20, color:TH_COLOR }}>settings</span>
                </button>
              </Tooltip>
            </div>

            {/* Controls row */}
            <div style={{ display:'flex', alignItems:'center', gap:16, padding:'10px 24px 8px', flexShrink:0 }}>
              <div style={{ minWidth:180 }}>
                <div style={{ background:'#f5f5f5', borderRadius:'2px 2px 0 0', borderBottom:`1px solid ${BODY_TEXT}`, padding:'5px 10px 6px' }}>
                  <div style={{ fontSize:10, color:BODY_TEXT, lineHeight:1, marginBottom:2 }}>Gameweek</div>
                  <div style={{ display:'flex', alignItems:'center', gap:2 }}>
                    <select
                      value={gameweek}
                      onChange={e => setGameweek(e.target.value)}
                      style={{ appearance:'none', WebkitAppearance:'none', background:'transparent', border:'none', fontSize:13, color:BODY_TEXT, cursor:'pointer', outline:'none', flex:1, padding:0 }}>
                      <option>IS1-Brentford</option>
                      <option>IS2-Leicester</option>
                      <option>IS3-Brighton</option>
                      <option>IS4-Everton</option>
                      <option>IS5-Fulham</option>
                      <option>IS6-Newcastle</option>
                      <option>IS7-Wolves</option>
                      <option>IS8-Chelsea</option>
                      <option>IS9-ManUtd</option>
                      <option>IS10-Arsenal</option>
                      <option>IS11-Liverpool</option>
                      <option>IS12-Spurs</option>
                      <option>IS13-West Ham</option>
                      <option>IS14-Aston Villa</option>
                      <option>IS15-Crystal Palace</option>
                      <option>IS16-Southampton</option>
                      <option>IS17-Bournemouth</option>
                      <option>IS18-Nottm Forest</option>
                      <option>IS19-ManCity</option>
                      <option>IS20-Sheffield Utd</option>
                      <option>IS21-Chelsea</option>
                      <option>IS22-Arsenal</option>
                      <option>IS23-Liverpool</option>
                      <option>IS24-Spurs</option>
                      <option>IS25-Newcastle</option>
                      <option>IS26-ManUtd</option>
                      <option>IS27-Brentford</option>
                      <option>IS28-Wolves</option>
                      <option>IS29-Brighton</option>
                      <option>IS30-Everton</option>
                      <option>IS31-Fulham</option>
                      <option>IS32-West Ham</option>
                      <option>IS33-Aston Villa</option>
                      <option>IS34-Crystal Palace</option>
                      <option>IS35-ManCity</option>
                      <option>IS36-Leicester</option>
                      <option>IS37-Southampton</option>
                      <option>IS38-Bournemouth</option>
                      <option>IS39-Nottm Forest</option>
                      <option>IS40-Arsenal</option>
                    </select>
                    <span className="material-icons" style={{ fontSize:18, color:BODY_TEXT, pointerEvents:'none' }}>calendar_today</span>
                  </div>
                </div>
              </div>
              <CtrlInput label="Gameweek target" value={(() => { const c = METRIC_SLIDER_CONFIG[metric] || METRIC_SLIDER_CONFIG.distance; return c.unit ? `${regularTarget[0]}–${regularTarget[1]} ${c.unit}` : `${regularTarget[0]}–${regularTarget[1]}`; })()} onClick={() => setModalOpen(true)} />
              <CtrlInput label={rehabName} value={(() => { const c = METRIC_SLIDER_CONFIG[metric] || METRIC_SLIDER_CONFIG.distance; const half = regularTarget.map(v => Math.round(v/2*10)/10); return c.unit ? `${half[0]}–${half[1]} ${c.unit}` : `${half[0]}–${half[1]}`; })()} onClick={() => setRehabModalOpen(true)} />
              <Tooltip title="Add target" placement="bottom">
                <button style={{ background:'none', border:'none', cursor:'pointer', padding:4, display:'flex', alignItems:'center' }}>
                  <span className="material-icons-outlined" style={{ fontSize:22, color:TH_COLOR }}>add</span>
                </button>
              </Tooltip>
            </div>

            {/* Tabs */}
            <div style={{ borderBottom:`1px solid ${BORDER}`, padding:'4px 24px 0', flexShrink:0 }}>
              <Tabs value={tab} onChange={(_, v) => setTab(v)} textColor="inherit" sx={{
                minHeight:40,
                '& .MuiTab-root':{ minHeight:40, textTransform:'none', fontSize:14, fontWeight:600, color:'#546E7A !important', padding:'6px 12px', marginRight:4 },
                '& .Mui-selected':{ color:`${TAB_BLUE} !important`, fontWeight:600 },
                '& .MuiTabs-indicator':{ background:TAB_BLUE, height:2 },
              }}>
                <Tab label="Individuals" />
                <Tab label="Groups" />
              </Tabs>
            </div>

            {/* Content — single overflow:auto container so position:sticky on <th> works */}
            <div style={{ flex:1, overflow:'hidden', display:'flex', flexDirection:'column' }}>

              {tab === 0 && (
                <div style={{ flex:1, overflow:'auto' }} onScroll={e => setScrolled(e.currentTarget.scrollTop > 10)}>
                  <div style={{ display:'flex', gap:16, padding:'24px 24px 16px' }}>
                    <SummaryCard count={counts.over}   label="Overtraining"  color={RED_NUM}    active={filterStatus==='over'}   onClick={() => setFilterStatus(f => f==='over'   ? null : 'over')} />
                    <SummaryCard count={counts.target} label="On target"     color={TEAL_NUM}   active={filterStatus==='target'} onClick={() => setFilterStatus(f => f==='target' ? null : 'target')} />
                    <SummaryCard count={counts.under}  label="Undertraining" color={PURPLE_NUM} active={filterStatus==='under'}  onClick={() => setFilterStatus(f => f==='under'  ? null : 'under')} />
                  </div>
                  <IndividualsTable rows={filtered} metric={metric} targetKm={regularTarget} gdDays={gdDays} scrolled={scrolled} />
                </div>
              )}

              {tab === 1 && (
                <div style={{ flex:1, overflow:'auto' }} onScroll={e => setScrolled(e.currentTarget.scrollTop > 10)}>
                  <div style={{ paddingTop:24 }}><GroupsTable rows={GROUP_ROWS} metric={metric} targetKm={regularTarget} gdDays={gdDays} scrolled={scrolled} /></div>
                  <div style={{ margin:'24px 24px', border:`1px solid ${BORDER}`, borderRadius:4, padding:'20px 24px 16px' }}>
                    <div style={{ fontSize:16, fontWeight:400, color:BODY_TEXT, marginBottom:16 }}>Group comparison — {METRIC_CONFIG[metric]?.label || 'Total distance'}</div>
                    <ResponsiveContainer width="100%" height={260}>
                      <BarChart
                        data={GROUP_ROWS.map(g => ({
                          name: g.group,
                          'This week':      Number(metricVal(g.thisWeek, metric)),
                          '3 week average': Number(metricVal(g.avg3wk,   metric)),
                        }))}
                        barCategoryGap="35%" barGap={3} margin={{ top:4, right:8, bottom:20, left:16 }}>
                        <CartesianGrid strokeDasharray="3 3" stroke="#eeeeee" vertical={false} />
                        <XAxis dataKey="name" tick={<CustomXAxisTick />} axisLine={false} tickLine={false} height={40} />
                        <YAxis tick={{ fontSize:11, fill:TH_COLOR }} axisLine={false} tickLine={false}
                          label={{ value: METRIC_CONFIG[metric]?.unit ?? 'm', angle:-90, position:'insideLeft', dx:-8, style:{ fontSize:11, fill:TH_COLOR } }} />
                        <RTooltip cursor={{ fill:'transparent' }} contentStyle={{ fontSize:12, borderRadius:4, border:`1px solid ${BORDER}` }} />
                        <Legend iconType="square" iconSize={12} wrapperStyle={{ fontSize:12, color:TH_COLOR, paddingTop:8 }} />
                        <Bar dataKey="This week"      fill="#26C6DA" radius={[2,2,0,0]} label={{ position:'top', fontSize:11, fontWeight:600, fill:'#26C6DA' }} />
                        <Bar dataKey="3 week average" fill="#7c3aed" radius={[2,2,0,0]} label={{ position:'top', fontSize:11, fontWeight:600, fill:'#7c3aed' }} />
                      </BarChart>
                    </ResponsiveContainer>
                  </div>
                </div>
              )}
            </div>
          </div>

          <TargetModal open={modalOpen} onClose={() => setModalOpen(false)} targetKm={regularTarget} onTargetChange={setRegularTarget} metric={metric} />
          <RehabModal open={rehabModalOpen} onClose={() => setRehabModalOpen(false)} metric={metric} onSaveName={setRehabName} />
        </div>
      );
    }

    createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
