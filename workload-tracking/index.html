<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Workload Tracking</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons|Material+Icons+Outlined" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body, #root { height: 100%; }
    body { font-family: 'Roboto', sans-serif; background: #fff; color: #37474f; -webkit-font-smoothing: antialiased; }
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #cfd8dc; border-radius: 2px; }
    th.sortable { cursor: pointer; user-select: none; }
    th.sortable:hover { background: #f5f7f9 !important; }
    tr.data-row:hover td { background: #f0f2f5 !important; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="https://unpkg.com/@babel/standalone@7.25.6/babel.min.js"></script>
  <script type="importmap">
  {
    "imports": {
      "react":           "https://esm.sh/react@18.3.1",
      "react/":          "https://esm.sh/react@18.3.1/",
      "react-dom":       "https://esm.sh/react-dom@18.3.1",
      "react-dom/client":"https://esm.sh/react-dom@18.3.1/client",
      "@mui/material":   "https://esm.sh/@mui/material@5.16.7?external=react,react-dom,@emotion/react,@emotion/styled",
      "@mui/icons-material":"https://esm.sh/@mui/icons-material@5.16.7?external=react,react-dom,@emotion/react,@emotion/styled,@mui/material",
      "@emotion/react":  "https://esm.sh/@emotion/react@11.13.3?external=react",
      "@emotion/styled": "https://esm.sh/@emotion/styled@11.13.0?external=react,@emotion/react",
      "recharts":        "https://esm.sh/recharts@2.12.7?external=react,react-dom"
    }
  }
  </script>
  <script type="text/babel" data-type="module" data-presets="react">
    import React, { useState, useMemo } from 'react';
    import { createRoot } from 'react-dom/client';
    import {
      Dialog, DialogTitle, DialogContent, DialogActions,
      RadioGroup, FormControlLabel, Radio, Checkbox,
      TextField, Button, Slider,
      Tabs, Tab, Tooltip,
    } from '@mui/material';
    import {
      BarChart, Bar, XAxis, YAxis, CartesianGrid,
      Tooltip as RTooltip, Legend, ResponsiveContainer
    } from 'recharts';

    // ── PALETTE ───────────────────────────────────────────────────────────────────
    const NAV_BG     = '#1b2a3b';
    const NAV_ACCENT = '#00b4a6';
    const TAB_BLUE   = '#3b4960';
    const RED_NUM    = '#c62828';
    const TEAL_NUM   = '#00796b';
    const PURPLE_NUM = '#6a1b9a';
    const GD_NAVY    = '#2d3a4e';
    const GD_RED     = '#e53935';
    const GD_FUTURE  = '#c0c8d4';
    const CHIP_BG    = '#eceff1';
    const CHIP_TXT   = '#546e7a';
    const TH_COLOR   = '#78909c';
    const RISK_RED   = '#c62828';
    const BODY_TEXT  = '#37474f';
    const BODY_LIGHT = '#90a4ae';
    const BORDER     = '#e0e3e7';

    // ── DATA ──────────────────────────────────────────────────────────────────────
    const GD_DAYS = ['GD-5','GD-4','GD-2','GD-1','GD'];

    // f=stripe fraction, a=actual metres, tgt=target metres. GD-3 removed.
    const GD_PATTERNS = [
      [{t:'under',d:'20 UNDER',f:.07,a:9800, tgt:10000},{t:'over', d:'30 OVER', f:.14,a:10300,tgt:10000},{t:'over', d:'30 OVER', f:.14,a:10300,tgt:10000},{t:'under',d:'20 UNDER',f:.07,a:9800, tgt:10000},{t:'future',d:'',f:0,a:null,tgt:10000}],
      [{t:'under',d:'15 UNDER',f:.05,a:9850, tgt:10000},{t:'under',d:'10 UNDER',f:.04,a:9900, tgt:10000},{t:'target',d:'ON TARGET',f:0,a:10000,tgt:10000},{t:'over', d:'20 OVER', f:.10,a:10200,tgt:10000},{t:'future',d:'',f:0,a:null,tgt:10000}],
      [{t:'over', d:'30 OVER', f:.14,a:10300,tgt:10000},{t:'target',d:'ON TARGET',f:0,a:10000,tgt:10000},{t:'under',d:'15 UNDER',f:.05,a:9850, tgt:10000},{t:'target',d:'ON TARGET',f:0,a:10000,tgt:10000},{t:'future',d:'',f:0,a:null,tgt:10000}],
      [{t:'target',d:'ON TARGET',f:0,a:10000,tgt:10000},{t:'over', d:'40 OVER', f:.19,a:10400,tgt:10000},{t:'under',d:'10 UNDER',f:.04,a:9900, tgt:10000},{t:'over', d:'25 OVER', f:.10,a:10250,tgt:10000},{t:'future',d:'',f:0,a:null,tgt:10000}],
      [{t:'under',d:'50 UNDER',f:.24,a:9500, tgt:10000},{t:'under',d:'30 UNDER',f:.14,a:9700, tgt:10000},{t:'over', d:'20 OVER', f:.10,a:10200,tgt:10000},{t:'under',d:'15 UNDER',f:.05,a:9850, tgt:10000},{t:'future',d:'',f:0,a:null,tgt:10000}],
    ];

    const GROUPS = ['Starter','Non starter','Rehab','Academy','On loan'];

    const RAW_PLAYERS = [
      {id:1,  name:'Dan Jones',      pos:'LB',  group:'Starter',     acwr:1.8, risk:'High',   todayM:4200, weekToDate:11000, weekOver:1800, rolling7:12500, targetTomorrow:10000},
      {id:2,  name:'Marcus Webb',    pos:'CB',  group:'Starter',     acwr:1.9, risk:'High',   todayM:3900, weekToDate:10500, weekOver:500,  rolling7:11800, targetTomorrow:10000},
      {id:3,  name:'Tom Brady',      pos:'GK',  group:'Starter',     acwr:0.9, risk:'Low',    todayM:3100, weekToDate:9200,  weekOver:200,  rolling7:10500, targetTomorrow:9000},
      {id:4,  name:'Aaron Reid',     pos:'RB',  group:'Starter',     acwr:1.7, risk:'High',   todayM:4500, weekToDate:11200, weekOver:1200, rolling7:12800, targetTomorrow:10500},
      {id:5,  name:'Kyle Foster',    pos:'CB',  group:'Starter',     acwr:1.0, risk:'Low',    todayM:3700, weekToDate:9800,  weekOver:0,    rolling7:11200, targetTomorrow:9500},
      {id:6,  name:'Owen Clarke',    pos:'CM',  group:'Starter',     acwr:1.2, risk:'Low',    todayM:3800, weekToDate:10100, weekOver:100,  rolling7:11600, targetTomorrow:9800},
      {id:7,  name:'Ryan Moss',      pos:'AM',  group:'Starter',     acwr:1.6, risk:'High',   todayM:4100, weekToDate:10800, weekOver:800,  rolling7:12200, targetTomorrow:10000},
      {id:8,  name:'Scott Allen',    pos:'ST',  group:'Starter',     acwr:1.1, risk:'Low',    todayM:3600, weekToDate:9600,  weekOver:0,    rolling7:11000, targetTomorrow:9200},
      {id:9,  name:'James Hunt',     pos:'CM',  group:'Non starter', acwr:1.8, risk:'High',   todayM:2800, weekToDate:7500,  weekOver:500,  rolling7:8500,  targetTomorrow:7000},
      {id:10, name:'Luca Rossi',     pos:'RW',  group:'Non starter', acwr:1.1, risk:'Medium', todayM:3000, weekToDate:8000,  weekOver:0,    rolling7:9000,  targetTomorrow:7500},
      {id:11, name:'Euan Blair',     pos:'LW',  group:'Non starter', acwr:0.9, risk:'Low',    todayM:2900, weekToDate:7800,  weekOver:0,    rolling7:8800,  targetTomorrow:7200},
      {id:12, name:'Nathan Park',    pos:'CB',  group:'Non starter', acwr:1.5, risk:'Medium', todayM:3100, weekToDate:8200,  weekOver:200,  rolling7:9200,  targetTomorrow:7800},
      {id:13, name:'Callum West',    pos:'RB',  group:'Non starter', acwr:1.7, risk:'High',   todayM:2700, weekToDate:7200,  weekOver:700,  rolling7:8200,  targetTomorrow:6800},
      {id:14, name:'Felix Meyer',    pos:'ST',  group:'Rehab',       acwr:0.7, risk:'High',   todayM:1500, weekToDate:4000,  weekOver:0,    rolling7:4500,  targetTomorrow:4000},
      {id:15, name:'Ali Hassan',     pos:'LW',  group:'Rehab',       acwr:0.6, risk:'High',   todayM:1200, weekToDate:3200,  weekOver:0,    rolling7:3800,  targetTomorrow:3500},
      {id:16, name:'Chris Lane',     pos:'CB',  group:'Rehab',       acwr:0.8, risk:'Medium', todayM:1800, weekToDate:4800,  weekOver:0,    rolling7:5200,  targetTomorrow:4500},
      {id:17, name:'Joe Murphy',     pos:'GK',  group:'Rehab',       acwr:0.5, risk:'High',   todayM:900,  weekToDate:2400,  weekOver:0,    rolling7:2800,  targetTomorrow:2500},
      {id:18, name:'Pedro Silva',    pos:'RB',  group:'Academy',     acwr:1.8, risk:'High',   todayM:3200, weekToDate:8500,  weekOver:500,  rolling7:9500,  targetTomorrow:8000},
      {id:19, name:'Sam Wright',     pos:'CM',  group:'Academy',     acwr:0.8, risk:'Medium', todayM:2800, weekToDate:7400,  weekOver:0,    rolling7:8400,  targetTomorrow:7000},
      {id:20, name:'Leo Burns',      pos:'LB',  group:'Academy',     acwr:1.3, risk:'Low',    todayM:3000, weekToDate:8000,  weekOver:0,    rolling7:9000,  targetTomorrow:7500},
      {id:21, name:"Finn O'Brien",   pos:'AM',  group:'Academy',     acwr:0.7, risk:'High',   todayM:2600, weekToDate:6800,  weekOver:0,    rolling7:7800,  targetTomorrow:6500},
      {id:22, name:'Yuki Tanaka',    pos:'AM',  group:'On loan',     acwr:1.8, risk:'High',   todayM:3500, weekToDate:9200,  weekOver:1200, rolling7:10500, targetTomorrow:9000},
      {id:23, name:'Ben Carter',     pos:'ST',  group:'On loan',     acwr:1.4, risk:'Medium', todayM:3200, weekToDate:8500,  weekOver:500,  rolling7:9500,  targetTomorrow:8000},
      {id:24, name:'Hugo Diaz',      pos:'RW',  group:'On loan',     acwr:1.0, risk:'Low',    todayM:3000, weekToDate:7900,  weekOver:0,    rolling7:9000,  targetTomorrow:7500},
      {id:25, name:'Marc Lefort',    pos:'CB',  group:'On loan',     acwr:1.6, risk:'High',   todayM:3800, weekToDate:9800,  weekOver:800,  rolling7:11000, targetTomorrow:9000},
    ];

    const PLAYERS = RAW_PLAYERS.map((p, i) => ({
      ...p,
      gdData: GD_PATTERNS[i % GD_PATTERNS.length],
      status: p.acwr > 1.5 ? 'over' : p.acwr < 0.8 ? 'under' : 'target',
    }));

    const GROUP_ROWS = GROUPS.map((g, i) => ({
      group: g,
      todayM: [4000, 3000, 1800, 3000, 3400][i],
      weekToDate: [10000, 8000, 4000, 8000, 9000][i],
      weekOver: [1600, 500, 0, 0, 800][i],
      rolling7: [12000, 9000, 4500, 9000, 10000][i],
      acwr: [1.8, 1.4, 0.7, 1.2, 1.5][i],
      risk: ['High','Medium','High','Low','Medium'][i],
      targetTomorrow: [10000, 7500, 4000, 7500, 8500][i],
      gdData: GD_PATTERNS[i % GD_PATTERNS.length],
      thisWeek: [62400, 48200, 21500, 57800, 53600][i],
      avg3wk:   [65100, 51800, 24300, 60200, 57400][i],
    }));

    const CHART_DATA = GROUP_ROWS.map(g => ({
      name: g.group === 'On loan' ? 'On loan' : g.group,
      'This week': g.thisWeek,
      '3 week average': g.avg3wk,
    }));

    // ── GD BAR ────────────────────────────────────────────────────────────────────
    // Red stripe at TOP = over target (proportional to overage)
    // Purple stripe at BOTTOM = under target (proportional to shortfall)
    // All dark navy = on target | Light grey = future day
    const GD_PURPLE = '#7b1fa2';
    function GdBar({ gd }) {
      const { t, d, f = 0, a, tgt } = gd;
      const isFuture  = t === 'future';
      const isOver    = t === 'over';
      const isUnder   = t === 'under';
      const isTarget  = t === 'target';
      const BAR_H     = 42;
      const stripeH   = Math.max(2, Math.round(f * BAR_H));
      const stripePattern = `repeating-linear-gradient(-45deg, #2d3a4e 0px, #2d3a4e 3px, #3d4e64 3px, #3d4e64 6px)`;
      const barBg     = isFuture ? GD_FUTURE : isTarget ? TEAL_NUM : stripePattern;
      const deltaColor = isOver ? GD_RED : isTarget ? TEAL_NUM : isUnder ? GD_PURPLE : BODY_LIGHT;

      const tipContent = isFuture
        ? (tgt ? `Target: ${tgt.toLocaleString()}m` : '')
        : (a != null && tgt != null)
          ? `${a.toLocaleString()}m / ${tgt.toLocaleString()}m`
          : '';

      const bar = (
        <div style={{ display:'flex', flexDirection:'column', alignItems:'center', width:44, cursor: tipContent ? 'default' : undefined }}>
          <div style={{ width:44, height:BAR_H, background:barBg, position:'relative', borderRadius:'1px' }}>
            {isOver && <div style={{ position:'absolute', top:0, left:0, width:44, height:stripeH, background:GD_RED, borderRadius:'1px 1px 0 0' }} />}
            {isUnder && <div style={{ position:'absolute', top:0, left:0, width:44, height:stripeH, background:GD_PURPLE, borderRadius:'1px 1px 0 0' }} />}
          </div>
          <span style={{ fontSize:'8px', color:deltaColor, lineHeight:'1', marginTop:'3px', whiteSpace:'nowrap' }}>{d || '\u00A0'}</span>
        </div>
      );

      return tipContent
        ? <Tooltip title={tipContent} arrow placement="top"><span>{bar}</span></Tooltip>
        : bar;
    }

    // ── CHIPS ─────────────────────────────────────────────────────────────────────
    function GroupChip({ label }) {
      return (
        <span style={{
          background:CHIP_BG, color:CHIP_TXT,
          fontSize:12, padding:'2px 10px',
          borderRadius:16, display:'inline-block',
          whiteSpace:'nowrap', lineHeight:'20px',
        }}>{label}</span>
      );
    }

    function RiskBadge({ risk }) {
      const bg = risk === 'High' ? RISK_RED : risk === 'Medium' ? '#e65100' : '#2e7d32';
      return (
        <span style={{
          background:bg, color:'#fff',
          fontSize:12, fontWeight:600, padding:'4px 14px',
          borderRadius:20, display:'inline-block', whiteSpace:'nowrap',
        }}>{risk}</span>
      );
    }

    // ── SUMMARY CARDS ─────────────────────────────────────────────────────────────
    function SummaryCard({ count, label, color, active, onClick }) {
      return (
        <div onClick={onClick} style={{
          width:216, minHeight:127, background:'#fff',
          border:`1px solid ${active ? color : BORDER}`,
          borderRadius:4, padding:'12px 16px 14px',
          cursor:'pointer', position:'relative',
          boxShadow: active ? `0 0 0 1px ${color}` : '0 1px 3px rgba(0,0,0,.06)',
          transition:'box-shadow .15s, border-color .15s',
        }}>
          {active && (
            <span className="material-icons-outlined" style={{ position:'absolute', top:12, right:12, fontSize:18, color }}>filter_list</span>
          )}
          <div style={{ fontSize:80, fontWeight:700, lineHeight:1, color, marginBottom:4 }}>{count}</div>
          <div style={{ fontSize:13, color:BODY_LIGHT }}>{label}</div>
        </div>
      );
    }

    // ── TABLE STYLES ──────────────────────────────────────────────────────────────
    const TH = {
      fontSize:13, fontWeight:500, color:BODY_TEXT,
      padding:'10px 12px',
      borderBottom:`1px solid ${BORDER}`,
      whiteSpace:'nowrap', background:'#fff', textAlign:'left',
    };
    const TD = {
      fontSize:13, color:BODY_TEXT,
      padding:'0 12px',
      borderBottom:`1px solid ${BORDER}`,
      verticalAlign:'middle',
    };
    const TD_GD = { ...TD, padding:'8px 4px', textAlign:'center' };

    // ── SORT HELPERS ──────────────────────────────────────────────────────────────
    function SortArrow({ col, sortCol, sortDir }) {
      if (sortCol !== col) return <span style={{ fontSize:12, color:'#cfd8dc', marginLeft:3 }}>↕</span>;
      return <span style={{ fontSize:12, color:TAB_BLUE, marginLeft:3 }}>{sortDir === 'asc' ? '↑' : '↓'}</span>;
    }

    function useSortedRows(rows, sortCol, sortDir, getVal) {
      return useMemo(() => {
        if (!sortCol) return rows;
        return [...rows].sort((a, b) => {
          const av = getVal(a, sortCol);
          const bv = getVal(b, sortCol);
          if (av == null) return 1;
          if (bv == null) return -1;
          const cmp = typeof av === 'string' ? av.localeCompare(bv) : av - bv;
          return sortDir === 'asc' ? cmp : -cmp;
        });
      }, [rows, sortCol, sortDir]);
    }

    // ── INDIVIDUALS TABLE ─────────────────────────────────────────────────────────
    function IndividualsTable({ rows }) {
      const [sortCol, setSortCol] = useState(null);
      const [sortDir, setSortDir] = useState('asc');

      function handleSort(col) {
        if (sortCol === col) setSortDir(d => d === 'asc' ? 'desc' : 'asc');
        else { setSortCol(col); setSortDir('asc'); }
      }

      function getVal(p, col) {
        const map = {
          name: p.name, group: p.group, todayM: p.todayM,
          weekToDate: p.weekToDate, rolling7: p.rolling7,
          acwr: p.acwr, targetTomorrow: p.targetTomorrow, risk: p.risk,
        };
        return map[col] ?? null;
      }

      const sorted = useSortedRows(rows, sortCol, sortDir, getVal);

      function thSort(col, label, style = {}) {
        return (
          <th className="sortable" onClick={() => handleSort(col)} style={{ ...TH, ...style }}>
            {label}<SortArrow col={col} sortCol={sortCol} sortDir={sortDir} />
          </th>
        );
      }

      const gdThStyle    = { ...TH, width:52, textAlign:'center', padding:'10px 4px' };
      const todayThStyle = { ...TH, width:52, textAlign:'center', padding:'10px 4px', fontWeight:600, color:BODY_TEXT, borderTop:`2px solid ${BODY_TEXT}` };
      const gdRegStyle   = { ...TH, width:52, textAlign:'center', padding:'10px 4px' }; // GD-1 — no TODAY marker

      return (
        <div style={{ overflowX:'auto' }}>
          <table style={{ borderCollapse:'collapse', width:'100%', minWidth:1060 }}>
            <thead>
              <tr>
                {thSort('name',          'Athlete', { paddingLeft:24 })}
                {thSort('group',         'Group')}
                {thSort('todayM',        'Today (m)')}
                {thSort('weekToDate',    'Week to date')}
                {thSort('rolling7',      '7 day rolling avg.')}
                {thSort('acwr',         'ACWR')}
                <th style={gdThStyle}>GD-5</th>
                <th style={gdThStyle}>GD-4</th>
                <th style={gdThStyle}>GD-2</th>
                <th style={gdRegStyle}>GD-1</th>
                <th style={todayThStyle}>GD</th>
                {thSort('targetTomorrow','Target tomorrow')}
                {thSort('risk',          'Risk', { paddingRight:24 })}
              </tr>
            </thead>
            <tbody>
              {sorted.map((p) => (
                <tr key={p.id} className="data-row">
                  <td style={{ ...TD, paddingLeft:24 }}>
                    <div style={{ padding:'12px 0 10px' }}>
                      <div style={{ fontWeight:500, fontSize:13 }}>{p.name}</div>
                      <div style={{ fontSize:11, color:BODY_LIGHT }}>{p.pos}</div>
                    </div>
                  </td>
                  <td style={TD}><GroupChip label={p.group} /></td>
                  <td style={TD}>{p.todayM.toLocaleString()}</td>
                  <td style={TD}>
                    <div>{p.weekToDate.toLocaleString()}</div>
                    {p.weekOver > 0 && <div style={{ fontSize:11, color:'#e57373' }}>({p.weekOver.toLocaleString()} over)</div>}
                  </td>
                  <td style={TD}>{p.rolling7.toLocaleString()}</td>
                  <td style={TD}>{p.acwr}</td>
                  {p.gdData.map((gd, di) => (
                    <td key={di} style={TD_GD}><GdBar gd={gd} /></td>
                  ))}
                  <td style={TD}>{(p.targetTomorrow/1000).toFixed(0)}k</td>
                  <td style={{ ...TD, paddingRight:24 }}><RiskBadge risk={p.risk} /></td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      );
    }

    // ── GROUPS TABLE ──────────────────────────────────────────────────────────────
    function GroupsTable({ rows }) {
      const [sortCol, setSortCol] = useState(null);
      const [sortDir, setSortDir] = useState('asc');

      function handleSort(col) {
        if (sortCol === col) setSortDir(d => d === 'asc' ? 'desc' : 'asc');
        else { setSortCol(col); setSortDir('asc'); }
      }

      function getVal(g, col) {
        const map = {
          group: g.group, todayM: g.todayM, weekToDate: g.weekToDate,
          rolling7: g.rolling7, acwr: g.acwr,
          targetTomorrow: g.targetTomorrow, risk: g.risk,
        };
        return map[col] ?? null;
      }

      const sorted = useSortedRows(rows, sortCol, sortDir, getVal);

      function thSort(col, label, style = {}) {
        return (
          <th className="sortable" onClick={() => handleSort(col)} style={{ ...TH, ...style }}>
            {label}<SortArrow col={col} sortCol={sortCol} sortDir={sortDir} />
          </th>
        );
      }

      const gdThStyle    = { ...TH, width:52, textAlign:'center', padding:'10px 4px' };
      const todayThStyle = { ...TH, width:52, textAlign:'center', padding:'10px 4px', fontWeight:600, color:BODY_TEXT, borderTop:`2px solid ${BODY_TEXT}` };
      const gdRegStyle   = { ...TH, width:52, textAlign:'center', padding:'10px 4px' }; // GD-1 — no TODAY marker

      return (
        <div style={{ overflowX:'auto' }}>
          <table style={{ borderCollapse:'collapse', width:'100%', minWidth:1000 }}>
            <thead>
              <tr>
                {thSort('group',         'Group', { paddingLeft:24 })}
                {thSort('todayM',        'Today (m)')}
                {thSort('weekToDate',    'Week to date')}
                {thSort('rolling7',      '7 day rolling avg.')}
                {thSort('acwr',         'ACWR')}
                <th style={gdThStyle}>GD-5</th>
                <th style={gdThStyle}>GD-4</th>
                <th style={gdThStyle}>GD-2</th>
                <th style={gdRegStyle}>GD-1</th>
                <th style={todayThStyle}>GD</th>
                {thSort('targetTomorrow','Target tomorrow')}
                {thSort('risk',          'Risk', { paddingRight:24 })}
              </tr>
            </thead>
            <tbody>
              {sorted.map((g) => (
                <tr key={g.group} className="data-row">
                  <td style={{ ...TD, paddingLeft:24 }}><GroupChip label={g.group} /></td>
                  <td style={TD}>{g.todayM.toLocaleString()}</td>
                  <td style={TD}>
                    <div>{g.weekToDate.toLocaleString()}</div>
                    {g.weekOver > 0 && <div style={{ fontSize:11, color:'#e57373' }}>({g.weekOver.toLocaleString()} over)</div>}
                  </td>
                  <td style={TD}>{g.rolling7.toLocaleString()}</td>
                  <td style={TD}>{g.acwr}</td>
                  {g.gdData.map((gd, di) => (
                    <td key={di} style={TD_GD}><GdBar gd={gd} /></td>
                  ))}
                  <td style={TD}>{(g.targetTomorrow/1000).toFixed(0)}k</td>
                  <td style={{ ...TD, paddingRight:24 }}><RiskBadge risk={g.risk} /></td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      );
    }

    // ── CUSTOM TICK ───────────────────────────────────────────────────────────────
    function CustomXAxisTick({ x, y, payload }) {
      const lines = payload.value.split('\n');
      return (
        <g transform={`translate(${x},${y})`}>
          {lines.map((line, i) => (
            <text key={i} x={0} y={0} dy={14 + i*14} textAnchor="middle" fill="#78909c" fontSize={11}>{line}</text>
          ))}
        </g>
      );
    }

    // ── TARGET MODAL ──────────────────────────────────────────────────────────────
    const DAYS_OF_WEEK = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];

    function TargetModal({ open, onClose }) {
      const [workloadMode, setWorkloadMode] = useState('equal');
      const [checked, setChecked] = useState({Mon:true,Tue:false,Wed:true,Thu:true,Fri:true,Sat:false,Sun:false});
      const [manual, setManual] = useState({Mon:'10000',Tue:'10000',Wed:'10000',Thu:'10000',Fri:'10000',Sat:'10000',Sun:'10000'});
      const [sliderKm, setSliderKm] = useState(10);

      return (
        <Dialog open={open} onClose={onClose} maxWidth="xs" fullWidth
          PaperProps={{ elevation:4, sx:{ borderRadius:'4px', m:2 } }}>
          <DialogTitle sx={{ fontSize:20, fontWeight:700, pb:1, pt:3, px:3, color:'#212121' }}>
            Set regular gameweek target
          </DialogTitle>
          <DialogContent sx={{ px:3, pt:1, pb:0 }}>

            {/* Slider */}
            <div style={{ marginBottom:24 }}>
              <div style={{ display:'flex', justifyContent:'space-between', alignItems:'baseline', marginBottom:4 }}>
                <span style={{ fontSize:13, color:'#78909c' }}>Total distance</span>
                <span style={{ fontSize:16, fontWeight:600, color:'#212121' }}>{sliderKm} km</span>
              </div>
              <Slider
                value={sliderKm}
                min={0} max={60} step={1}
                onChange={(_, v) => setSliderKm(v)}
                sx={{
                  color: TAB_BLUE,
                  height:4,
                  '& .MuiSlider-thumb':{ width:16, height:16 },
                  '& .MuiSlider-rail':{ opacity:.3 },
                }}
              />
              <div style={{ display:'flex', justifyContent:'space-between', marginTop:-4 }}>
                <span style={{ fontSize:11, color:'#90a4ae' }}>0 km</span>
                <span style={{ fontSize:11, color:'#90a4ae' }}>60 km</span>
              </div>
            </div>

            <div style={{ fontSize:14, fontWeight:500, color:'#212121', marginBottom:10 }}>Workload</div>
            <RadioGroup value={workloadMode} onChange={e => setWorkloadMode(e.target.value)}>
              <FormControlLabel value="equal"
                control={<Radio size="small" sx={{ color:TAB_BLUE,'&.Mui-checked':{ color:TAB_BLUE } }} />}
                label={<span style={{ fontSize:14, color:'#37474f' }}>Apply equal to all training days</span>}
                sx={{ mb:.5 }}
              />
              <FormControlLabel value="manual"
                control={<Radio size="small" sx={{ color:TAB_BLUE,'&.Mui-checked':{ color:TAB_BLUE } }} />}
                label={<span style={{ fontSize:14, color:'#37474f' }}>Set each manually</span>}
              />
            </RadioGroup>

            <div style={{ fontSize:14, fontWeight:500, color:'#212121', marginTop:16, marginBottom:10 }}>
              Select training days
            </div>
            <div style={{ display:'flex', gap:8, marginBottom:4 }}>
              {DAYS_OF_WEEK.map(d => (
                <div key={d} style={{ display:'flex', flexDirection:'column', alignItems:'center', gap:4, flex:1 }}>
                  <span style={{ fontSize:12, color:'#546e7a', fontWeight:400 }}>{d}</span>
                  <Checkbox
                    checked={!!checked[d]}
                    onChange={() => setChecked(prev => ({ ...prev, [d]:!prev[d] }))}
                    size="small"
                    sx={{
                      p:0,
                      color: checked[d] ? TAB_BLUE : '#cfd8dc',
                      '&.Mui-checked':{ color:TAB_BLUE },
                      '& .MuiSvgIcon-root':{ fontSize:20 },
                    }}
                  />
                  {workloadMode === 'manual' && (
                    <input
                      type="number"
                      value={checked[d] ? manual[d] : ''}
                      disabled={!checked[d]}
                      onChange={e => setManual(prev => ({ ...prev, [d]:e.target.value }))}
                      style={{
                        width:'100%', fontSize:12, textAlign:'center',
                        padding:'4px 2px', borderRadius:3,
                        border:`1px solid ${checked[d] ? TAB_BLUE : '#e0e3e7'}`,
                        background: checked[d] ? '#fff' : '#f5f5f5',
                        color: checked[d] ? '#37474f' : '#bdbdbd',
                        outline:'none', boxSizing:'border-box',
                      }}
                    />
                  )}
                </div>
              ))}
            </div>

          </DialogContent>
          <DialogActions sx={{ px:3, pb:3, pt:2, justifyContent:'flex-end', gap:.5 }}>
            <Button onClick={onClose} variant="text"
              sx={{ textTransform:'none', fontSize:13, color:'#546e7a', px:2, py:.75, minWidth:0 }}>
              Cancel
            </Button>
            <Button onClick={onClose} variant="contained"
              sx={{ textTransform:'none', fontSize:13, bgcolor:TAB_BLUE, px:2.5, py:.75,
                borderRadius:'4px', boxShadow:'none',
                '&:hover':{ bgcolor:'#2d3a4e', boxShadow:'none' } }}>
              Done
            </Button>
          </DialogActions>
        </Dialog>
      );
    }

    // ── NAV ───────────────────────────────────────────────────────────────────────
    const NAV_ICONS = [
      { icon:'apps',          label:'Dashboard' },
      { icon:'fitness_center',label:'Training' },
      { icon:'bar_chart',     label:'Analytics' },
      { icon:'groups',        label:'Squad' },
      { icon:'calendar_today',label:'Planning', active:true },
      { icon:'assignment',    label:'Reports' },
    ];

    function SideNav() {
      return (
        <div style={{
          width:60, flexShrink:0, background:NAV_BG,
          display:'flex', flexDirection:'column',
          alignItems:'center', paddingTop:8, paddingBottom:12,
        }}>
          <div style={{
            width:36, height:36, borderRadius:8, background:'#0f1f2e',
            display:'flex', alignItems:'center', justifyContent:'center', marginBottom:20,
          }}>
            <span style={{ fontSize:16, fontWeight:800, color:'#fff', fontFamily:'Georgia,serif' }}>K</span>
          </div>
          <div style={{
            width:32, height:32, borderRadius:6, background:'rgba(255,255,255,.08)',
            display:'flex', alignItems:'center', justifyContent:'center', cursor:'pointer', marginBottom:12,
          }}>
            <span className="material-icons-outlined" style={{ fontSize:18, color:'rgba(255,255,255,.6)' }}>add</span>
          </div>
          {NAV_ICONS.map((item, i) => (
            <Tooltip key={i} title={item.label} placement="right">
              <div style={{
                width:40, height:36, borderRadius:6,
                display:'flex', alignItems:'center', justifyContent:'center',
                cursor:'pointer', marginBottom:2, position:'relative',
                background: item.active ? 'rgba(255,255,255,.1)' : 'transparent',
              }}>
                {item.active && (
                  <div style={{ position:'absolute', left:0, top:6, bottom:6, width:3, background:NAV_ACCENT, borderRadius:'0 2px 2px 0' }} />
                )}
                <span className="material-icons-outlined" style={{ fontSize:20, color: item.active ? '#fff' : 'rgba(255,255,255,.4)' }}>{item.icon}</span>
              </div>
            </Tooltip>
          ))}
          <div style={{ flex:1 }} />
          <div style={{ display:'flex', flexDirection:'column', alignItems:'center', gap:4 }}>
            <Tooltip title="Settings" placement="right">
              <div style={{ width:40, height:36, display:'flex', alignItems:'center', justifyContent:'center', cursor:'pointer' }}>
                <span className="material-icons-outlined" style={{ fontSize:20, color:'rgba(255,255,255,.4)' }}>settings</span>
              </div>
            </Tooltip>
            <Tooltip title="Help" placement="right">
              <div style={{ width:40, height:36, display:'flex', alignItems:'center', justifyContent:'center', cursor:'pointer' }}>
                <span className="material-icons-outlined" style={{ fontSize:20, color:'rgba(255,255,255,.4)' }}>help_outline</span>
              </div>
            </Tooltip>
            <div style={{ width:30, height:30, borderRadius:15, background:'rgba(255,255,255,.1)',
              display:'flex', alignItems:'center', justifyContent:'center', cursor:'pointer', marginTop:4 }}>
              <span className="material-icons-outlined" style={{ fontSize:16, color:'rgba(255,255,255,.5)' }}>person</span>
            </div>
          </div>
        </div>
      );
    }

    // ── CONTROLS INPUT — grey bg, dark bottom border, top corners rounded ────────
    function CtrlInput({ label, value, icon = 'arrow_drop_down', onClick }) {
      return (
        <div onClick={onClick} style={{ cursor: onClick ? 'pointer' : 'default', minWidth:180 }}>
          <div style={{
            background:'#f5f5f5',
            borderRadius:'2px 2px 0 0',
            borderBottom:`1px solid ${BODY_TEXT}`,
            padding:'5px 10px 6px',
          }}>
            <div style={{ fontSize:10, color:BODY_TEXT, lineHeight:1, marginBottom:2 }}>{label}</div>
            <div style={{ display:'flex', alignItems:'center', gap:2 }}>
              <span style={{ fontSize:13, color:BODY_TEXT, flex:1 }}>{value}</span>
              <span className="material-icons" style={{ fontSize:18, color:BODY_TEXT }}>{icon}</span>
            </div>
          </div>
        </div>
      );
    }

    // ── APP ───────────────────────────────────────────────────────────────────────
    function App() {
      const [tab, setTab] = useState(0);
      const [metric, setMetric] = useState('distance');
      const [filterStatus, setFilterStatus] = useState(null);
      const [modalOpen, setModalOpen] = useState(false);

      const counts = useMemo(() => ({
        over:   PLAYERS.filter(p => p.status === 'over').length,
        target: PLAYERS.filter(p => p.status === 'target').length,
        under:  PLAYERS.filter(p => p.status === 'under').length,
      }), []);

      const filtered = useMemo(() => {
        if (!filterStatus) return PLAYERS;
        return PLAYERS.filter(p => p.status === filterStatus);
      }, [filterStatus]);

      return (
        <div style={{ display:'flex', height:'100vh', overflow:'hidden' }}>
          <SideNav />

          <div style={{ flex:1, display:'flex', flexDirection:'column', overflow:'hidden', minWidth:0 }}>

            {/* Top bar */}
            <div style={{ height:48, display:'flex', alignItems:'center', padding:'0 24px', borderBottom:`1px solid ${BORDER}`, flexShrink:0 }}>
              <span style={{ fontSize:13, color:TH_COLOR }}>Planning</span>
              <div style={{ flex:1 }} />
              <span style={{ fontSize:13, color:BODY_TEXT, marginRight:4 }}>Primary Squad</span>
              <span className="material-icons" style={{ fontSize:18, color:TH_COLOR }}>arrow_drop_down</span>
              <div style={{ width:32, height:32, borderRadius:16, background:'#cfd8dc', marginLeft:12, display:'flex', alignItems:'center', justifyContent:'center', overflow:'hidden' }}>
                <span className="material-icons" style={{ fontSize:18, color:'#546e7a' }}>person</span>
              </div>
            </div>

            {/* Page title row */}
            <div style={{ display:'flex', alignItems:'center', padding:'12px 24px', borderBottom:`1px solid ${BORDER}`, flexShrink:0 }}>
              <span style={{ fontSize:20, fontWeight:400, color:'#37474f', letterSpacing:'0.01em' }}>
                Workload tracking
              </span>
              <div style={{ flex:1 }} />
              <div style={{ display:'flex', border:`1px solid #c5cae9`, borderRadius:4, overflow:'hidden', height:40 }}>
                {[
                  { v:'distance', l:'Total distance (m)' },
                  { v:'acwr',     l:'ACWR' },
                ].map(({ v, l }, i) => (
                  <button key={v} onClick={() => setMetric(v)} style={{
                    height:40, padding:'0 14px', cursor:'pointer',
                    fontSize:13, fontWeight: metric===v ? 500 : 400,
                    background: metric===v ? '#F0F1F3' : '#fff',
                    color: TAB_BLUE,
                    border: 'none',
                    borderRight: i === 0 ? `1px solid #c5cae9` : 'none',
                    transition:'background .15s',
                  }}>{l}</button>
                ))}
              </div>
              <Tooltip title="Settings">
                <button style={{ marginLeft:8, background:'none', border:'none', cursor:'pointer', display:'flex', alignItems:'center', padding:6, borderRadius:4 }}>
                  <span className="material-icons-outlined" style={{ fontSize:20, color:TH_COLOR }}>settings</span>
                </button>
              </Tooltip>
            </div>

            {/* Controls row */}
            <div style={{ display:'flex', alignItems:'center', gap:16, padding:'10px 24px 8px', flexShrink:0 }}>
              <CtrlInput label="Gameweek" value="IS7-Wolves" icon="calendar_today" />
              <CtrlInput label="Regular target" value="20–22k" onClick={() => setModalOpen(true)} />
              <CtrlInput label="Rehab target" value="10-12k" />
              <button style={{ background:'none', border:'none', cursor:'pointer', padding:4, display:'flex', alignItems:'center' }}>
                <span className="material-icons-outlined" style={{ fontSize:22, color:TH_COLOR }}>add</span>
              </button>
            </div>

            {/* Tabs */}
            <div style={{ borderBottom:`1px solid ${BORDER}`, padding:'4px 24px 0', flexShrink:0 }}>
              <Tabs value={tab} onChange={(_, v) => setTab(v)} textColor="inherit" sx={{
                minHeight:40,
                '& .MuiTab-root':{ minHeight:40, textTransform:'none', fontSize:14, fontWeight:600, color:'#546E7A !important', padding:'6px 12px', marginRight:4 },
                '& .Mui-selected':{ color:`${TAB_BLUE} !important`, fontWeight:600 },
                '& .MuiTabs-indicator':{ background:TAB_BLUE, height:2 },
              }}>
                <Tab label="Individuals" />
                <Tab label="Groups" />
              </Tabs>
            </div>

            {/* Content — no horizontal padding; table cells carry their own first/last column insets */}
            <div style={{ flex:1, overflow:'auto' }}>

              {tab === 0 && (
                <>
                  <div style={{ display:'flex', gap:16, padding:'24px 24px 16px' }}>
                    <SummaryCard count={counts.over}   label="Overtraining"  color={RED_NUM}    active={filterStatus==='over'}   onClick={() => setFilterStatus(f => f==='over'   ? null : 'over')} />
                    <SummaryCard count={counts.target} label="On track"      color={TEAL_NUM}   active={filterStatus==='target'} onClick={() => setFilterStatus(f => f==='target' ? null : 'target')} />
                    <SummaryCard count={counts.under}  label="Undertraining" color={PURPLE_NUM} active={filterStatus==='under'}  onClick={() => setFilterStatus(f => f==='under'  ? null : 'under')} />
                  </div>
                  <IndividualsTable rows={filtered} />
                </>
              )}

              {tab === 1 && (
                <>
                  <div style={{ paddingTop:24 }}><GroupsTable rows={GROUP_ROWS} /></div>
                  <div style={{ margin:'24px 24px', border:`1px solid ${BORDER}`, borderRadius:4, padding:'20px 24px 16px' }}>
                    <div style={{ fontSize:16, fontWeight:400, color:BODY_TEXT, marginBottom:16 }}>Group comparison</div>
                    <ResponsiveContainer width="100%" height={260}>
                      <BarChart data={CHART_DATA} barCategoryGap="35%" barGap={3} margin={{ top:4, right:8, bottom:20, left:16 }}>
                        <CartesianGrid strokeDasharray="3 3" stroke="#eeeeee" vertical={false} />
                        <XAxis dataKey="name" tick={<CustomXAxisTick />} axisLine={false} tickLine={false} height={40} />
                        <YAxis tick={{ fontSize:11, fill:TH_COLOR }} axisLine={false} tickLine={false}
                          label={{ value:'Metres', angle:-90, position:'insideLeft', dx:-8, style:{ fontSize:11, fill:TH_COLOR } }} />
                        <RTooltip cursor={{ fill:'transparent' }} contentStyle={{ fontSize:12, borderRadius:4, border:`1px solid ${BORDER}` }} />
                        <Legend iconType="square" iconSize={12} wrapperStyle={{ fontSize:12, color:TH_COLOR, paddingTop:8 }} />
                        <Bar dataKey="This week"      fill="#26C6DA" radius={[2,2,0,0]} label={{ position:'top', fontSize:11, fontWeight:600, fill:'#26C6DA' }} />
                        <Bar dataKey="3 week average" fill="#7c3aed" radius={[2,2,0,0]} label={{ position:'top', fontSize:11, fontWeight:600, fill:'#7c3aed' }} />
                      </BarChart>
                    </ResponsiveContainer>
                  </div>
                </>
              )}
            </div>
          </div>

          <TargetModal open={modalOpen} onClose={() => setModalOpen(false)} />
        </div>
      );
    }

    createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
